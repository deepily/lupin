# ============================================================================
# Lupin — GCP cloud-GPU deployment (model server on Cloud Run, scale-to-zero).
#
# This is the cloud-GPU variant of docker-compose.cloud-test.yml. It is
# IDENTICAL to that file EXCEPT it OMITS the local `lupin-model-server` GPU
# container and instead points the app at a Cloud Run GPU service via the
# LUPIN_MODEL_SERVER_URL env override (the resolver in
# cosa/memory/{speech_to_text,embedding}_provider.py:_resolve_model_server_url()
# reads that env var FIRST — no lupin-app.ini edit is needed for the switch).
#
# Use this on a CPU-ONLY VM (no L4 attached) once the model server has been
# deployed to Cloud Run via src/scripts/cloud-run-model-server-deploy.sh.
#
# Design of record:
#   src/rnd/2026.06.30-gpu-model-server-cloud-run-split/01-design.md
#   (the "Local → cloud transmogrification" section — env switch, not rewrite)
#
# Required env on the VM (e.g. a git-ignored cloud-gpu.env, or `--env-file`):
#   LUPIN_MODEL_SERVER_URL=https://lupin-model-server-XXXX.run.app   # Cloud Run output
#   CLOUD_SQL_CONNECTION_NAME=<your-gcp-project-id>:us-central1:lupin-pg16-test
#   DB_PASSWORD=<from Secret Manager `lupin-db-password` at deploy>
#   JWT_SECRET_KEY=<signing secret; unset silently uses the in-repo dev literal>
#   LUPIN_IMAGE=<AR path>/lupin:1.1.0      (or local `lupin:1.1.0`)
# Optional (defaults shown):
#   DB_USER=lupin_app  DB_NAME=lupin_db_test
#
# Launch:
#   docker compose -f docker-compose.cloud-gpu.yml --env-file cloud-gpu.env up -d
# ============================================================================

services:
  # --- Socket-volume init (one-shot) -----------------------------------------
  # The proxy image runs as nonroot uid 65532 and cannot mkdir inside a fresh
  # (root-owned) named volume; chown it first so both the proxy and lupin-rest
  # (uid 1001) can use the shared socket dir.
  # Also rm any STALE .s.PGSQL.5432 left on the persistent volume by a prior
  # boot: on a VM stop/suspend the socket file survives shutdown, and the proxy
  # then crash-loops "bind address already in use" on unsuspend (bug 300bc7ca —
  # recurs on every resume under suspended-by-default). The proxy re-creates the
  # socket at /cloudsql/<CONN>/.s.PGSQL.5432, so the glob clears it idempotently
  # (rm -f no-ops when the glob doesn't match, e.g. first-ever bring-up).
  cloudsql-socket-init:
    image: busybox:1.36
    container_name: lupin-cloudsql-socket-init
    command: ["sh", "-c", "rm -f /cloudsql/*/.s.PGSQL.5432 /cloudsql/.s.PGSQL.5432 && chown 65532:65532 /cloudsql && chmod 0777 /cloudsql"]
    restart: "no"
    volumes:
      - cloudsql-socket:/cloudsql

  # --- Cloud SQL Auth Proxy (sidecar) ---------------------------------------
  cloud-sql-proxy:
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.1
    container_name: lupin-cloudsql-proxy
    restart: unless-stopped
    depends_on:
      cloudsql-socket-init:
        condition: service_completed_successfully
    command:
      - "--unix-socket=/cloudsql"
      - "--private-ip"
      - "--health-check"                    # serves /startup,/readiness,/liveness on localhost:9090
      - "${CLOUD_SQL_CONNECTION_NAME:?set CLOUD_SQL_CONNECTION_NAME}"
    volumes:
      - cloudsql-socket:/cloudsql
    healthcheck:
      # Distroless image — no /bin/sh, so probe via the proxy binary's own
      # `wait` subcommand against the --health-check endpoint on :9090.
      test: ["CMD", "/cloud-sql-proxy", "wait", "--max=5s"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - lupin-cloud-network

  # --- Lupin REST API (cloud-backed, mount model) ---------------------------
  # NOTE vs docker-compose.cloud-test.yml: NO depends_on lupin-model-server
  # (that service is on Cloud Run now), and LUPIN_MODEL_SERVER_URL points at
  # the Cloud Run https URL instead of the local :7998 container.
  lupin-rest:
    image: ${LUPIN_IMAGE:-lupin:1.1.0}
    container_name: lupin-rest-cloud-gpu
    restart: unless-stopped
    user: "1001:1001"                       # matches the image's rruiz UID/GID (Dockerfile:37-38)
    # The HOST writes CC session bridges as its own uid (OS-Login, e.g. 1721846087);
    # the container runs as 1001. Neither can read the other's files by owner, so both
    # sides meet on a SHARED GROUP: the host dir is setgid + group-owned by this gid,
    # bridges are written 0660 (session_bridge.atomic_write_json), and the container
    # joins that gid here as a supplementary group. Parameterized — never hardcode the
    # gid, it differs per VM/OS-Login account. See src/rnd/v0.1.9/2026.07.24-vm-persona-
    # bridge-mount-uid-divergence.md (FINAL PLAN v3).
    group_add:
      - "${LUPIN_BRIDGE_GID:?set LUPIN_BRIDGE_GID (host gid owning ~/.claude/sessions; see 2026.07.24 R&D)}"
    ports:
      - "7999:7999"
    # host.docker.internal → host gateway so the in-container :7999 reverse-proxy
    # can PULL /state from the HOST-side arbiter on :8001 (mirrors cloud-test).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./src:/var/lupin/src                # mount model — code from the on-VM checkout
      - ./io:/var/lupin/io
      - ./src/conf/keys:/var/lupin/src/conf/keys:ro   # provider keys, out-of-band
      - cloudsql-socket:/cloudsql           # shared Auth-Proxy socket
      - claude-creds:/home/rruiz/.claude    # persistent CC OAuth login
      # CC session bridges — the HOST hook writes these; the container reads/rewrites
      # them via set_voice_persona(). Without this bind the claude-creds volume above
      # SHADOWS the host's sessions dir and request_persona() 404s (root cause, 07-24).
      # Nested deeper than claude-creds, so compose applies it after — verify with
      # `docker inspect` that BOTH mounts are present after any recreate.
      # Long form + create_host_path:false on purpose: a short ${HOME} bind silently
      # CREATES an empty dir when HOME is wrong (root/automation) or the path is absent,
      # which looks identical to "mounted but empty". Fail loud instead.
      - type: bind
        source: ${LUPIN_HOST_SESSIONS_DIR:?set LUPIN_HOST_SESSIONS_DIR (absolute path to the host's ~/.claude/sessions)}
        target: /home/rruiz/.claude/sessions
        bind:
          create_host_path: false
      # ---------------------------------------------------------------- multi-repo doc viewer
      # WITHOUT THESE, `[scope_registry] registered 0 external scope(s): []` and every
      # /api/io/file and /api/docs/file request 404s. That is what happened on 2026-07-25:
      # this file was written from the code-mount set only, and the two doc-viewer binds that
      # docker-compose.yml has carried since 2026-05-12 (`:158-159`, `:244-245`) were never
      # copied across. The container paths are FIXED by `lupin-app.ini § external repos`, so
      # the compose file is the only place they can be satisfied.
      #
      # ENUMERATED, NOT GLOBBED. Dev binds ONE directory (`.../projects:/var/external-projects`)
      # because that host directory holds nothing but repos. `/mnt/lupin-data` is NOT that
      # directory — it is also the docker data-root, so the equivalent one-liner would expose
      # `docker/volumes/lupin_claude-creds/_data` (the CC OAuth login) and the `*-wip.bundle`
      # files inside the read surface. Four explicit binds, and no shortcut.
      #
      # `create_host_path: false` IS LOAD-BEARING HERE — and it is load-bearing ON THE VM
      # SPECIFICALLY, which is the only reason this comment is trustworthy. Measured 2026-07-25
      # with a negative control on BOTH machines, because they do not agree:
      #
      #                                    dev (compose v2.19.1)    VM (compose v5.3.1)
      #   short  `- /host/x:/ctr/x:ro`     HOST DIR CREATED         HOST DIR CREATED
      #   long,  no create_host_path       not created              HOST DIR CREATED   <-- differs
      #   long + create_host_path: false   not created              not created
      #
      # On dev the long form alone is enough, so a probe run there says the key is redundant —
      # and that conclusion is FALSE for the machine this file deploys to. The key is what stops
      # the auto-create on the VM. (`docker compose config` renders `bind: {}` on both versions
      # and shows the key on neither, so the rendered config cannot answer this question either.)
      #
      # WHY AUTO-CREATE IS THE FAILURE THAT MATTERS: an auto-created empty dir means the registry
      # FINDS the path, registers the scope, and serves 404s for every file in it — with NO
      # warning, because from the registry's side the path exists. The per-repo skip+WARNING is
      # the fail-soft layer and it works; an auto-created empty dir is what robs it of the thing
      # it tests for. Loud absence beats a scope that resolves to nothing.
      #
      # The OTHER eight scopes in the INI (cosa-voice, lupin-mobile, claude-plans, lookml,
      # par-pacific, retail-ai-location-strategy, google-project-wonderwall, scratchpad) are
      # genuinely absent from this VM. Their startup WARNINGs are CORRECT and expected — they
      # are the registry reporting reality, not a defect to silence.
      - type: bind
        source: /mnt/lupin-data/lupin
        target: /var/external-projects/lupin
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: /mnt/lupin-data/planning-is-prompting
        target: /var/external-projects/planning-is-prompting
        read_only: true
        bind: { create_host_path: false }
      # skills-distillation is NOT on this VM — measured 2026-08-31 over IAP: absent
      # from /mnt/lupin-data/google/, which is exactly what stopped the container
      # starting (create_host_path: false, working as designed). Bind removed; the
      # scope is recorded in KNOWN_ABSENT instead. Restore both together if it is
      # ever cloned there. The two weil-* repos below WERE measured present.
      - type: bind
        source: /mnt/lupin-data/google/weil-parallel-search
        target: /var/external-projects/google/weil-parallel-search
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: /mnt/lupin-data/google/weil-nda-drafting-suite
        target: /var/external-projects/google/weil-nda-drafting-suite
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: /mnt/lupin-data/google/parallel-search
        target: /var/external-projects/google/parallel-search
        read_only: true
        bind: { create_host_path: false }
    environment:
      LUPIN_ROOT: /var/lupin
      LUPIN_ENV: testing
      # The ONLY cloud-backing trigger — is_cloud_backed() gates solely on this.
      LUPIN_CLOUD_BACKED: "true"
      CLOUD_SQL_CONNECTION_NAME: ${CLOUD_SQL_CONNECTION_NAME:?set CLOUD_SQL_CONNECTION_NAME}
      DB_USER: ${DB_USER:-lupin_app}
      DB_NAME: ${DB_NAME:-lupin_db_test}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD (from Secret Manager lupin-db-password)}
      LUPIN_CONFIG_MGR_CLI_ARGS: "config_path=/src/conf/lupin-app.ini splainer_path=/src/conf/lupin-app-splainer.ini config_block_id=Lupin:+Testing-GCS"
      # JWT signing secret (row adce3547 / bug 8df98a96, 2026-08-18). REQUIRED, and
      # `:?` rather than a default for a reason. HISTORY, because it explains the shape:
      # jwt_service.py used to raise only when ENVIRONMENT=production — which no service
      # sets — so unset did NOT fail, it silently signed with a fixed secret committed to
      # that source file. Both cloud services had been missing this variable since they
      # were written, so both were in exactly that state. The literal is now deleted and
      # jwt_service.py raises on unset in every environment; this `:?` is the second line
      # of defence rather than the only one. Value lives in the UNTRACKED host env file,
      # never a tracked one.
      # ⚠️ Env resolves at container CREATE: a change needs `up -d --force-recreate`.
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in the host env file — see row adce3547}
      LUPIN_API_URL: http://localhost:7999
      # ── THE ENV SWITCH ─────────────────────────────────────────────────────
      # Cloud Run model-server URL. The provider resolvers read this env var
      # FIRST (before the INI `model server url` key), so flipping local→cloud
      # is purely this one value — no INI change, no image rebuild. Required:
      # fail-loud if unset so a CPU-only VM never silently self-routes to a
      # non-existent local :7998 GPU container.
      LUPIN_MODEL_SERVER_URL: ${LUPIN_MODEL_SERVER_URL:?set LUPIN_MODEL_SERVER_URL to the Cloud Run service URL (https://lupin-model-server-XXXX.run.app)}
      LUPIN_API_KEY_FILE: /var/lupin/src/conf/keys/notification-api-claude-code-dev

      # The model-server client's OWN credential — set EXPLICITLY here, not left
      # to the code default (rows 574fd1dc / 6cc52525, 2026-07-28).
      #
      # ⚠️ THIS HOST IS WHY THE BUG WAS UNFIXABLE BY CONFIG ALONE. cloud-gpu set
      # no key-name var at all, so its client fell through to a HARDCODED literal
      # in embedding_provider.py — meaning a compose-only rename would have fixed
      # the two stacks that already set the var and left THIS one, the broken one,
      # broken. Stating it here removes that asymmetry.
      #
      # ⚠️ Must equal the Terraform `api_key_name` for the Cloud Run service
      # (terraform/envs/test/main.tf). The client sends what this names; the
      # server hashes what Terraform mounts. If they disagree, every request 401s
      # for the instance's whole life while the boot log still reads healthy.
      # src/rnd/v0.1.9/2026.07.28-model-server-api-key-decoupling.md
      LUPIN_MODEL_SERVER_API_KEY_NAME: model-server-api

      # NOTE: LUPIN_MODEL_SERVER_API_KEY_FILE removed (finding #7) — no code reads
      # it and it named the wrong key file (lupin-model-server-auth). The 3 other
      # compose files still carry the dead var (out of this remediation's scope).
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      PYTHONUNBUFFERED: "1"
      # bug b39c350d — this service bind-mounts `./src:/var/lupin/src` (line 100), so the VM's
      # on-disk `src/**/__pycache__` is shared between the container (repo root /var/lupin) and
      # anything running on the VM host against the same checkout. A .pyc bakes co_filename as
      # an absolute path and is NOT recompiled when mtime+size match, so the venue that did not
      # write the cache runs code naming a path it cannot resolve — degrading tracebacks and
      # coverage line-mapping silently. Same remedy as docker-compose.yml: send this
      # interpreter's bytecode to a container-local dir so the directory stops being shared.
      # Verified on 3.13: with pycache_prefix set, an existing in-tree __pycache__ entry is
      # IGNORED rather than merely not-updated, so pre-existing shared entries go inert.
      # ⚠️ Env change — takes effect only on `up -d --no-deps --force-recreate lupin-rest`,
      # NOT on a `docker restart`. (--no-deps per bug 70794d58.)
      PYTHONPYCACHEPREFIX: /tmp/pycache
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:7999/health', timeout=3)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    depends_on:
      cloud-sql-proxy:
        condition: service_healthy
    networks:
      - lupin-cloud-network

  # --- Lupin Model Server (GPU) — INTENTIONALLY OMITTED ---------------------
  # On this cloud-GPU topology the model server runs on Cloud Run (L4,
  # scale-to-zero), NOT as a local container. Deploy it with
  # src/scripts/cloud-run-model-server-deploy.sh and wire its URL into
  # LUPIN_MODEL_SERVER_URL above. (See docker-compose.cloud-test.yml for the
  # local single-VM GPU-container variant.)

volumes:
  # shared Auth-Proxy ↔ app unix-socket dir — tmpfs ON PURPOSE.
  #
  # A unix socket is a rendezvous point for two LIVE processes. It has no business
  # outliving them, and when it does it is not a socket any more — it is a file that
  # makes the next proxy fail to bind and the next app connect to nothing.
  #
  # Confirmed on lupin-host-test 2026-08-17: lupin-cloudsql-proxy crash-looping on
  # `bind: address already in use`, while lupin-cloudsql-socket-init — the container
  # written to clear exactly this — read `Exited (0) 13 days ago`. It is restart:"no",
  # and Docker's restart policy IGNORES depends_on, so on every reboot/resume the two
  # unless-stopped containers came back WITHOUT it. The app then hit a socket with no
  # listener: `Connection refused`, `Application startup failed. Exiting.` (bug
  # cd101a7e, and the recurrence of 300bc7ca that the init container did not stop.)
  #
  # tmpfs makes the directory die with the host, so there is nothing left to go stale.
  # The init container stays as belt-and-braces for the `compose up` path; this is the
  # braces, and it is the half that works on the path that actually broke.
  cloudsql-socket:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
  claude-creds:                             # CC OAuth login store for lupin-rest

networks:
  lupin-cloud-network:
    driver: bridge
