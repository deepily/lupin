# WebSocket Smoke Test Configuration
# Configuration for the WebSocket smoke test suite

[server]
# FastAPI server connection settings
base_url = localhost:7999
http_base = http://localhost:7999
ws_base = ws://localhost:7999
health_endpoint = /health

# Connection timeouts (seconds)
connection_timeout = 10.0
authentication_timeout = 5.0
event_wait_timeout = 10.0

[websocket]
# WebSocket endpoint paths
queue_endpoint = /ws/queue/
audio_endpoint = /ws/audio/

# Expected event types for subscription testing
queue_events = auth_success,auth_error,connect,sys_ping,queue_todo_update,queue_running_update,queue_done_update,queue_dead_update
audio_events = auth_success,auth_error,connect,sys_ping,audio_streaming_chunk,audio_streaming_status,audio_streaming_complete

[testing]
# Test execution settings
default_test_duration = 5.0
max_events_per_test = 50
max_concurrent_connections = 10

# Session ID generation
session_adjectives = wise,clever,brave,quick,calm,bright,noble,swift,bold,keen
session_nouns = penguin,giraffe,owl,lion,fox,bear,eagle,wolf,tiger,hawk

# Mock authentication
default_user_id = smoke_test_user
mock_token_prefix = mock_token_

[performance]
# Performance threshold settings (milliseconds)
max_connection_time = 500
max_authentication_time = 1000
max_event_delivery_time = 100

# Performance measurement
enable_performance_tracking = true
performance_samples = 5

[logging]
# Debug and logging settings
debug_enabled = true
log_timestamps = true
log_event_details = true
log_performance_metrics = true

[baselines]
# Performance baseline management
baseline_file = test_baselines.json
auto_update_baselines = false
baseline_tolerance_percent = 20

[test_categories]
# Test category configuration
run_core_tests = true
run_integration_tests = true
run_performance_tests = true
run_configuration_tests = true
run_visual_tests = false

# Individual test controls
test_basic_connection = true
test_authentication_flow = true
test_session_management = true
test_event_system = true
test_concurrent_connections = true
test_event_collection = true