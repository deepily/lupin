# Shared bounded embedding pool (bug 81854972). InputAndOutputTable.insert_io_row
# routes all async embedding work through ONE process-wide pool instead of spawning
# an unbounded daemon thread per call — the unbounded threads saturated the GPU+GIL
# and starved the asyncio event loop under fleet load (intermittent /health-timeout
# "hang"). max workers caps concurrent embeddings (event loop never starved); max
# pending bounds the backlog beyond the running workers (a sustained burst can't
# grow memory without limit — excess is dropped as backpressure, never blocks the
# caller). Runtime-tunable via embedding_pool.reconfigure_embedding_pool(...).
