# ============================================================================
# Model-server carve-out (port 7998) — see:
#   src/rnd/v0.1.7/2026.05.16-model-server-carveout/01-design.md
#
# When `speech to text provider = model-server`, the FastAPI lifespan SKIPS
# eager Whisper/encoder loads and the compute container routes /transcribe
# + /embeddings/* over HTTP to lupin-model-server. Default `local` preserves
# today's behavior (in-process loads) — keeps :7999/:8000 fully functional
# until the explicit switchover.
#
# `model server url` is the base URL of lupin-model-server. The env var
# `LUPIN_MODEL_SERVER_URL` overrides this INI value at runtime (mirrors the
# existing `LUPIN_APP_SERVER_URL` pattern in embedding_provider.py).
# ============================================================================
speech to text provider                   = model-server
model server url                          = http://lupin-model-server:7998

# Local Embedding Engines (GPU-based, CodeRankEmbed + nomic-embed-text-v1.5)
# Toggle: "openai" = existing OpenAI API | "local" = local GPU engines
# "model-server" = HTTP-proxy to lupin-model-server:7998 (see speech to text provider header)
embedding provider                        = local
local embedding device                    = cuda:0
local embedding code model name           = nomic-ai/CodeRankEmbed
local embedding code model dimensions     = 768
local embedding prose model name          = nomic-ai/nomic-embed-text-v1.5
local embedding prose model dimensions    = 768
local embedding prose matryoshka dim      = 768
local embedding dtype                     = float16
