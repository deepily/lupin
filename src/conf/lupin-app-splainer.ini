[default]

foo                               = the most ubiquitous variable name after 'i' and 'j' in programming

app verbose                       = Verbosity flag for flask app. Options are True or False, defaults to False.
app debug                         = Debugging flag for flask app. Options are True or False, defaults to False.
app silent                        = Silent flag for flask app. Options are True or False, defaults to False.
admin refresh source enabled      = Gate for POST /admin/refresh-source endpoint. When True AND LUPIN_ENV is test/testing, the endpoint re-execs the uvicorn process in place so bind-mounted source edits take effect. Defaults to False; overridden to True in [Lupin: Testing] and [Lupin: Testing-GCS].
peer queue allowed hosts          = Comma-separated list of host:port values that the peer-queue proxy (GET /api/admin/peer-queue/{queue_name}) and watcher service are allowed to call. Prevents SSRF from a compromised admin account by rejecting any host not on this list. Values MUST be docker-compose service names + in-container port (7999), NOT host-mapped ports — the dev container reaches peers over the compose network, not via localhost. Typical contents: lupin-rest-test:7999,lupin-rest-dev:7999.
app timezone                      = Timezone for application timestamps. Uses IANA timezone names (e.g., America/New_York for East Coast US, America/Los_Angeles for West Coast, UTC for universal time). Defaults to America/New_York. Automatically handles daylight saving time transitions.

stt device id                     = Device ID for STT model.  Options are 'cuda:0', 'cuda:1' or 'cpu', defaults to 'cuda:0'.
stt model id                      = Model ID for STT model.  Options are currently only 'distil-whisper/distil-large-v2', defaults to 'distil-whisper/distil-large-v2'.

embedding model name              = OpenAI embedding model to use for generating text embeddings. Options are 'text-embedding-ada-002', 'text-embedding-3-small', 'text-embedding-3-large'. Required for similarity search functionality.
embedding dimensions              = Standardized embedding vector length used by ALL providers (local and OpenAI). All LanceDB tables use this dimension for FixedSizeList schemas. OpenAI text-embedding-3-small supports MRL truncation to this size via the dimensions API parameter. Default is 768.
vector store backend              = v0.2.0 LanceDB->Postgres+pgvector migration-window flag (design section 6). Selects the vector-store storage backend the cosa/memory/* classes read from. One of 'lancedb' | 'postgres'. Default 'lancedb' preserves the pre-cutover path; flip to 'postgres' on the watched cutover, and back to 'lancedb' for rollback (the on-disk LanceDB store is untouched until end-of-soak teardown). An invalid value fails loud (ValueError) - no silent fallback.

spacy model name                  = spaCy language model to use for text normalization in the Normalizer module. Options include 'en_core_web_sm' (small/fast), 'en_core_web_md' (medium), 'en_core_web_lg' (large/accurate). Default is 'en_core_web_sm'. Must be installed via: python -m spacy download <model_name>

expand symbols to words           = Boolean flag to control symbol-to-word expansion in embedding normalization. When True, converts symbols and numbers to words (e.g., '@' → 'at sign', '123' → 'one two three'). When False, preserves symbols after gist extraction. Default is False. Useful for preventing expansion on short queries.

async embedding generation        = Boolean flag to control whether embedding generation runs asynchronously in insert_io_row method. When True, the method returns immediately while embeddings are generated in background threads. When False, the method waits for embeddings to complete before returning. Default is True for better responsiveness.

io tbl embedding pool max workers = Integer (bug 81854972) — number of worker threads in the shared BoundedEmbeddingPool that InputAndOutputTable.insert_io_row submits async embedding work to. Previously every notification/IO row spawned its OWN daemon thread; under fleet load the unbounded thread count saturated the GPU + GIL and starved the asyncio event loop, causing /health to time out and docker to flag the container 'unhealthy' (the intermittent dev-server 'hang'). Capping concurrent embeddings here means the event loop only ever competes with this many embedding threads for the GIL (PyTorch releases the GIL during GPU compute), so /health stays responsive. Default 2. Runtime-tunable via embedding_pool.reconfigure_embedding_pool(...).

io tbl embedding pool max pending = Integer (bug 81854972) — backlog allowance ABOVE the running workers for the shared BoundedEmbeddingPool. Total in-flight-or-queued embedding tasks are capped at (max workers + max pending); submissions beyond that are dropped as backpressure (counted in pool.dropped) rather than blocking the caller — the notify path must return immediately. Bounds memory under a sustained burst. Default 64 (with 2 workers at ~100ms/embed the pool clears ~1200/min, far above observed ~35/min, so drops are a pathological-overload backstop, not normal operation). Runtime-tunable via embedding_pool.reconfigure_embedding_pool(...).

# Model-server carve-out (lupin-model-server:7998)
speech to text provider                   = Toggle for the Whisper speech-to-text pipeline backend. Options: 'local' loads distil-whisper/distil-large-v3 in-process on cuda:0 (today's behavior); 'model-server' routes /api/upload-and-transcribe-{mp3,wav} over HTTP to lupin-model-server:7998. When 'model-server', the FastAPI lifespan SKIPS the eager Whisper load entirely, freeing ~2.3 GB of GPU 0 VRAM. Default 'local' preserves current behavior. See: src/rnd/v0.1.7/2026.05.16-model-server-carveout/01-design.md
model server url                          = Base URL of the lupin-model-server container hosting Whisper + 2 text encoders. Read by both 'embedding provider = model-server' and 'speech to text provider = model-server' code paths. The env var `LUPIN_MODEL_SERVER_URL` overrides this INI value at runtime (mirrors the `LUPIN_APP_SERVER_URL` env-override pattern in embedding_provider.py). Default 'http://lupin-model-server:7998' resolves via docker-compose service-name DNS inside the `lupin-dev-network`.
embedding http timeout seconds            = Read timeout (seconds) for the SINGLE-text embedding HTTP fallback, EmbeddingProvider._generate_embedding_via_http. Was a hardcoded 10 until bug 574fd1dc. Default 90 is sized off measurement, not preference: 12 of 12 Cloud Run cold starts observed 2026-07-25..27 took 31.5-66.0s (median 32.8s) to load whisper + code_rank_embed + nomic_embed_text_v1_5 on cuda:0, so any value at or below ~66 guarantees failure on a scale-to-zero service. Lower it ONLY for a venue where the model server is provably always warm.
embedding http batch timeout seconds      = Read timeout (seconds) for the BATCH embedding HTTP fallback, EmbeddingProvider._generate_embeddings_batch_via_http. Was a hardcoded 30. Kept strictly larger than 'embedding http timeout seconds' because a batch is MORE work than a single text — the old 10/30 pair was not wrong in that ordering, only in magnitude (30 still lost to every cold start measured).
embedding http retries                    = Number of ADDITIONAL attempts after the first for both embedding HTTP fallbacks. 0 disables retry entirely (single attempt). Exists so the first caller after an idle period absorbs the model-server warm-up instead of losing its row: with retries, attempt 1 may die on a cold start while attempt 2 lands on the now-warm instance. Only transport-level failures (RequestException) and HTTP 5xx/429 are retried — a 4xx such as 401 is a contract error and is raised immediately, since retrying a bad API key just multiplies the same rejection. Default 2.
embedding http retry backoff seconds      = Base delay (seconds, float) before the first retry; doubles each subsequent attempt (exponential backoff). Total worst-case wall time is roughly timeout * (1 + retries) + backoff * (2^retries - 1). Default 2.0.

# Local Embedding Engine Configuration
embedding provider                        = Toggle between embedding backends. Options: 'openai' uses existing OpenAI API (text-embedding-3-small, 1536 dims); 'local' uses GPU-based engines in-process (CodeRankEmbed + nomic-embed-text-v1.5, 768 dims); 'model-server' (added 2026-05-16) routes /api/embeddings/* over HTTP to lupin-model-server:7998 — same 768-dim output as 'local'. Switch at any time. Note: dimensions differ between 'openai' (1536) and 'local'/'model-server' (768), so LanceDB tables must match the active provider. Default is 'local'.
local embedding device                    = CUDA device for both local embedding models. Combined VRAM usage ~1.1-1.4 GB. Options: 'cuda:0', 'cuda:1', 'cpu'. Default is 'cuda:0'.
local embedding code model name           = HuggingFace model ID for the code embedding engine. Uses SentenceTransformer for loading. Default is 'nomic-ai/CodeRankEmbed' (137M params, 768-dim output, optimized for code search and retrieval).
local embedding code model dimensions     = Output embedding dimensions for the code model. Fixed at 768 for CodeRankEmbed (not configurable via Matryoshka). Used in schema definitions.
local embedding prose model name          = HuggingFace model ID for the prose embedding engine. Uses raw transformers (AutoModel) for full Matryoshka dimension control. Default is 'nomic-ai/nomic-embed-text-v1.5' (137M params, supports 64-768 dim via Matryoshka).
local embedding prose model dimensions    = Maximum output embedding dimensions for the prose model before Matryoshka truncation. Fixed at 768 for nomic-embed-text-v1.5. Used as the base dimension from which Matryoshka truncation derives the final output.
local embedding prose matryoshka dim      = Final embedding dimensions after Matryoshka truncation for prose model. Supported values: 64, 128, 256, 512, 768. Lower dimensions trade quality for storage savings and faster search. Default is 768 (full quality). This value determines the actual LanceDB schema dimension for prose embeddings.
local embedding dtype                     = PyTorch dtype for model inference. Options: 'float16' (~1.5x faster, negligible accuracy loss, recommended), 'float32' (full precision, slower), 'bfloat16' (if supported by GPU). Default is 'float16'.
local embedding code query prefix         = Prefix prepended to query text before encoding with CodeRankEmbed. Required by the model for asymmetric search (queries get prefix, documents do not). Default: 'Represent this query for searching relevant code:'
local embedding prose query prefix        = Prefix prepended to query text before encoding with nomic-embed-text-v1.5. Required by the model for asymmetric search. Must end with colon. Default: 'search_query:'
local embedding prose document prefix     = Prefix prepended to document text before encoding with nomic-embed-text-v1.5. Required by the model for asymmetric search. Must end with colon. Default: 'search_document:'

debug text truncation length      = Integer value controlling how many characters of text to show in debug output before truncating with '...'. Used in debug messages for input/output text display. Default is 48 characters. Higher values show more text but may clutter console output.

tts local url template            = URL string used to build arequest for the local TTS service
tts generation strategy           = Strategy for generating TTS audio.  Options are 'local' and 'openai', defaults to local.
tts interaction mode              = Selects between two permanent TTS interaction models for the cosa-voice MCP server. "chorus" (default) enables N sessions to be in speakerphone mode simultaneously; persona voices disambiguate at the listener's ear; no displacement, no asyncio.Lock. "solo" invokes today's monopoly behavior: one session at a time speaks via TTS, with asyncio.Lock + displacement when another session activates speakerphone, plus a green mic-monopoly pin in the multiplexer UI. Both modes are first-class and permanently maintained per the feature-flag preservation rule (src/rnd/v0.1.7/2026.05.11-tts-interaction-mode-solo-chorus/). Default: chorus (set to solo to revert to monopoly behavior). Room for future values like duet/trio/quartet if pair- or small-group-routing semantics become useful.

tts preview enabled               = Master switch for the TTS verbosity limiter (2026-05-13; boundary-scan rewrite 2026-05-22). When true, every TTS message is truncated client-side to roughly <tts preview fraction> of its length and only that slice is synthesized — saving TTS provider character costs because providers charge at request-time (not per byte streamed). Truncation jumps to the fraction mark, then scans forward to the next natural boundary: a sentence terminal ('.', '!', '?', ';'), an em/en-dash, or a newline (so punctuation-free technical lists are cut cleanly at the end of an item). Skipped when the message is shorter than <tts preview min chars>. Default: true. Set to false to disable truncation entirely (every message plays in full). Design doc: src/rnd/v0.1.7/2026.05.22-tts-limiter-boundary-scan.md.

tts preview fraction              = Target fraction of the TTS message LENGTH kept by the verbosity limiter. The limiter jumps to ceil(message_length * fraction) characters, then scans forward to the next natural boundary (sentence terminal, em/en-dash, or newline). The spoken slice is therefore at least this fraction and extends to the nearest clean stopping point. Range: (0.0, 1.0]. At 1.0 the entire message plays (limiter disabled for that message); at 0.0 the message is skipped entirely (no audio dispatched). Default: 0.25. The runtime slider in the notifications session strip overrides this per-session.

tts preview min chars             = Minimum character count for a TTS message to be limiter-eligible. Messages shorter than this play in full (not worth truncating a short alert). Threshold approximates "≈15 words / ≈5 seconds of audio." Range: 0+ chars. Set to 0 to apply the limiter to every message regardless of length. Default: 100.

auth mode                         = Authentication mode selection. Options: 'mock' (mock tokens for development), 'jwt' (real JWT tokens with database-backed users), 'firebase' (Firebase Admin SDK - future). IMPORTANT: Mock mode is NOT SECURE and should only be used in development. Production deployments must use 'jwt' or 'firebase'. Default is 'mock'.

jwt secret key                    = Secret key for signing JWT tokens. SECURITY: Must be set via environment variable JWT_SECRET_KEY. Generate with: python -c "import secrets; print(secrets.token_urlsafe(32))". Never commit secret keys to version control. Development: Can use default key (warning logged). Production: MUST set JWT_SECRET_KEY environment variable or startup will fail.

jwt algorithm                     = Algorithm for JWT signing. Options: 'HS256' (symmetric HMAC-SHA256), 'RS256' (asymmetric RSA-SHA256). Default is 'HS256' (simpler key management). Use RS256 only if you need to distribute public verification key separately.

jwt access token expire minutes   = Lifespan of access tokens in minutes. Default is 30 minutes (balance between security and user experience). Shorter values: Better security but more frequent refreshes. Longer values: Better UX but higher security risk if token stolen. Recommended range: 15-60 minutes.

jwt refresh token expire days     = Lifespan of refresh tokens in days. Default is 7 days (weekly re-login). Shorter values: More frequent logins but better security. Longer values: Less frequent logins but higher risk. Recommended range: 7-30 days.

jwt token refresh check interval mins = How often the browser checks whether the access token needs refreshing (minutes). Converted to milliseconds for setInterval. Default is 10 minutes.

jwt token refresh expiry threshold mins = How close to expiry the token must be before a proactive refresh is triggered (minutes). Converted to seconds for comparison. Default is 5 minutes.

jwt token refresh dedup window secs = Minimum time between consecutive token refresh attempts to prevent duplicate refreshes (seconds). Converted to milliseconds for dedup logic. Default is 60 seconds.

send email enabled                = Boolean flag to enable/disable actual SMTP email sending. When False (default), email functions return success without sending (useful for dev/test environments). When True, attempts to connect to SMTP server and send emails. Set to True in production with proper SMTP credentials. Default is False to prevent errors in environments without SMTP configuration.

smtp host                         = SMTP server hostname for sending emails. Common options: smtp.gmail.com (Gmail), smtp-mail.outlook.com (Outlook), smtp.sendgrid.net (SendGrid). Only used when send_email_enabled is True.

smtp port                         = SMTP server port number. Common values: 587 (TLS/STARTTLS), 465 (SSL), 25 (unencrypted). Default is 587. Only used when send_email_enabled is True.

smtp username                     = SMTP authentication username. Typically your email address or API key. Set via environment variable SMTP_USERNAME for security. Only used when send_email_enabled is True.

smtp password                     = SMTP authentication password or API token. Set via environment variable SMTP_PASSWORD for security. NEVER commit passwords to version control. Only used when send_email_enabled is True.

smtp from email                   = Email address shown as sender in outgoing emails. Should match domain of SMTP server for deliverability. Default is noreply@lupin.ai. Only used when send_email_enabled is True.

smtp use tls                      = Boolean flag to enable TLS/STARTTLS encryption for SMTP connection. Should be True for port 587, False for port 25. Default is True for security. Only used when send_email_enabled is True.

app base url                      = Base URL of the application, used in email verification and password reset links. Should match your deployment URL (e.g., https://yourdomain.com or http://localhost:7999 for development). Default is http://localhost:7999.

websocket enforce single session per user = Boolean flag to enforce single WebSocket session per user. When True, new connections will automatically close any existing sessions for the same user. When False, allows multiple concurrent sessions per user. Default is False.

websocket heartbeat enabled = Boolean flag to enable periodic heartbeat checks for WebSocket connections. When True, sends ping messages to detect dead connections. Default is True.

websocket heartbeat interval seconds = Integer value for seconds between heartbeat ping messages. Lower values detect dead connections faster but increase network traffic. Default is 30 seconds.

websocket cleanup enabled = Boolean flag to enable automatic cleanup of stale WebSocket sessions. When True, periodically removes sessions older than max age. Default is True.

websocket cleanup interval hours = Integer value for hours between automatic cleanup runs. Default is 1 hour.

websocket session max age hours = Integer value for maximum age in hours before a session is considered stale and eligible for cleanup. Default is 24 hours.
websocket available events = Comma-separated list of valid event types that can be subscribed to via WebSocket. Clients can subscribe to specific events or use '*' for all events. This list defines all possible event types in the system. Includes job_state_transition for fine-grained job queue movement notifications (todo->run, run->done, run->dead) with optional completion metadata. Includes job_removed for notifying clients when a job is forcefully deleted from a queue (run/done/dead) via DELETE /api/queue/{name}/{id}. Includes proxy_decision_new for real-time notification when the SWE Team decision proxy logs a new pending ratification decision (Phase 7). Includes conversation_mode_changed for the per-Claude-Code-session conversation/notification toggle (cosa-voice MCP) — emitted when the toggle flips so all UI clients holding that session card update their toggle widget; payload: {session_id, conversation_mode_active}.

# FCM Silent-Relay Wake Push (S6 — mobile ws_wake summons)
fcm wake push enabled = Boolean master switch for the FCM silent-relay wake channel (S6). When True AND Firebase credentials resolve, a content-free data-only ws_wake push is sent to a user's registered mobile devices when a notification is enqueued for them and they have no live WebSocket session marked client_type "mobile". When False, the FcmWakeService boots disabled and no pushes are ever sent. Default is True (the service still degrades to disabled gracefully when credentials are absent — OSQ-7).
fcm wake auth mode = How the REAL firebase_admin FCM init authenticates (feature-flag fork; both modes are permanent, first-class paths). "key_file" (DEFAULT, back-compat) resolves a downloaded Firebase service-account JSON via the env var named by "fcm service account credentials env var" and uses credentials.Certificate(path). "adc" uses Application Default Credentials (credentials.ApplicationDefault()) — the runtime service account (e.g. the GCE VM's attached service account), with NO downloaded key file and NO env var; this is the keyless path required when org policy iam.disableServiceAccountKeyCreation blocks downloading service-account JSON keys. Either way the service degrades to disabled gracefully (never raises) when credentials cannot be resolved — OSQ-7. Default is key_file.
fcm service account credentials env var = Name of the ENVIRONMENT VARIABLE whose value is the filesystem path to the Firebase service-account JSON used by the REAL firebase_admin FCM init (named app "lupin-fcm-wake") in "key_file" auth mode. The credentials file itself is never committed and its path never appears in this INI — only the env-var NAME does. Ignored when "fcm wake auth mode" is "adc". Deliberately separate from the mock Firebase AUTH layer in auth.py (F-S6-2 two-Firebases separation). Default is FCM_SERVICE_ACCOUNT_JSON.
fcm wake debounce seconds = Integer window in seconds during which at most ONE FCM wake push is sent per user, regardless of how many notifications are enqueued for them (a wake is a summons, not a stream — S6 §3.3). Default is 60.

# Notifications Configuration (Phase 2 - SSE Response-Required)
enable response required notifications = Boolean flag to enable response-required notifications (Phase 2 feature). When False, only fire-and-forget notifications are supported. When True, enables notifications that wait for user responses. Default is False until Phase 2.1 backend is complete.

enable sse blocking = Boolean flag to enable Server-Sent Events (SSE) blocking mode for synchronous notifications. When False, all notifications are asynchronous (fire-and-forget). When True, allows Claude Code to send notifications that block until user responds. Default is False until Phase 2.1 backend is complete.

notification timeout default seconds = Integer value for default timeout in seconds for response-required notifications. If a notification doesn't specify its own timeout, this default is used. User has this many seconds to respond before the notification expires and returns the default answer. Default is 120 seconds (2 minutes).

notification grace period seconds = Number of seconds after the original timeout expires during which the server will still accept a response. If user pauses to think, their response is accepted within this window. Default is 300 seconds (5 minutes).

notification offline immediate default = Boolean flag to control offline behavior for response-required notifications. When True, immediately returns default answer if user is offline (no active WebSocket connection). When False, waits full timeout period even if user is offline. Default is True (return immediately when offline).

# Deep Research Agent Rate Limiting Configuration
deep research web search tokens per minute = Maximum input tokens per minute allowed by Anthropic's web search API. Default is 30,000. Each web search typically returns ~80,000 tokens of results, so rate limiting is required between calls. Adjust based on your Anthropic API tier limits.

deep research web search window seconds    = Sliding window duration in seconds for token rate tracking. Default is 60 seconds (1 minute). The rate limiter tracks total tokens consumed within this window and calculates delays to stay under the tokens-per-minute limit.

deep research rate limit notify threshold  = Minimum delay in seconds before notifying the user about rate limiting. Delays shorter than this value are applied silently. Default is 5 seconds. Helps reduce notification noise for brief delays.

deep research output path                  = Directory path (relative to LUPIN_ROOT) where deep research reports are saved with YAML frontmatter. Default is /io/deep-research. Reports are named YYYY.MM.DD-{semantic-topic}.md with metadata including query, abstract, cost, tokens, and model information.

deep research storage backend             = Storage backend for deep research report output. Options: 'local' (filesystem, default) or 'gcs' (Google Cloud Storage). When 'local', reports are saved to the local path specified in 'deep research output path'. When 'gcs', reports are uploaded to the bucket specified in 'deep research gcs bucket'. Both modes use user folder prefixing for multi-tenancy: {base_path}/{user_email}/filename.md

deep research gcs bucket                  = Google Cloud Storage bucket URI for deep research report storage when storage_backend='gcs'. Must start with 'gs://' (e.g., gs://lupin-deep-research-prod/). User email is appended as folder prefix for multi-tenancy. Requires Application Default Credentials (ADC) configured. See: gcloud auth application-default login

deep research default user email          = Default user email for deep research report folder prefixing in Development config only. Reads from LUPIN_DEV_EMAIL environment variable via ${LUPIN_DEV_EMAIL} interpolation. Used when --user-email CLI argument is not provided. Production/Testing-GCS configs require explicit --user-email parameter for security. Format: valid email address (e.g., user@example.com)

deep research audience                    = Target expertise level for research output. Controls depth, terminology, and assumptions in prompts and final report. Options: 'beginner' (define terms, include fundamentals), 'general' (balanced depth), 'expert' (assume baseline knowledge, focus on novelty/trade-offs), 'academic' (include citations, methodology critique). Default is 'academic'. CLI override: --audience

deep research audience context            = Optional custom description of the target audience beyond the level. Provides additional context for prompt customization. Example: "AI architect with master's degree, familiar with LLMs and distributed systems". When set, this context is injected into prompts alongside the target audience level. CLI override: --audience-context

# Deep Research Model Selection
deep research lead model                  = Claude model for the lead/orchestrator agent handling planning, clarification, and synthesis. Higher reasoning capability recommended. Default: claude-opus-4-6. Override via env var for testing new models.
deep research subagent model              = Claude model for research subagents executing parallel web search tasks. Cost-optimized model recommended. Default: claude-sonnet-4-6.

# Deep Research Scaling Heuristics
deep research max subagents simple        = Maximum number of parallel subagents for simple research queries. Default: 1.
deep research max subagents moderate      = Maximum number of parallel subagents for moderate complexity queries. Default: 4.
deep research max subagents complex       = Maximum number of parallel subagents for complex research queries. Default: 10.

# Deep Research Execution Limits
deep research max concurrent subagents    = Maximum subagents executing concurrently via asyncio.gather(). Caps parallelism regardless of query complexity. Default: 5.
deep research max research iterations     = Maximum iterations of the research loop before forcing synthesis. Prevents runaway execution. Default: 3.
deep research max tool calls per subagent = Maximum tool calls (web search, etc.) each subagent can make. Prevents excessive API usage per subquery. Default: 15.
deep research max clarification rounds    = Maximum rounds of clarification dialogue with the user before proceeding. Default: 2.
deep research max research turns          = Bounded-CC (D-DR2): per-call max_turns cap for the in-process sdk_query research path. Lead agent (no tools) uses ~1 turn; a search subagent's WebSearch/WebFetch iterations need headroom. Default: 20.

# Deep Research Token Budgets
deep research extended thinking budget    = Token budget for Claude's extended thinking feature on the lead agent. Default: 10000.
deep research subagent context limit      = Maximum context window tokens for each subagent. Default: 100000.
deep research max findings tokens         = Maximum total tokens across all subagent findings before truncation. Default: 50000.

# Deep Research COSA Integration
deep research feedback timeout seconds    = Timeout in seconds for waiting on user feedback during research. Default: 300 (5 minutes).
deep research stream thoughts to voice    = Whether to stream research agent's internal thinking to voice output. Default: true.
deep research narrate progress            = Whether to send voice notifications at each research phase. Default: true.

# Deep Research Search Configuration
deep research search tool                 = Anthropic tool name for web search. Default: web_search_20250305. Updated when new search tool versions are released.
deep research prefer primary sources      = Whether to instruct subagents to prefer primary/original sources over secondary. Default: true.
deep research min sources per subquery    = Minimum number of sources each subagent should find per subquery. Default: 3.
deep research max sources per subquery    = Maximum number of sources each subagent should find per subquery. Default: 10.

# Deep Research Output Configuration
deep research include confidence scores    = Whether to include confidence scores in research output. Default: true.
deep research include source quality notes = Whether to include source quality assessments in research output. Default: true.
deep research citation style              = Citation format for the research report. Options: 'inline' (parenthetical), 'footnote' (numbered footnotes), 'endnote' (end of report). Default: inline.

# WebSocket Event Type Explanations:
tts_job_request = Sends job completion text for text-to-speech conversion
audio_streaming_status = Status updates during TTS audio generation (loading, error, etc.)
audio_streaming_complete = Notification when TTS audio streaming is finished
audio_streaming_chunk = Binary audio data chunks for progressive TTS playback
notification_queue_update = Real-time updates from the notification queue system
notification_play_sound = Commands to play notification sound files
notification_expired = Broadcast when a response-required notification times out without user response
notification_responded = Broadcast when a user submits a response to a response-required notification
sys_time_update = Real-time clock updates for client displays
sys_ping = WebSocket heartbeat ping from server to client
sys_pong = WebSocket heartbeat response from client to server
auth_request = Authentication request message from client
auth_success = Authentication successful confirmation from server
auth_error = Authentication failed notification from server
connect = WebSocket connection establishment confirmation
status = Generic status messages
error = Generic error messages
update_subscriptions = Commands to modify client event subscriptions

# ElevenLabs TTS Configuration Explanations:
elevenlabs tts default model                     = Default ElevenLabs model to use for TTS generation. Options are 'eleven_turbo_v2_5' (higher quality, ~400ms latency) or 'eleven_flash_v2_5' (faster, ~75ms latency). Default is 'eleven_turbo_v2_5'.
elevenlabs tts default voice id                  = Default ElevenLabs voice ID. Default is '21m00Tcm4TlvDq8ikWAM' (Rachel - Female, American, Calm & Clear). Popular options: Rachel (21m00Tcm4TlvDq8ikWAM), Adam (pNInz6obpgDQGcFmaJgB), Sarah (EXAVITQu4vr4xnSDxMaL), Brian (nPczCjzI2devNBz1zQrb), Domi (AZnzlk1XvdvUeBnXmlld), Arnold (VR6AewLTigWG4xSOukaG).
elevenlabs tts default stability                 = Voice stability setting (0.0-1.0). Higher values create more consistent voice, lower values allow more expressiveness. Default is 0.5.
elevenlabs tts default similarity boost          = Similarity boost setting (0.0-1.0). Higher values make voice closer to original, lower values allow more variation. Default is 0.5.
elevenlabs tts default style                     = Style/expressiveness setting (0.0-1.0). Higher values add more emotional expressiveness to speech. Default is 0.0 for consistent delivery.
elevenlabs tts default use speaker boost         = Boolean flag to enable speaker boost for enhanced clarity, especially useful for phone/compressed audio. Default is False.
elevenlabs tts default speed                     = Speech speed multiplier (0.25-4.0). Values above 1.0 increase speed, below 1.0 decrease speed. Default is 1.0 (normal speed).
elevenlabs tts default quality profile           = Default quality profile to use for TTS generation. Options are 'balanced', 'fast', or 'quality'. Default is 'balanced'.

# ElevenLabs TTS Quality Profile Explanations:
elevenlabs tts profile balanced model            = Model used for balanced profile. Defaults to 'eleven_flash_v2_5' for good balance of speed and quality.
elevenlabs tts profile balanced stability        = Stability setting for balanced profile. Set to 0.65 for consistent but expressive voice.
elevenlabs tts profile balanced similarity boost = Similarity boost for balanced profile. Set to 0.75 for good voice fidelity.
elevenlabs tts profile balanced style            = Style setting for balanced profile. Set to 0.3 for moderate expressiveness.
