stop hook idle behavior                  = Thread A (2026-06-06): what the Stop hook does on a no-poke (idle) Stop, one of { none | ask | idle_announce }. Default `idle_announce`. `none` = take no action, silently allow the stop. `ask` = the legacy idle-waiter / "Anything else?" path (arms a deferred waiter when idle_detection.enabled, else fires the immediate prompt). `idle_announce` = fire ONE low-priority non-blocking status notify in which the session's persona announces it is idle ("I'm <persona>. Idle — nothing owed."), then allow the stop. The legacy idle-waiter is no longer the default because v2.1 direct-state visibility (arbiter bridge-mtime pull) now owns fleet liveness, superseding the per-Stop push. Speakerphone/chorus sessions short-circuit before this gate and never idle-announce. See src/rnd/v0.1.8/2026.06.06-heartbeat-poke-scaffold-vs-v2.1-supersession.md.
heartbeat manager goal line              = Role-goal poke echo (role-goals Phase 2-3, 2026-06-24 — D1; MANAGE-not-BUILD revision 2026-06-29). The compressed Manager "north-star goal" line appended to a heartbeat poke when the poked session's role resolves to manager. The revised value carries THREE emphatic MUST clauses — (1) "manage, never build" (catch yourself implementing → STOP and spawn), (2) "staff proactively, unprompted" (unassigned or idle-worker work owes a spawn THIS tick; waiting to be tapped is a redline), and (3) "surface user-blockers" (anything blocking you on the user → a HIGH-PRIORITY action-required ask THIS tick; never bury it, never sit; re-ask until answered — role-goals.md v1.2 Face-B clause) — then the help-peers + report-and-re-spin tail. Selected at the arbiter sites (view["role"]=="manager") and the cascade scheduler (manager-only); at the Stop-hook self-poke it is a documented defensive branch (managers are not spawned with a role, so they normally receive this line via the arbiter, not the self-poke). Held as runtime config so the wording can be retuned live without a redeploy. CANONICAL human-readable source (verbatim echo): planning-is-prompting -> workflow/role-goals.md §"Injection: the poke echo". Keep faithful by eyeball on edit (D4: no automated keyword test — it would fight live retuning).
heartbeat worker goal line               = Role-goal poke echo (role-goals Phase 2-3, 2026-06-24 — D1). The compressed Worker "north-star goal" line appended to a heartbeat poke when the poked session's role resolves to a worker (a spawned session's bridge role: author/reviewer/tester/worker/etc). Selected at the Stop-hook self-poke (bridge role present) and the arbiter stuck-poke (view["role"] != "manager"). Held as runtime config (retune live, no redeploy). CANONICAL source (verbatim echo): planning-is-prompting -> workflow/role-goals.md §"Injection: the poke echo". Keep faithful by eyeball on edit (D4: no automated keyword test).
heartbeat role-agnostic goal line        = Role-goal poke echo (role-goals Phase 2-3, 2026-06-24 — D1/D2). The compressed role-AGNOSTIC fallback "north-star goal" line appended to a heartbeat poke when the poked session's role cannot be determined (D2 graceful fallback — e.g. a non-spawned session whose bridge carries no role). Held as runtime config (retune live, no redeploy). CANONICAL source (verbatim echo): planning-is-prompting -> workflow/role-goals.md §"Injection: the poke echo". Keep faithful by eyeball on edit (D4: no automated keyword test).
stop hook spinup check threshold seconds = Proactive-manager mechanism (fcb5dbc0, Lane A1 — Face A / item 11). The debounce window (seconds) for the crew-spin-up NUDGE folded into the Stop-hook work-owed oracle. While a manager's last spin-up self-check (`last_spinup_check_ts` in its hold artifact) is older than this AND it has a backlog >= `stop hook spinup backlog min` AND idle crew capacity (live workers < cap), the oracle names "consider spinning up a crew" as owed work; the manager then decides + acts of its own accord (a nudge, never an auto-spin). Self-clears when the manager stamps the timestamp. Default 600 (10 min, mirrors T_escalate / the 6929f4ac verification window). Deploy-tunable.
stop hook surface questions threshold seconds = Proactive-manager mechanism (fcb5dbc0, Lane A1 — Face B / item 1). The debounce window (seconds) for re-surfacing OPEN operator gates, folded into the Stop-hook work-owed oracle. While a session's last operator-gate re-surface (`last_surfaced_questions_ts` in its hold artifact) is older than this AND it holds >= 1 open operator gate, the oracle names a re-surface as owed work so a decision the human owes is never buried under a "ball's in your court" park. One per-manager debounce (D3) that generalizes the per-gate re-ask timers. Self-clears when the session stamps the timestamp after re-firing its asks. Default 600 (10 min). Deploy-tunable.
stop hook spinup backlog min             = Proactive-manager mechanism (fcb5dbc0, Lane A1 — Face A backlog floor). The minimum backlog size (count of the manager's queued + in_progress owed items, gathered via task_query(accountable_manager=me)) below which NO crew-spin-up nudge fires — a manager judges small backlogs itself. Default 3. Deploy-tunable.
arbiter poll seconds                     = Heartbeat Arbiter v2.2 standing-cadence poll interval (seconds). How often the standing ArbiterConsumerJob rebuilds the fleet view + renders the snapshot. Default 60 (matches the v2.1 render cadence). Deploy-tunable.
arbiter manager on duty                  = Heartbeat Arbiter v2.2 DECLARED manager-on-duty fallback (the v2.1-era single manager_recipient). Used only when a stuck worker's own manager cannot be resolved from spawn-lineage (D5 per-group routing is preferred + automatic). NOT a hardcoded persona — set it to the on-duty manager's persona/session for a non-default fallback; otherwise the role-label default `manager-on-duty` stands and unresolved cases escalate to Rick. Default `manager-on-duty`.
arbiter alive threshold seconds          = Heartbeat Arbiter liveness "alive" window (seconds): a session whose freshest signal is within this age is treated as alive. Default 600. Must be > the quiet threshold (F3 invariant).
arbiter quiet threshold seconds          = Heartbeat Arbiter idle-roster "quiet" window (seconds): the inference idle floor. Must be < the alive threshold (F3 invariant — else the inference idle-window is empty). Default 300.
arbiter count dm as liveness             = Heartbeat Arbiter DM-as-liveness toggle (2026-06-17, Rick). When True (default), a session's most-recent SENT ai_to_ai DM (max created_at of direction='ai_to_ai' notification rows in the last ~1h, attributed by the sender_id '#'-suffix session id) counts as a 5th LIVENESS signal (dm_age_s) in the arbiter's freshest-of union — closing the coordination-only / MCP-tool coverage hole where a manager whose ONLY activity is dm_send (no Read/Edit/Bash, so its bridge-mtime never bumps) ages into false-STALE while genuinely alive and talking. SENT-only (a dormant recipient does not wake on an inbound DM, so RECEIVED-DM liveness over-reports). DM is a sign of LIFE, never PROGRESS or STATE: dm_ts feeds the liveness verdict ONLY, never the progress signature (the WHOLE-FLEET-STALL detector still keys on task-transition progress, so a chatty-but-stuck session reads LIVE but not PROGRESSING — both axes true). Runtime-tunable with NO :8001 bounce: the flag is re-read each poll via the mtime-gated ConfigurationManager, so flipping the INI takes effect on the next poll. False = the rollback / kill-switch: the verdict reproduces the prior 4-signal behavior byte-for-byte (dm_age_s stays computed for audit but is excluded from the union; the SENT-DM store query is skipped entirely, so DB load is identical). Default True. Design: src/rnd/v0.1.8/2026.06.17-dm-as-liveness-toggle-plan.md.
arbiter tap min interval seconds         = Heartbeat Arbiter v2.2 (B2) per-manager tap throttle (seconds): a manager is DM-tapped only when their crew-summary CHANGES and at least this long has elapsed since their last tap (anti-storm; never taps on no-change). WIDENED 300->1800 (lane 4, 2026-06-17): each tap re-invokes the manager's CC session = full context reload = token burn (Mr Radio's #1 cost). 30 min between manager taps is ample for an advisory the manager pulls from /state anyway; combined with the reaped/offline-prune (fewer signature flips), this collapses the apprise-loop DM rate. Default 1800.
arbiter manager ack window seconds       = Heartbeat Arbiter v2.2 (B4/D4) manager-ack window (seconds): after the arbiter taps a manager, that manager is treated as "present-to-act" while their commons liveness stays fresh; if a tapped manager shows NO liveness since the tap for this long → MANAGER-DOWN → escalate to Rick + HOLD (the arbiter never auto-assigns; acting-manager succession is a V2 item). Liveness-proxy proves aliveness, not consumption (V1); explicit-ack is V2. Default 600.
arbiter fleet stall window seconds       = Heartbeat Arbiter v2.2 (B3/D3) whole-fleet-stall window (seconds): if the fleet shows NO semantic PROGRESS (no change in any session's state/stuck/holding signature) for this long while work is owed (a non-idle fleet) → escalate to Rick. KEYS ON PROGRESS, NOT manager liveness — so it fires even when the manager's bridge-mtime is fresh, catching the "manager present-but-not-acting" failure mode that the D4 manager-down detector (manager-gone) does not. 2b-1 calibration: gated on at least one LIVE owed-work session, so a dead/offline roster never false-fires. Default 1800 (30 min).
arbiter poll error escalate threshold    = Heartbeat Arbiter Part-6 #12 poll-error demotion: a per-poll exception is SWALLOWED + logged (transient) and escalated to Rick (notify) ONLY after this many CONSECUTIVE poll failures (= the arbiter is effectively down), escalate-once per persistent run; a clean poll resets the streak. Below the threshold the arbiter never spams Rick on a one-off hiccup. Must be >= 1. Default 3.
arbiter enable hwm deletion              = Row 8758d0b1 DM-inbox HWM janitor: opt-IN switch for RECLAIMING accumulated .dm-inbox-hwm-<sid8>.json bookmarks from the runtime-state roots. A file is deleted only when an AUTHORITATIVE live-session set was obtained AND the file's sid8 is absent from it AND its mtime is older than the 7-day grace window; an unavailable (None) live set keeps EVERYTHING. DEFAULT False, unlike `arbiter enable hold deletion` — reaping a LIVE session's bookmark silently and permanently swallows every un-surfaced DM in its inbox (a missing file reads as never-seeded, so the next reconcile records the inbox as already-seen and surfaces nothing), which re-creates bug 59f355e0 for that session. The dry-run report (fleet_arbiter_hwm_report) emits every cycle regardless of this flag, so an operator can watch the prunable tallies before enabling it. Deliberately a SEPARATE switch from hold deletion: the two families fail differently, and one flag would mean disabling hold deletion after a cargo scare silently stops HWM cleanup too.
arbiter operator gate digest cadence seconds = Proactive-manager A2 (fcb5dbc0, design D4): the operator-gate DIGEST cadence (seconds). The arbiter is the single pusher of operator gates (gate_class='operator', the fleet-wide "awaiting the human operator" queue) and routes each open gate by its `urgency` tier — urgent gates interrupt immediately, LOW gates are pull-only (surfaced when the human queries them), and NORMAL-urgency gates are BATCHED into one digest emitted at most every N seconds (this key). Prevents both flooding (only urgent interrupts) and starvation (normal digested on a cadence, low visible on pull). Consumed by the deferred arbiter tier-push wiring; the pure routing core (operator_gate_routing.py) shares this default. Default 1800 (30 min) — normal gates are not time-critical.
arbiter outreach throttle max messages   = Heartbeat Arbiter outreach-DM throttle (Item C, 2026-06-24, Rick): N — the MAX number of ROUTINE shoulder-tap DMs (blocker pings [case 4] + manager taps [case 7]) the arbiter will send to any ONE recipient within the trailing window (the companion key `arbiter outreach throttle window minutes` = Y). Once N have been sent to a recipient in the last Y minutes, further routine taps to that recipient are SUPPRESSED (journaled as `throttle_suppressed` with the window count + last-sent EDT stamp) until the window drains. SAFETY CARVE-OUT: Rick-bound escalations (deadlock / manager-down / decision) and the direct-send pokes (which carry their own per-episode caps) are NEVER subject to this throttle — capping a real alert to save noise is the failure this avoids. Runtime-tunable (the seam re-reads per poll). <=0 DISABLES the throttle (fail-safe: never suppress). Default 5.
arbiter outreach throttle window minutes = Heartbeat Arbiter outreach-DM throttle (Item C, 2026-06-24, Rick): Y — the trailing-window length in MINUTES for the per-recipient routine-tap rate limit (paired with `arbiter outreach throttle max messages` = N: suppress once N routine taps have gone to a recipient within the last Y minutes). Runtime-tunable. <=0 DISABLES the throttle (fail-safe: never suppress). Default 15.
arbiter auto poke enabled                = Heartbeat Arbiter 2b-3 auto-poke master gate (Rick redline-narrowing confirmed). When True, the arbiter fires a BOUNDED, NON-DESTRUCTIVE wake-nudge (a directed commons send_to) at each genuinely-stuck LIVE session (alive AND stuck = owed-work + no-progress; busy/holding/idle/dead are NOT poked — stall≠quiet), capped per stall-episode, then emits ONE reap-RECOMMENDATION to Rick + active managers (the arbiter NEVER executes reap/replace — the redline). This is the make-before-break flag: keep the MANUAL cascade-poker stopgap running until auto-poke is proven green, then stand the manual one down (a brief both-on overlap is harmless — pokes are idempotent). Default True.
arbiter auto poke workers enabled        = AUDIENCE SCALPEL (Rick 2026-07-19), worker half. AND-gated UNDER `arbiter auto poke enabled` — the master off silences every audience regardless of this value; this knob only bites when the master is True. When False, a genuinely-stuck LIVE session whose snapshot role is anything other than "manager" is dropped from the pokeable set before any wake-nudge is emitted (its poke episode ends and the per-episode cap re-arms, exactly as a recovery would, so re-enabling mid-episode is clean). The gate telemetry event `arbiter_poke_gate` reports `audience_disabled` in stuck_why_not for such a session, kept DISTINCT from the master`s `disabled` so an outreach silence always names which knob caused it. Does NOT affect the Rick-directed reap-RECOMMENDATION for that session (that rides the operator audience). Default True.
arbiter auto poke managers enabled       = AUDIENCE SCALPEL (Rick 2026-07-19), manager half. AND-gated UNDER `arbiter auto poke enabled`. When False, TWO manager-DIRECTED emissions are silenced: (a) the stuck-tier wake-nudge at a stuck LIVE session whose role is "manager", and (b) the post-game F2 manager-STALENESS poke sent to a manager gone dark past `arbiter manager stale poke threshold seconds`. Deliberately does NOT silence Rick`s MANAGER-STALE advisory (case 14) for that same manager — that rides the OPERATOR audience, so silencing the crew never blinds Rick to a manager going dark. Default True.
arbiter auto poke operator enabled       = AUDIENCE SCALPEL (Rick 2026-07-19), operator (human) half — this is the one Rick KEEPS on while the crew is silenced. AND-gated UNDER `arbiter auto poke enabled`. Scopes the AUTO-POKE SUBSYSTEM`s Rick-directed advisory stream: the MANAGER-STALE case-14 advisory and the reap-RECOMMENDATION emitted when a session stays stuck through its full poke budget. DELIBERATE CARVE-OUT: it does NOT gate operator-GATE routing (urgent interrupts + the normal-urgency digest), the fleet-dark advisory, or any other `_route` case — those carry Rick`s own queued decisions rather than arbiter-initiated nagging, and a batch nag-silencer must never be able to swallow an URGENT gate awaiting his answer. Default True.
arbiter poke stall threshold seconds     = Heartbeat Arbiter 2b-3 auto-poke threshold: a session must be continuously LIVE+stuck (arbiter-observed) for at least this many seconds before its FIRST auto-poke, so a brief stick that self-resolves is never poked. Must be >= 0 (0 = poke as soon as stuck). Default 720 (12 min), matching María's ~10-12min stopgap doctrine.
arbiter poke max per episode             = Heartbeat Arbiter 2b-3 auto-poke cap (anti-storm FM-20): the MAX number of bounded pokes a single stuck session receives per STALL-EPISODE. After this many pokes with no recovery the arbiter emits ONE reap-recommendation, then falls silent — never a per-tick re-poke storm. The cap PERSISTS across polls (per episode) and re-arms only when the session recovers (leaves the pokeable set). Must be >= 1. Default 3. (Also caps the post-game F2 manager-staleness pokes per episode — one knob, both tiers.)
arbiter stuck poke min interval seconds  = Bug 5a1f17f8 (c) fire-throttle: the MINIMUM seconds between two consecutive stuck-pokes to the SAME session. Where `arbiter poke max per episode` bounds HOW MANY pokes an episode gets, this bounds their RATE — a belt against any residual storm (the poll cadence is ~60s, so without a throttle the whole per-episode budget can land within a couple minutes). A poll that would poke too soon is SKIPPED without consuming the per-episode budget; the throttle re-arms when the episode ends (session recovers). Must be >= 0; 0 DISABLES it (poll-cadence, today's behavior — the default, since 5a1f17f8 (a) freshness-gating + (b) durable offsets already remove the specific restart-replay storm). Default 0.
arbiter manager stale poke threshold seconds = Heartbeat Arbiter post-game F2 (missed-poke post-game 2026-06-11): manager-staleness poke threshold. A MANAGER-role session (manager-manifest) whose FRESHEST union liveness signal (bridge mtime / stop-event / commons / idle_prompt) is at least this many seconds old receives a bounded, non-destructive staleness poke AND fires ONE Rick advisory (case 14, Rick + active managers) on the FIRST crossing — even with ZERO stuck workers (the 2026-06-10 silent-stall gap: the stuck-tier requires alive+stuck, so a stale-but-idle manager was never pokeable). Workers are untouched (quiet != stall preserved). Episode-scoped like the stuck-tier: clears + re-arms when the manager freshens below the threshold. Must be >= 0; 0 disables the tier. Default 2700 (45 min, Rick's calibration). Design: src/rnd/v0.1.8/2026.06.11-arbiter-missed-poke-postgame-and-outreach-logging.md.
arbiter manager stale poke max age seconds = Heartbeat Arbiter post-game F2 corpse ceiling (same-day calibration fix, 2026-06-11): the staleness tier's MAXIMUM eligible age. A manager row is poke-eligible iff threshold <= freshest_age_s <= this ceiling; ages beyond it are CORPSE rows (yesterday's dead sessions) resurfaced by the include_offline=True detection snapshot, not live managers going dark — on every :8001 process start the unbounded tier re-burst pokes + a Rick advisory at a 1134m-old dead session (10:52 EDT 2026-06-11 boot). The same fix FLIPPED the None-age choice: freshest_age_s None (no signal ever) = corpse/malformed row = NOT eligible (was eligible as "maximally stale"). Must be > the threshold while the tier is enabled — an empty [threshold, ceiling] window config-deads the tier, so the constructor raises ValueError at startup. Default 7200 (2h: generous for a real dark-manager episode, far below any restart-resurfaced corpse). Design: src/rnd/v0.1.8/2026.06.11-arbiter-missed-poke-postgame-and-outreach-logging.md.
arbiter user gate resurface seconds        = Heartbeat Arbiter receipts-of-progress OUTWARD-twin backstop (6929f4ac, 2026-06-22): the aged user-gate resurface ceiling, in seconds. A session that has gone DARK (liveness verdict offline OR freshest signal older than this) while still holding an OPEN direct user-gate whose last (re-)ask is older than this ceiling — i.e. it has stopped re-asking — has that buried question RE-SURFACED to Rick on its behalf (case 18, Rick-only), so a dead/silent session's owed decision still reaches him. Also gates the _classify_owed open-gate->ACTIVE override (an open user-gate is owed re-ask work, never a suppressible parked state). The Stop-hook self-poke is the PRIMARY re-ask mechanism; this arbiter tier is the external backstop for when self-regulation has gone dark. Must be > 0 (an empty window config-deads the tier → constructor raises). Default 1800 (30 min — comfortably past the 10-min self-re-ask cadence). Design: src/rnd/2026.06.22-receipts-of-progress-heartbeat-owed-calc.md §9.
follow through escalation enabled          = Follow-through accountability (2026-06-16 design §4.3/§4.5) rollout gate for the one-shot aged-escalation watcher (FollowThroughEscalationWatcher). When false the watcher is INERT — sweep_once is a no-op (no DB access) and start() refuses to spawn the daemon — a defense-in-depth gate sibling to `task store chase enabled`. When true (and the watcher is wired into a loop / the arbiter poll) it escalates ONCE per awaiting:manager STALL that has aged past T_escalate, reading the worker's declared hold first (§4.5) so a validly-parked worker is never escalated as "blocking". Default false (held for deliberate activation). Build: src/rnd/v0.1.8/2026.06.16-follow-through-accountability-lupin-build.md.
follow through escalation tick multiplier  = Follow-through accountability escalation interval FACTOR. T_escalate = `arbiter poll seconds` (the LIVE arbiter tick) x this multiplier — the escalation interval is NEVER hardcoded, so retuning the arbiter tick automatically retunes escalation. An awaiting:manager item (a worker blocked on its accountable manager) that has waited longer than T_escalate gets ONE escalation poke at the manager (the manager-tick has effectively died — a healthy manager acks within a tick or two). Must be a positive int. Default 2.
arbiter turn age watchdog enabled          = Turn-age watchdog (wedge fix f1a21917 lever (ii), 2026-07-06) rollout gate for the held-turn DETECTOR (TurnAgeWatchdog). When false the watchdog is INERT — sweep_once is a no-op (no transcript/pane IO) and start() refuses to spawn the daemon — a defense-in-depth gate sibling to `follow through escalation enabled`. When true it scans live CC sessions each tick: a session whose transcript's last tool_use has no matching tool_result older than the threshold AND whose tmux pane shows no active stream is a held turn → ONE operator advisory per unique (session, tool_use) dangling turn (detection-only, NO auto-kill; advisory tier, never a poke → LOW blast). One-shot + intersect-clear so a still-dangling turn never re-fires and only a genuinely NEW dangling tool_use advises again (flood-guard vs e1bbe011). Default false (held for deliberate activation; arbiter restart is manager/Rick). Design: src/rnd/v0.1.9/2026.07.03-notify-turn-hold-fix-design.md §3.
arbiter turn age watchdog threshold seconds = Turn-age watchdog held-turn threshold (seconds): a session's last tool_use with no matching tool_result for LONGER than this, while its pane shows no active stream, is flagged a held turn. NEVER hardcoded — retune here. Default 600 (10 min) per design §3: an order of magnitude below the 55-min incident-25c7441c wedge, comfortably above any legitimate tool call. Must be a positive int. The daemon naps on `arbiter poll seconds`, so a crossed threshold surfaces within one tick.
arbiter health watch enabled              = Lupin Arbiter App :8001 Loop A (L2) master enable. When true the standalone watcher's production factory starts the per-container docker-inspect health watch on boot. Default true. (Has effect only when the :8001 service itself is run/enabled — held for Rick.)
arbiter health watch interval seconds     = Lupin Arbiter App Loop A poll cadence (seconds): how often each watched container's docker health is inspected. Default 30 — matches Docker's own healthcheck probe interval; polling faster than the probe updates is pure waste.
arbiter health watch containers           = Lupin Arbiter App Loop A watch list: comma-separated container NAMES to docker-inspect each poll (inspected individually by name — never a global, since all containers share the same healthcheck shape). Default lupin-rest-dev,lupin-rest-test,lupin-model-server,lupin-postgres. A container with no healthcheck reads as UNKNOWN and is skipped (never false-paged).
arbiter health inspect timeout seconds    = Lupin Arbiter App Loop A per-inspect subprocess timeout (seconds). Each `docker inspect` is bounded by this so a hung inspect never blocks the loop (and GET /health never blocks regardless, on its own thread). Default 5 — below Docker's 10s probe timeout. A timed-out inspect counts as an inspect FAILURE (feeds the BLIND detector).
arbiter health flap window seconds        = Lupin Arbiter App Loop A flapping window (seconds): the rolling window over which health-status transitions are counted. Default 600 (10 min). Transitions older than this are pruned.
arbiter health flap threshold transitions = Lupin Arbiter App Loop A flapping threshold: this many status transitions within the flap window = FLAPPING → escalate once per episode (re-arms when the window clears). Default 3 — one blip (a single transition) never pages.
arbiter health flap exclude containers    = Lupin Arbiter App Loop A flap-paging exclusion list (comma-separated container names). Excluded containers are NEVER flap-paged but STILL get enter-unhealthy alerts. Default lupin-rest-dev — :7999 is bounced routinely during development (each bounce ≈ healthy→starting→healthy ≈ 2 transitions), so two bounces in 10 min would otherwise read as a false flap. Known V1 limitation: a non-excluded container can still false-flap on a legitimate restart burst; per-container flap thresholds are a V2 refinement.
arbiter health blind threshold polls      = Lupin Arbiter App Loop A self-watch threshold: this many CONSECUTIVE polls in which EVERY watched container's inspect fails → escalate "Loop A BLIND" once (the watcher noticing it has gone blind — e.g. docker daemon down — is itself a real signal; re-arms on any successful inspect). Default 3.
arbiter in-process bootstrap enabled      = R0 cutover flag (deploy-arch R0): when True (default = today's behavior) the FastAPI lifespan submits the IN-PROCESS standing Heartbeat-Arbiter at server start. Flip to False when the standalone :8001 lupin-arbiter-app service owns Loop B, so the in-process arbiter does NOT submit — never two arbiters actuating the fleet at once (break-before-make cutover; a brief zero-arbiter window is acceptable, two is not). A malformed (non-bool) value coerces to False (in-process OFF, the never-two-safe direction) with a LOUD warning log. Read once at startup.
arbiter start period seconds              = Lupin Arbiter App Loop B (L3) start-period warm-up (seconds): each freshly-launched standing-arbiter job suppresses escalations while (now − job start) < this, so a cold boot / systemd restart / 12h recycle never fires a false whole-fleet-stall on empty event history. Applied per-job-start (resets on each recycle). Default 120 (2 polls of baseline, below the 600s manager-ack window).
arbiter worktree janitor enabled          = §4b Worktree Lifecycle Contract (2026-06-22): when True, the standalone :8001 arbiter runs a per-poll janitor that drain-then-removes ABANDONED sandbox worktrees (newest non-vendored file idle longer than the age threshold). Drain = auto-commit any WIP to the worktree's branch (labeled), KEEP the branch, remove the DIR only, NEVER push and NEVER delete a branch — so even a false-positive retire of a quiet-but-live tree loses zero work (branch + WIP survive, dir re-addable). Default FALSE → the janitor seam is inert (byte-identical to no-janitor). Flip True + restart lupin-arbiter-app.service to activate. Impl: src/cosa/agents/shared/worktree_reaper.py (reconcile_worktrees → drain_then_remove).
arbiter worktree janitor age threshold hours = Idle-age cutoff (hours) above which the §4b janitor considers a sandbox worktree ABANDONED and retires it. Age = hours since the newest non-vendored file under the worktree (skips .git/node_modules/.venv/__pycache__). Locked worktrees and the main working tree are always skipped. Default 6.
arbiter orphan bridge sweep enabled       = Bug ee59d5ed (orphaned-session focus-bar fix, Change 2): when True, the standalone :8001 arbiter runs a per-poll LINEAGE-INDEPENDENT janitor that reaps CONFIRMED-dead orphan session bridges (~/.claude/sessions/cc-*.json) that no live manager can dismiss because their spawner died. "Confirmed dead" = EVERY host PID the bridge carries is confirmed-dead (bias-to-alive) AND its tmux session is gone AND it has stayed dead across `arbiter orphan bridge sweep debounce polls` consecutive polls — so a live session is NEVER reaped. On reap it emits the same signals a normal dismiss does (session_reaped marker → durable roster eviction via the notification-repository roster query; kind=reaped tombstone → arbiter snapshot; bridge unlink; hold clear), each fail-safe. Container-gated (no-op when host PIDs are untrustworthy). Default FALSE → the sweep seam is inert (byte-identical to today). This CHANGES fleet-wide reap semantics (every reaped session now durably drops off the operator focus bar across refresh), so activation is a deliberate flip + restart lupin-arbiter-app.service. Impl: src/cosa/agents/shared/orphan_bridge_reaper.py. Design: src/rnd/v0.1.9/2026.07.15-orphan-session-bridge-reap-survival.md.
arbiter orphan bridge sweep debounce polls = Bug ee59d5ed safety debounce: the number of CONSECUTIVE polls an orphan bridge must be confirmed-dead (PID-dead AND tmux-gone) before the §Change-2 janitor reaps it. Defeats PID-reuse, a transient tmux-unreachable, and check/emit races — a single revival resets the counter. Higher = safer/slower to clear a ghost; must be >= 1. Default 2.
arbiter live notify enabled               = Master gate (2b-1) for the live-push-to-Rick hop. When True AND the X-API-Key resolves from `~/.lupin/config` (section per `arbiter live notify config env`), each arbiter escalation ALSO best-effort POSTs to the :7999 /api/notify ingress so it reaches Rick live (escalation-path ONLY, never per-poll; the detection path stays :7999-free per R4). When False — or the credential cannot be resolved — the live push is OFF and escalations still land durably on the `fleet-escalations` commons topic (degrade-safe). Default True.
arbiter live notify url                   = Base URL of the :7999 server the live-push hop (2b-1) POSTs to (path /api/notify is appended). The :8001 arbiter runs host-side and reaches the docker-published dev server at the loopback default http://127.0.0.1:7999. Change only if the :7999 publish host/port changes.
arbiter live notify target user           = Target user (email) the live-push escalation (2b-1) is delivered to — Rick, the human operator. Defaults to ${LUPIN_DEV_EMAIL}. The /api/notify endpoint routes the notification to this user's WebSocket/voice channel.
arbiter live notify sender id             = Sender identity stamped on the live-push escalation (2b-1) so the notification card attributes it to the fleet arbiter. Default heartbeat-arbiter@lupin.deepily.ai.
arbiter live notify dedup window seconds  = Content+window DEDUP guard (2b-1 receipt b) for the live-push hop: an identical escalation message seen again within this many seconds is pushed ONCE (logged live_notify_deduped), so a recycle re-emit / two detectors emitting the same line / a retry storm never double-pings Rick. The arbiter's detectors already escalate-once-per-episode; this is belt-and-suspenders. Default 900 (15 min).
arbiter live notify timeout seconds       = HTTP timeout (seconds) for the live-push hop's urllib POST to :7999 /api/notify. A slow/unreachable :7999 times out and the failure is swallowed+logged (escalation_live_notify_error) — the durable commons post is unaffected. Default 30 = 1.60x the observed maximum :7999 reload window of 18.76s (row 204911ca) — a multiplier with explicit headroom, NOT a coverage guarantee. :7999 runs uvicorn --reload and the reloader parent holds the listening socket across a restart, so the kernel ACCEPTS a request nothing is there to answer; the caller hangs instead of getting a fast ConnectionRefused. The prior default of 5 failed every reload window it landed in (measured n=143: min 6.59s). TRADE: a genuinely hung :7999 now stalls the live push ~30s instead of ~5s — accepted, since the escalation this carries is the fleet's alerting path and a lost push is worse than a slow one. Full derivation: src/rnd/v0.1.9/2026.07.19-dev-server-reload-availability.md §9(a).
arbiter live notify config env            = Which `~/.lupin/config` section the live-push hop (2b-1) reads its X-API-Key from, via the canonical cosa.utils.config_loader (get_api_config → api_key_file → load_api_key). The pointed-to section's `api_key_file` is read + format-validated (ck_live_…); a missing config / missing file / bad format degrades safe (live push OFF, logged live_notify_disabled, escalations stay durable on the fleet-escalations commons topic, NEVER a startup crash). This is the SAME credential the cc-notification-listener + hooks already use, so the arbiter joins the existing auth path instead of a parallel env var. Default development (point test/prod at [testing]/[local] without a code change). NOTE: if LUPIN_API_URL/LUPIN_API_KEY_FILE/LUPIN_API_KEY are set in the runtime env, cosa.utils.config_loader honors them BEFORE this section selection (documented precedence); the arbiter systemd unit sets none of them, so this knob governs in production.
arbiter journal local timezone               = Item A of the 2026.06.11 outreach-receipts design: tz-database name (e.g. America/New_York) used to render the human-parsable `ts_local` field ("2026-06-11-at-17-28-46-(EDT)") that every arbiter structured journal line carries alongside the machine-sortable ISO-UTC `ts`. Rick's verbatim: the bare ISO ts is "impenetrable". An invalid/unknown name NEVER crashes the watcher — one loud `journal_tz_invalid` event at startup, then UTC rendering. Default America/New_York (DST-aware: EDT in summer, EST in winter).
arbiter outreach dm push enabled             = Item B gate for the manager-bound DM PUSH hop: when True, each arbiter→manager outreach (after the durable dm-<persona> board write) ALSO best-effort POSTs :7999 /api/commons/register-question with recipient_persona, which dispatches commons_question_received → the manager session's listener → tmux injection — the manager WAKES instead of finding the DM on the board hours later (the 2026-06-11 21:28/22:01 Tiberius miss). Escalation-path only (R4); a 422/timeout degrades to board-only, journaled as an arbiter_outreach_result outcome=push_unavailable (visible, never silent). Default True.
arbiter poke wake mechanism                  = Thread C+D (2026-06-16) arbiter manager-poke WAKE SURFACE selector. "tmux" (default, load-bearing) = the arbiter (host-side, systemd --user, same uid as the CC tmux server) injects the poke DIRECTLY into the target session's tmux pane via the host-side inject_qualifier_via_tmux primitive (send-keys -l … Enter), reusing the exact mechanism Rick's broadcasts use — this WAKES a dormant pane UNCONDITIONALLY, bypassing the listener's _deliver_peer_dm gate that buffers (never injects) a peer DM whenever the recipient's last heartbeat outcome != EVENT_IDLE (true for a stale-stopped-with-owed manager AND, per María's poke_count=0 probe, an idle-but-EVENT_IDLE-never-emitted one). This is THE primary fleet liveness path now that the internal self-poke (stop.py decision:block) is confirmed broken (filed separately, P1). "dm" = the prior dm/send-only hop (no wake of a buffered pane). Degrade-safe: a tmux/bridge-unavailable outcome falls back to the dm push hop, and the durable dm-<persona> board write happens UNCONDITIONALLY in BOTH mechanisms (the poke is never lost). A malformed value coerces to "tmux" with a loud poke_wake_mechanism_coerced log. Design: src/rnd/v0.1.8/2026.06.16-arbiter-tmux-wake-thread-cd-design.md. Default tmux.
arbiter outreach ack window seconds          = Item B manager-receipt window: after a manager-bound outreach, the arbiter polls the dm-<persona> topic (filesystem read — detection-path-safe) for a threaded reply (metadata.in_reply_to == outreach_id). No ack within this window → ONE re-send, then a fresh window; still nothing → terminal arbiter_outreach_receipt outcome=unacked (the fact rides the NEXT Rick-bound advisory body — never an escalation loop). Default 900 (15 min).
arbiter outreach reannounce interval seconds = Item B re-announce-on-return cadence (milestone-must-land): a Rick-bound advisory whose live push reported user_not_available (his WS offline) sits in the pending ledger and is re-pushed at most once per this many seconds until a delivered outcome (queued / delivered_via_listener) or TTL expiry. Each attempt journals an arbiter_outreach_result with attempt=N. Default 300.
arbiter outreach reannounce ttl seconds      = Item B re-announce give-up horizon: a pending Rick-bound advisory older than this is dropped from the ledger with a terminal arbiter_outreach_receipt outcome=expired (the :7999 DB notification row remains his passive trace). Default 86400 (24 h — an overnight stall advisory still greets his morning return).
arbiter outreach pending ledger path         = Item B pending-ledger file, RELATIVE to the project root (PATH MANAGEMENT — combined with cu.get_project_root() at runtime). JSON, atomic tmp-write+rename, degrade-safe reads (mirrors the stop-hook acked-ledger pattern). Survives both the 12h job recycle AND a service restart, so an undelivered advisory re-announces across deploys. Default /io/arbiter/outreach-pending.json.
arbiter event offsets state path             = Bug 5a1f17f8 (b) durable event offsets: the restart-surviving per-session byte-offset store for the fleet events tail, RELATIVE to the project root (PATH MANAGEMENT). The arbiter holds offsets in memory, so pre-fix EVERY :8001 restart re-read every ~/.claude/heartbeat-events/*.jsonl from byte 0 and re-consumed HISTORICAL cap_reached as fresh — the 2026-07-02 STUCK-poke replay (three ~60s fires after each of two restarts). Saved after each poll (atomic temp+replace), loaded at startup; swallow-safe both ways (a store hiccup degrades to the in-memory fresh-start, never crashes the poll); a shrunk/rotated offset self-corrects downstream (tail_session_file offset>size → 0). Complements 5a1f17f8 (a) freshness-gating (which makes any replayed record harmless). Default /io/arbiter/event-offsets.json.
arbiter lineage carry path                   = F-A of the 2026.06.11 lineage-persistence design: the restart-surviving Fleet-Status lineage-carry file, RELATIVE to the project root (PATH MANAGEMENT). A reaped worker loses BOTH lineage sources at reap (manifest record dropped + bridge unlinked), so its decaying row's manager survives ONLY via this carry — pre-fix it was in-memory and every :8001 restart orphaned reaped rows to "(Unmanaged)" (the 2026-06-11 Cheech/old-Rio bug, 4 restarts that night). Written only when the mapping changes; pruned with the snapshot (bounded by the decay-window population); degrade-safe reads; a write failure journals lineage_carry_error. Default /io/arbiter/lineage-carry.json.
arbiter vigilance state url               = Lupin Arbiter App :8001 single-pane (L4) upstream URL that the :7999 reverse-proxy GET /api/arbiter/fleet-state PULLS from (R3 — :8001 never pushes to :7999). Default http://127.0.0.1:8001/state (the standalone watcher binds 127.0.0.1 only). Change only if the watcher's bind host/port changes.
arbiter vigilance state timeout seconds   = Lupin Arbiter App :8001 single-pane (L4) per-pull httpx timeout (seconds) for the :7999 reverse-proxy. On connect-refused / timeout / non-2xx the proxy returns an explicit {status:"unreachable"} envelope (HTTP 200, null sections) rather than hanging :7999 or returning a 5xx. Default 5 — matches the watcher's own inspect timeout.
arbiter context watch enabled              = Context-pressure assessment master switch (Phase 1, 2026-06-08). When true the fleet helper computes per-worker context-window occupancy from transcript usage. Read-only sensor; never auto-acts. Default true.
arbiter context default window tokens      = Fallback context-window size (tokens) used ONLY when a worker's bridge has no pinned window_size. The bridge value (pinned at spawn by register_session.py from LUPIN_CC_WINDOW_TOKENS) always wins. Default 1000000 (the [1m]-beta fleet window). Never inferred from observed occupancy — a 200k worker at 138k must not read as a healthy 14%.
arbiter context autocompact reserve tokens = Autocompact safety-band overlay (tokens). CALIBRATED 2026-06-08 against a live /context (María 218.3k/1M=22%, used+free≈flat 1M): /context's percentage is measured against the RAW window, NOT an effective ceiling minus a reserve — which REFUTES the pre-build A4 assumption. So this is 0 in the pct denominator (pct = used / raw window, matching what an operator sees in /context). Kept as a configurable knob for a FUTURE "autocompact-imminent" overlay flag; it does NOT reduce the pct ceiling. Default 0.
arbiter context max response tokens        = Response-budget overlay (tokens). Same calibration as the reserve key: 0 in the pct denominator (pct rides the raw window to match /context). Reserved for a future overlay; does not reduce the ceiling. Default 0.
arbiter context warn threshold pct         = WARN state boundary: next_prompt_estimate / effective_ceiling at or above this percent → "compact soon". Default 70.
arbiter context critical threshold pct     = CRITICAL state boundary: next_prompt_estimate / effective_ceiling at or above this percent → "harvest+respawn (or compact now if mid-turn)". 85 leaves headroom below the ~92% autocompact so harvest is deliberate, not reactive. Default 85.
arbiter context idle mtime seconds         = Liveness ACTIVE-vs-IDLE boundary (seconds): a process-alive worker whose bridge mtime is within this window is ACTIVE (pressure computed); older is IDLE (pressure skipped, last_turn_age surfaced). Process death (kill -0 fails) is DEAD regardless. Default 1800.
arbiter context budget fraction 1000000    = Soft-budget line for workers pinned to a 1M-token window (published context-headroom service, 2026-06-09 Decision 5): budget_ceiling = round(1000000 * fraction); headroom = ceiling - occupancy (sign-honest, never clamped). 0.50 holds the big [1m] window to a generous-headroom half. Policy knob — tunable without code.
arbiter context budget fraction 200000     = Soft-budget line for workers pinned to a 200K-token window: budget_ceiling = round(200000 * fraction). 0.75 holds the 200K tier to a later three-quarters line (Decision 5). Policy knob — tunable without code.
arbiter context budget fraction default    = Soft-budget line for any window size with no dedicated `arbiter context budget fraction <size>` key. Default 0.50 (matches the 1M policy — conservative for unknown tiers).
arbiter context watch interval seconds     = Cadence (seconds) of the context-headroom writer on the :8001 arbiter: each tick calls assess_fleet_context_pressure(), applies the budget transform, and writes the persona-keyed `context_pressure` store section (published read-only via GET /api/arbiter/context-pressure on :7999). Context pressure moves slowly — 60 matches the fleet-arbiter poll. Default 60.
prompt template for session title        = Path to the session title generation prompt template. Used by Gister class (with prompt_key parameter) to create 3-5 word session names. Cache bypassed for this prompt.
prompt template for deep research session id generation = Path to the prompt template for extracting 3-word hyphenated semantic topics from Deep Research queries. Used by Gister class to generate session identifiers like "python-javascript-comparison". Cache bypassed.
prompt template for deep research session name          = Path to the prompt template for extracting 3-5 word human-readable session names from Deep Research queries. Generates names with spaces (e.g., "cats vs dogs") for UI display. Semantic topic is derived by converting spaces to hyphens.
similarity threshold confirmation        = Similarity threshold for confirmation matching (0-100)
similarity confirmation enabled          = When true, asks the user to confirm semantic similarity matches below the confirmation threshold before using cached results. When false, skips confirmation and queues the best semantic match directly. Default: true.
# similarity_threshold_question            = OBSOLETE: top-1 + confirm strategy — no hard floor on vector results
# similarity_threshold_question_gist       = OBSOLETE: gist matching commented out
similarity threshold admin search        = Similarity threshold for admin snapshot search UI (0-100). Lower than queue threshold to enable discovery/exploration of similar snapshots.
normalization version                     = Version identifier for normalization algorithm (v2.0 = no punctuation preservation)
fifo todo queue enable input gisting      = Runtime-configurable flag for FIFO todo queue text processing. When True, uses GistNormalizer (LLM extraction + normalization). When False, uses only Normalizer (normalization without LLM). Can be changed at runtime without restart.
vox command prompt path wo root          = Path to the voice command prompt template file

# CJ Flow: Persistence
cj flow persistence enabled      = Master enable/disable flag for CJ Flow job persistence to PostgreSQL. When true, agentic job state transitions (pending, running, completed, failed) are written to the job_history table. When false, all persistence writes are silently skipped. Default is true.
cj flow persistence history days = Number of days to retain completed/failed job history rows in PostgreSQL. Used by future cleanup jobs and query default filters. Default is 30.

# CJ Flow: Timed Execution + Monopolize
cj flow timed execution enabled  = Enable timed job execution in the consumer thread. When true, jobs with a scheduled_at datetime are held in the todo queue until their scheduled time arrives. When false, scheduled_at is ignored and all jobs run immediately. Default is true.
cj flow monopolize enabled       = Enable monopolize flag support. When true, jobs with monopolize=True run exclusively — no other jobs are processed until the monopolize job completes. Designed for integration/E2E test jobs that toggle databases, hot-swap configs, or saturate auth. Default is true.

# CJ Flow: Async Dispatcher Pool
cj flow max concurrent agentic jobs = Maximum number of agentic jobs (Deep Research, Podcast, Presentation, BFE, TFE, HeartbeatPokerJob, etc.) that can run concurrently in the Phase 2 agentic pool. `= 1` reproduces fully-serial behaviour (set in [Lupin: Baseline]). [Lupin: Development] and [Lupin: Production] both override to 3. The prod override (heartbeat-poker task I10, 2026-05-22) is a hard prerequisite of running HeartbeatPokerJob pokers in prod: a poker holds one agentic-pool slot for its entire lifetime, so the pool must be >= N+1 for N concurrent pokers — 3 covers the design's contemplated N=2 case without starving the fast-lane or other agentic jobs. Values above 1 are bounded by Anthropic API rate-limit quota and by ApiResourceManager contention strategy.

# CJ Flow: Ghost-Job Sweeper (Phase 3)
cj flow ghost job sweep interval seconds = How often the ghost-job sweeper scans the agentic pool's Future tracker for jobs whose Future is done but whose state transition never happened (safety net for failures in _on_agentic_complete). 30s balances responsiveness with overhead; lower in dev if testing the sweeper itself.

schema drift alarm recipient email = Email address of the registered user who receives the schema-drift startup NOTIFICATION (Half 3b of the model/migration drift detector, f8422ffa). EMPTY BY DEFAULT and ratified that way by Rick 2026-07-19: when empty, no notification is attempted and the CRITICAL stderr log stands alone as the alarm of record. The empty default is load-bearing, not a placeholder — there is deliberately NO fallback recipient, so an unconfigured server degrades to log-only rather than misdelivering the alarm to a guessed identity. If set to an address that does not resolve to a registered user, the notification is skipped and a WARNING is logged (push_notification() accepts an unknown user_id silently, so a misconfiguration would otherwise vanish without trace). The notification is always the SECOND channel: it is scheduled to run only after the app is serving, is timeout-bounded, and every failure is swallowed — it can never delay or abort boot.

cj flow monopolize drain timeout seconds = Bug 30398595 (option (a) true-monopoly). Seconds the consumer's Gate A waits for the agentic pool to drain of foreign (non-test) inflight writers before dispatching a monopolize job (e.g. a merge-gate test_suite sweep), so the sweep gets exclusive use of the shared lupin_db_test. On timeout the sweep is dead-lettered (fail loud) with a reason naming the offenders — never dispatched onto a contaminated DB. Paired with `cj flow monopolize enabled` (the master kill-switch) and option (c)'s sweep-start preflight (the belt). Default 300s (generous — a foreign long-runner at sweep time is a fleet-protocol violation).

# Task-store chase consumer (Phase 2.1 Item E)
task store chase enabled = Master kill-switch for the task-store chase consumer (the daemon that nudges overdue `blocked` items per design I3). DEFAULT False — the daemon is inert (sweep_once is a no-op, start() refuses to spawn) until explicitly opted in, mirroring the task-store mirror flag's conservative rollout posture. Flip to True (and wire start() into server boot) only when chase nudges are wanted.
task store chase interval seconds = How often the chase consumer wakes to scan for overdue blocked items (next_chase_ts at/before now). Default 300s (5 min). Uses Event.wait so a shutdown interrupts the nap immediately. Only consulted when `task store chase enabled` is True.
task store chase backoff seconds = How far into the future the chase consumer re-arms an item's next_chase_ts after nudging it, so the same blocked item is chased at most once per backoff window (not every scan). Default 1800s (30 min). The chase never auto-transitions — it only re-arms + stamps a 'chased' audit event.

# CJ Flow: Consumer-thread heartbeat stall threshold (WG-8, 2026-04-28)
cj flow consumer stall threshold seconds = Threshold (seconds) above which `/api/queue/pool-status` reports `consumer_stalled=true`. The consumer worker writes a heartbeat timestamp to `running_queue.last_consumer_heartbeat_at` at the top of each loop iteration; the endpoint exposes `seconds_since_heartbeat` and compares against this value. Default is 120 (2 minutes). Raise in noisy local dev where you're stepping through the consumer in a debugger.

# Multiplexer (front-end runtime tuning) — exposed to boot.ts via GET /api/multiplexer/config
multiplexer max meta display bytes = Maximum byte size for the JSON-stringified `Job.meta` payload rendered into the lazy-render `<pre class="job-meta-json">` element when a multiplexer job-card is clicked open. Larger payloads short-circuit to a "[meta too large to display]" placeholder rather than synchronously stringifying on the click thread. Prevents main-thread freeze on pathologically-large server-controlled meta payloads (Phase 6a F20). Default is 256000 (256 KB).

legacy notifications redirect enabled = The Saturday-cutover (2026-06-14) flip for deprecating the legacy JS notifications client. When True, GET /app/notifications returns a 302 redirect to /app/multiplexer instead of serving notifications.html — the route stays alive so bookmarks keep working, and the `?classic=1` query parameter is an escape hatch that still serves the legacy page (used by the held-back JS-client E2E suites that guard the fallback, and by the MVD "Classic UI" link if the Friday-night cut-line fires). Default is False (legacy page serves unchanged). NOTE: ConfigurationManager reads the INI once at construction, so flipping this requires an app restart on any server without code auto-reload (:8000 needs a bounce; :7999 dev picks it up via --reload). Plan: src/rnd/v0.1.8/2026.06.10-notifications-ui-multiplexer-gap-bridge/02-bridging-work-plan.md.

# Multi-repo doc viewer (2026-05-12) — see src/rnd/v0.1.7/2026.05.12-multi-repo-doc-viewer.md.
# The doc viewer can browse files in N named "scopes" beyond the legacy `docs`/`io` built-ins.
# Each registered scope has its own filesystem root (absolute in-container path) and an
# allowed-prefixes list (empty = wildcard under root). The secrets blocklist applies to ALL
# scopes after the per-scope whitelist (defense-in-depth). JWT auth required on every request.
external repos = Comma-and-space-separated list of external-repo scope names registered with the doc viewer. Each name must have a paired `external repo <name> path` and `external repo <name> allowed prefixes` key. Names colliding with built-in scopes (`docs`, `io`) are skipped with a startup warning. Scopes whose configured path does not exist on disk are also skipped (non-fatal — supports environment-by-environment configurability). Parsed via ConfigurationManager.get(return_type="list-string"), which splits on ", " — keep the delimiter exactly as `comma + single space`.
external repo lupin path                       = Absolute in-container path to the Lupin parent repo root. Now uses the broad read-only `/var/external-projects/lupin` mount (was `/var/lupin` pre-2026-05-15; switched as part of the doc-viewer scope unification so root-level `.md` files like `bug-fix-queue.md` are reachable through this scope). The whitelist authority is `<root>/.docview.yml` (per Q2-C); the `allowed prefixes` INI key below is a fallback used only when the manifest is absent.
external repo lupin allowed prefixes           = Comma-and-space-separated list of path prefixes used ONLY when `<root>/.docview.yml` is absent. Today Lupin ships a `.docview.yml` so this fallback is inactive; left as `src/` to match historical behavior if the manifest is ever removed.
external repo cosa-voice path                  = Absolute in-container path to the cosa-voice MCP repo (via the `/projects:/var/external-projects:ro` bind-mount). Skipped at startup if the directory doesn't exist on disk in this environment.
external repo cosa-voice allowed prefixes      = Path prefixes (relative to cosa-voice root) that the doc viewer is permitted to traverse. Default `src/`.
external repo planning-is-prompting path       = Absolute in-container path to the planning-is-prompting repo. Mounted via the same `/projects:/var/external-projects:ro` bind-mount.
external repo planning-is-prompting allowed prefixes = Path prefixes for planning-is-prompting browsing. Default exposes `src/`, `workflow/`, and `docs/` (the three top-level subtrees that hold the workflow content).
external repo lupin-mobile path                = Absolute in-container path to the lupin-mobile sub-project (nested inside the Lupin parent repo's src tree). No additional mount required since it's already inside the `./src:/var/lupin/src` mount.
external repo lupin-mobile allowed prefixes    = Path prefixes for lupin-mobile browsing. Empty means "all paths under the scope root are reachable" — used here because lupin-mobile's top-level layout is the whole project, not a `src/`-subtree convention.
external repo lookml path                      = Absolute in-container path to the Google lookml repo. Mounted via `/projects:/var/external-projects:ro`.
external repo lookml allowed prefixes          = Path prefixes for lookml browsing. Default `src/`.
external repo par-pacific path                 = Absolute in-container path to the par-pacific-financials-er-442109 repo. Mounted via `/projects:/var/external-projects:ro`.
external repo par-pacific allowed prefixes     = Path prefixes for par-pacific browsing. Default `src/`.
external repo claude-plans path                = Absolute in-container path to Claude Code's plan-output directory (`~/.claude/plans/` on the host) via the `~/.claude/plans:/var/external-claude/plans:ro` bind-mount. Read-only by design — viewer never writes.
external repo claude-plans allowed prefixes    = Path prefixes for claude-plans browsing. Empty = wildcard — plan files live flat under `~/.claude/plans/`, no subtree convention.
external repo scratchpad path                  = Absolute in-container path to the scratchpad project (`projects/scratchpad/` on the host — the registered neutral-execution home, store item 4f42c218). Mounted via the existing `/projects:/var/external-projects:ro` bind-mount; no extra mount line needed.
external repo scratchpad allowed prefixes      = Path prefixes for scratchpad browsing. `bin/` is the fail-closed floor: when the repo's `.docview.yml` is present it is the whitelist authority (README + bin/ scripts only), but a missing/invalid manifest falls back to THESE prefixes — and an empty value here would mean wildcard, silently exposing the per-session scratch dirs (`<session_id_8>/`: transient, unreviewed, janitor-swept — never viewable).
external repo retail-ai-location-strategy path = Absolute in-container path to the Google retail-ai-location-strategy repo. Mounted via `/projects:/var/external-projects:ro`. Skipped at startup if absent in this environment.
external repo retail-ai-location-strategy allowed prefixes = Path prefixes for retail-ai-location-strategy browsing. Default `src/`.
external repo google-project-wonderwall path   = Absolute in-container path to the Google project-wonderwall repo. Mounted via `/projects:/var/external-projects:ro`. Skipped at startup if absent in this environment.
external repo google-project-wonderwall allowed prefixes = Path prefixes for google-project-wonderwall browsing. Default `src/`.
external repo parallel-search path             = Absolute in-container path to the Google parallel-search repo (the second PoC repo, registered 2026-07-18). Mounted via the existing `/projects:/var/external-projects:ro` bind-mount; no extra mount line needed. Skipped at startup if absent in this environment.
external repo parallel-search allowed prefixes = Path prefixes for parallel-search browsing. Default `src/`. Root files (README/TODO/history/CLAUDE/MANDATE) come from that repo's own `.docview.yml`, which is the whitelist authority when present and overrides these prefixes.
external repo skills-distillation path         = Absolute in-container path to the Google skills-distillation repo (cascade artifacts + io/ corpus). Mounted via `/projects:/var/external-projects:ro`. Skipped at startup if absent in this environment.
external repo skills-distillation allowed prefixes = Path prefixes for skills-distillation browsing. `src/, io/` — cascade artifacts (src/rnd/) plus the io/ FormSpec corpus; root files (README/TODO/history) come from that repo's own `.docview.yml`, which is the authority when present.

# Inter-Session Commons (v0.1.7 Phase 1 — file-based AI ↔ AI blackboard).
# Per src/rnd/v0.1.7/2026.05.09-inter-session-commons/01-design.md + 02-phase1-file-commons-design.md AC12.
commons enabled                            = Master toggle for the inter-session commons. When True (default), the cosa-voice MCP server registers the 5 commons tools (commons_post, commons_read, commons_who, commons_ask_sync, commons_ask_async) AND starts the 24-hour archival daemon. When False, the MCP server skips both registration and daemon startup; the 5 tools are absent from the MCP catalog and individual tool calls short-circuit (defense-in-depth per AC12). No hot-reload — changes require MCP server restart.
commons storage path                       = Storage subdirectory for commons topic files, relative to LUPIN_ROOT. Default `/io/commons` resolves to `<LUPIN_ROOT>/io/commons/`. Topic files live as `<storage_path>/<topic>.md`; archived entries land in `<storage_path>/archive/<yyyy-mm-dd>/<topic>.md`. Each topic file is YAML-frontmatter + entries separated by `---` lines. Reserved topics (`broadcast-acks`, `presence`, `system-events`) are pre-seeded on first store init.
commons retention hours                    = Active-file retention window in hours. Entries older than this age are rotated by the archival daemon into the per-day archive subdir. Default 24. Lower values free up scan-time on `commons_read`/`commons_who` at the cost of more archival churn; higher values keep more history hot.
commons archival interval seconds          = How often (seconds) the archival daemon scans `<commons_storage_path>/*.md` for entries older than `commons retention hours`. Default 3600 (1 hour). Lower for testing; raise for low-traffic projects. Daemon runs as a daemon thread (`threading.Thread(daemon=True)`) in the MCP server process; absent if `commons enabled = False`.
commons broadcast rate limit seconds       = Rate-limit window (seconds) per authenticated user for `POST /api/commons/broadcast-to-cc-sessions` (Phase 2 user→all broadcast endpoint, declared now per AC12 for forward-compat). Default 30 — a user may send at most one broadcast every 30 seconds. Currently INERT in Phase 1 — consumed by Phase 2 UI/endpoint when that lands.
commons ask sync grace seconds             = Default value for `commons_ask_sync`'s `grace_seconds` parameter when the caller doesn't supply one. Per AC6 A3b hybrid first+grace timing: after the FIRST matching reply arrives, the call waits an additional `grace_seconds` to coalesce additional fast replies before returning the accumulated list. Default 1.0. Callers can override at call-time (tests typically pass `grace_seconds=0.05` for fast wall-clock).
# cosa-voice MCP — spoken TTS brevity cap (added 2026-06-02)
dm quality judgment enabled                = DM Quality Judge toggle (Phase 2 DM Verbosity Reduction, Rick 2026-07-31). Doubles as the A/B experiment switch AND a real cost/dependency gate (drives a synchronous Mistral judge call inside execute_dm_send). OFF (False, default) = CONTROL — Phase 1 baseline only, no judge, dm_send's result carries NO `quality` field. ON (True) = TREATMENT — baseline plus the judge grade appended to every dm_send result and tallied by the quality-audit counter. Read fresh per call (no restart); flip between a control run and a treatment run, not mid-session.
cosa voice enforce spoken char cap         = Global ON/OFF kill-switch for the spoken-length guard below. True (default) enforces `cosa voice spoken char cap`; False DISABLES it for ALL callers — no rejection and no length-exceeded ValueError, regardless of message length (override_size_limitation no longer needed). Set False per Rick 2026-06-09 after repeated caller difficulty trimming spoken text. Takes effect on the next MCP start (code-path change loaded at boot); once loaded the value is runtime-tunable (mtime-gated re-read, no restart). When False, the cap value below is ignored.
cosa voice spoken char cap                 = Max characters allowed in the SPOKEN field (`message` / `question` / each `questions[i].question`) of the cosa-voice speaking tools (notify, converse, ask_yes_no, ask_multiple_choice, ask_open_ended_batch). The spoken field is read aloud via TTS; over-cap calls are REJECTED (ValueError naming the field + length + fix) so the caller re-crafts — detail belongs in `abstract`, which is NEVER capped. A caller may send a long spoken message KNOWINGLY by passing `override_size_limitation=True`. Enforced caller-side in the MCP layer ONLY; the notifications REST API is NOT limited (jobs/system may send longer payloads). Default 500 (~80 words). Runtime-tunable: the MCP re-reads this value (via ConfigurationManager, mtime-gated) on the next call after lupin-app.ini changes — no MCP restart required.
# Durable notify outbox (messaging-coordination plane Phase 1 / lever A — added 2026-06-02)
notify outbox enabled                      = Master toggle for the durable notify outbox. When True (default), a notify whose send FINALLY fails (server slow/down under fleet load, after the in-call retry budget is exhausted) is spooled to an on-disk outbox and retried by a background flusher (reusing its idempotency_key so the server de-dups) until ack or TTL — eliminating the silent-loss "black-hole" (FM-7/11). When False, a failed notify just returns "Failed" (legacy behavior). Caller-side in the cosa-voice MCP only; rides local disk, no fleet/messaging dependency.
notify outbox dir                          = Project-root-relative directory under which per-session outbox spool dirs live (`<dir>/<session_id>/<epoch_ms>-<idempotency_key>.json`). Default `/io/notify-outbox`. Each spooled file is a JSON record { spooled_at, idempotency_key, request }. Deleted on successful redelivery or TTL expiry.
notify outbox flush interval seconds       = How often (seconds) the background flusher daemon sweeps the outbox and retries spooled items FIFO. Default 30. Lower = snappier recovery at higher filesystem-stat cost; higher = amortized. The daemon starts lazily on the first spool and runs once per MCP subprocess.
notify outbox ttl seconds                  = Maximum age (seconds) a spooled notify is retried before it is dropped as expired (prevents unbounded accumulation when the server stays down). Default 86400 (24h). An item older than this is deleted on the next flush without a further send attempt.
notification undelivered max age hours      = Age cap (hours) on the server-side undelivered drain — the pull-able AFK inbox (lever D, GET /api/notifications/undelivered) and the WS auth_success "N missed" count both reach back at most this many hours. WITHOUT it, a server bounce drains every historical undelivered row (state created/queued) on reconnect, replaying months-old notifications as a TTS storm (the 2026-06-03 incident, where ~8.7k stale rows replayed in the Sam error persona). Structural guard: any row stale-while-undelivered beyond this window is skipped by the query (covers the live path, not just a one-time backfill). Default 24 (mirrors `notify outbox ttl seconds`). Runtime-tunable.
# Notify backpressure (messaging plane lever E1 — added 2026-06-02)
messaging backpressure enabled              = Master toggle for per-session notify backpressure (lever E). When True (default), the notify path enforces a per-`sender_id` sliding-window cap; over the cap a notify returns HTTP 429 + a Retry-After header (the durable outbox honors it → queue + retry, never lost). When False, no rate limiting. Caller-side throttle that isolates a runaway fleet worker without touching the user's interactive session.
messaging backpressure max per session      = Maximum notifies allowed per `sender_id` within `window seconds` before 429s kick in. Default 60 (with a 10s window ≈ 6/s/session — generous for interactive + fleet-reporting bursts, throttles true runaways). Runtime-tunable (mtime-gated read).
messaging backpressure window seconds       = The sliding-window length (seconds) over which `max per session` is counted. Default 10. Lower resets burst tolerance faster; higher smooths the average.
messaging backpressure retry after seconds  = Floor for the Retry-After hint (seconds) on a 429 when the sliding window can't supply a precise remainder. Default 5. The durable outbox waits at least this long before retrying a throttled send.
# Phase 2 (user-broadcast surface) — added 2026-05-12 per AC11; liveness-signal rework 2026-06-05.
commons broadcast liveness threshold seconds = LIVENESS threshold (seconds) used by POST /api/commons/broadcast-to-cc-sessions + GET /api/commons/active-sessions to decide which sessions are alive enough to receive a broadcast OR appear in the recipient-preview chip-row. As of 2026-06-05 the signal is the session's bridge-file MTIME (not `idle_detection.last_interaction_at`): a session is included when `now - bridge_mtime <= this value`. Rationale (src/rnd/v0.1.8/2026.06.05-broadcast-liveness-mtime-filter.md): the old interaction-recency filter wrongly excluded dormant-but-ALIVE workers (idle for hours but still running) — exactly the sessions a broadcast exists to wake. The idle-waiter heartbeat rewrites the bridge each backoff tick, so an alive session keeps a fresh mtime even with zero interaction; a dead session's waiter exits and the mtime freezes, ageing past this threshold. Since mtime >= last_interaction_at always, mtime@8h is strictly more inclusive of live sessions than the retired interaction@8h filter (zero false-negative regression) while still rescuing dormant-but-alive workers. Default 28800 (8 hours). IMPORTANT — why NOT a tighter window: a tight value (e.g. 2h) is only safe if EVERY alive session refreshes its bridge mtime on a fast cadence. Empirically (2026-06-05) that holds ONLY for sessions with an armed idle-waiter (spawned workers); an interactive/peer session that is idle WITHOUT an armed waiter lets its mtime go stale while still alive, so a tight window would false-negative it. To safely tighten this, first add a fixed-cadence bridge heartbeat to every session (cc-notification-listener) — see the R&D doc's "Add a real listener heartbeat" option — then this can drop to ~2h. Invariant if tightened: value > idle-waiter max backoff (~61 min).
commons broadcast ack watch interval seconds       = Poll period (seconds) for the CommonsAckWatcher daemon that tails the `broadcast-acks` topic. For each new ack matching an in-flight broadcast_id, fires a `commons_broadcast_ack` custom-notification via the canonical NotificationFifoQueue (per the 2026-04-29 ws-event-cleanup mandate). Lower values produce snappier UI ack updates at the cost of slightly higher filesystem-stat overhead; higher values amortize cost across more entries per poll. Default 1 second.

# Phase 3 (push-mode ask_async + LLM-fallback persona disambiguation) — added 2026-05-12 per AC9.
commons question tracker ttl seconds              = Default TTL (seconds) for entries in the CommonsQuestionWatcher's in-flight tracker — used when `ask_async` doesn't supply a per-call `ttl_seconds` override. Per Q4 ratification: 1 hour covers ~95% of real ask_async usage; per-call override (`ask_async(..., ttl_seconds=N)`) handles long-running edge cases. Self-healing on orphaned questions: expired entries are pruned on the next `tick()`. Per-call override is range-checked `0 < ttl ≤ 604800` (7 days; F6-fit Pass 1). Default 3600.
llm spec key for commons persona disambiguator    = LLM model spec key passed to `LlmClientFactory.get_client(...)` for the persona disambiguator (PHI-4 primary path). Mirrors the `llm spec key for runtime argument expeditor` pattern from the runtime-argument-expeditor agent. Default `Deepily/kaitchup/Phi-4-AutoRound-GPTQ-4bit` — local GPTQ-4bit Phi-4, zero per-call API cost. Per Q5 ratification + C2 REUSE correction.
commons llm disambiguator fallback model name     = Claude model name for the future Haiku 4.5 fallback when PHI-4 fails/times out. Currently STUBBED — the fallback function exists but raises NotImplementedError per Q5 ratification. INI key lands now for forward-compat; implementation deferred to a future phase. Default `claude-haiku-4-5`.
commons llm disambiguator timeout seconds         = Timeout (seconds) for the PHI-4 disambiguator call. PHI-4 local inference reliably <1s for small prompts; 5s = 10× headroom for cold-start / GPU contention. Per Q7 ratification. Default 5.
commons ask async push mode enabled               = When True, `commons_ask.ask_async()` fires `POST /api/commons/register-question` to register the question with the FastAPI-side CommonsQuestionWatcher for push-mode dispatch. On register failure (404 / connection error / timeout), logs a warning and silently falls back to polling-mode for that call (try-except per F1-fit Pass 1). When False, ask_async stays polling-only (Phase 1 behavior). Default True.
commons api base url                              = Base URL for the FastAPI server used by MCP-side `ask_async` push-mode HTTP register calls. ConfigurationManager auto-handles env-var overrides per the standard `LUPIN_CONFIG_MGR_CLI_ARGS` pattern, so production multi-host deploys can override without code change (F2-fit Pass 1). Default `http://localhost:7999`.
commons llm disambiguator confidence floor        = Minimum PHI-4 confidence required for the disambiguator to return a matched persona name. Below this threshold, returns None (treated as "no match" by callers; mechanical matcher's fallback path applies). Per F5-fit Pass 1: 0.7 default. Operator can tune empirically using T7 decision-audit log records. Default 0.7.
commons question tracker per user max             = Per-user cap on simultaneous in-flight registered questions in CommonsQuestionWatcher. Defense against single-attacker DoS via mass-register + TTL-edge abuse (T3 Pass 2). Register call raises CapExceededError → router returns HTTP 429 when caller's per-user count is at cap. Default 50.
commons question tracker global max               = Global cap on total in-flight registered questions across all users in CommonsQuestionWatcher. Bounds total tracker memory for capacity planning (T3 Pass 2). Register raises CapExceededError → 429 when at global ceiling. Default 1000 (50 users × 20 questions / user typical).
commons llm disambiguator log decisions           = When True, the persona disambiguator emits a per-decision debug log record (timestamp + sanitized ambiguous_reference + active personas count + matched_persona + confidence + returned value after whitelist + floor). T7 Pass 2 — empirical data for tuning the confidence floor. INI-toggleable for production cost-management. Default True.
commons traffic visibility enabled                  = Master feature flag for the Broadcast Card "Recent Activity" admin-oversight surface (Phase 2.5/3.5; design at src/rnd/v0.1.7/2026.05.14-commons-traffic-visibility-design.md). When True (default per Q9), the broadcast card renders a "Recent Activity" sub-section showing inter-session conversational traffic (your broadcasts + per-recipient acks + AI-to-AI commons coordination), and AI replies to your broadcasts are routed there exclusively rather than to per-session cards. When False, the section is hidden via display:none + the WS push wiring is a no-op + AI replies return to per-session cards on next page load (kill-switch behavior). Hot-reloadable via the existing config-re-init endpoint. Default True.
commons traffic visibility exclude topics           = Comma-separated list of commons topic names to exclude from the broadcast-card Recent Activity stream. Per Q5 ratification, the default excludes `presence` and `system-events` (the two reserved heartbeat topics) — they're telemetry, not conversation, and would otherwise dominate the admin-oversight view with noise. The other two reserved topics (`broadcasts`, `broadcast-acks`) plus all free-form topics are always included. To inspect a reserved topic from the broadcast card, remove its name from this list. Whitespace around commas is trimmed. Default `presence, system-events`.
commons traffic visibility default hours window     = Initial time-window for the broadcast-card Recent Activity stream on first paint (Q6 ratification). Mirrors the existing notifications history-window dropdown shape (the user can switch within the card to `24`, `48`, `168`, `720`, or `all`). Special value `today` resolves to "since local-midnight" via the existing `getEffectiveHoursForQuery()` resolver in notifications.js. Default `today`.
commons traffic visibility ws push enabled          = Master switch for the `commons_activity` WebSocket event (Q3 ratification). When True (default), new commons entries are pushed to authenticated clients in real-time, subject to same-user scoping. When False, the broadcast-card Recent Activity stream degrades to refresh-on-expand only (no live updates). Independent of the master `commons traffic visibility enabled` key for emergency-throttle scenarios where the section should stay visible but new entries shouldn't auto-arrive. Default True.
commons traffic visibility max entries per response = Backend hard ceiling on the number of entries `GET /api/commons/broadcast-history` will return in a single response, regardless of the caller's `limit` query parameter. Protects the aggregator endpoint against pathologically-wide windows (e.g. `hours=null` "All time" on a chatty multi-month commons store). Deferred pagination via `next_cursor` is the planned v2 path; for v1 this ceiling is the safety valve. Default 1000.

# CJ Flow: Claude Code Job Defaults
claude code job max turns default         = Maximum number of agentic turns for Claude Code bounded jobs when not specified by the caller. Controls how many tool-use round-trips the Claude Agent SDK performs before stopping. Default is 50.
claude code job timeout seconds default   = Maximum execution time in seconds for Claude Code bounded jobs when not specified by the caller. Jobs exceeding this duration are terminated. Default is 3600 (1 hour).

# DataFrame CRUD Storage Layer (Phase 1)
crud for dataframes output path                            = Base directory (relative to project root) for per-user parquet DataFrame storage. Each user gets a subdirectory under this path containing one parquet file per schema type. Default is /io/dfs.
crud for dataframes confidence threshold                   = Minimum confidence score (0.0-1.0) required from the intent extraction LLM before executing a CRUD operation. Below this threshold, the system falls back to Claude Code headless mode. Default is 0.6.
llm spec key for agent router go to crud for dataframes    = LLM specification key for the local model used for CRUD intent extraction. Points to Phi-4 14B for fast on-device inference. Used by the agent router to select the correct model endpoint.
prompt template for agent router go to crud for dataframes = Path (relative to project root) to the prompt template used for extracting CRUDIntent XML from natural language queries. Template instructs the LLM to output structured XML with operation, fields, filters, etc.
crud for dataframes agents enabled                         = Feature flag to enable the new CRUD-based DataFrame agents (TodoCrudAgent, CalendarCrudAgent) as replacements for the legacy TodoListAgent and CalendaringAgent in the queue routing. Set to false for instant rollback to legacy agents. Default is true.

# SWE Team Agent Configuration (Phase 1)
swe team enabled                         = Feature flag to enable the SWE Team multi-agent engineering team. When false, the agent router will not route to this agent and the API endpoint returns 503. Default is false (disabled until Phase 5 CJ Flow integration).
swe team lead model                      = Claude model ID for the Lead and Architect agents. Uses Opus for task decomposition and extended thinking. Default is claude-opus-4-6.
swe team worker model                    = Claude model ID for Coder, Reviewer, Tester, and Debugger agents. Uses Sonnet for cost-effective execution. Default is claude-sonnet-4-6.
swe team max iterations per task         = Hard iteration limit per subagent task. Prevents runaway loops. Default is 10.
swe team max tokens per session          = Maximum total token budget per SWE Team session across all agents. Approximately $2.50 on Sonnet, $7.50 on Opus. Default is 500000.
swe team wall clock timeout seconds      = Maximum wall-clock time in seconds for a single task. Jobs exceeding this are terminated gracefully. Default is 1800 (30 minutes).
swe team max consecutive failures        = Number of consecutive failures before escalating to human. Triggers circuit breaker demotion. Default is 3.
swe team max file changes per task       = Maximum number of file modifications allowed per task. Prevents runaway edits from sweeping the codebase. Default is 20.
swe team budget usd                      = Maximum USD spend per SWE Team session. Enforced via cost tracker. Default is 5.00.
swe team feedback timeout seconds        = Timeout in seconds for blocking human feedback requests (confirmations, decisions). Default is 300 (5 minutes).
swe team narrate progress                = Whether to send voice progress notifications during task execution. Default is true.
swe team trust mode                      = Operating mode for the SWE engineering decision proxy. Controls how autonomously the proxy handles confirmation questions. Values: "disabled" (no proxy), "shadow" (observe and log only), "suggest" (add suggestions to user prompts), "active" (auto-approve at L3+ trust). Default is shadow for safe observability-first rollout.

# ============================================================================
# Decision Proxy Configuration
# ============================================================================
decision proxy enabled                                          = Feature flag to enable the Decision Proxy Agent. When false, the proxy will not run. Default is false (Phase 4 development).
decision proxy active hours start                               = Hour (0-23) when user active hours begin. During active hours, decisions are deferred to the user. Outside active hours, the proxy handles decisions autonomously at its earned trust level. Default is 09.
decision proxy active hours end                                 = Hour (0-23) when user active hours end. Default is 22.
decision proxy timezone                                         = IANA timezone for active hours calculation. Default is America/Chicago.

# Trust Level Thresholds (decisions needed to graduate)
swe team trust proxy l2 threshold                                        = Minimum number of successful decisions before graduating from L1 (Shadow) to L2 (Suggest). Default is 50.
swe team trust proxy l3 threshold                                        = Minimum decisions for L2 to L3 graduation (Act + Notify). Default is 200.
swe team trust proxy l4 threshold                                        = Minimum decisions for L3 to L4 graduation (Autonomous + Sample Audit). Default is 500.
swe team trust proxy l5 threshold                                        = Minimum decisions for L4 to L5 graduation (Full Autonomy). Default is 1000.

# Trust Decay and Rolling Window
swe team trust proxy decay half life days                                = Half-life in days for trust score time-weighted decay. Older decisions count less toward the current trust score. Default is 14 days.
swe team trust proxy rolling window days                                 = Number of days in the rolling window for trust calculations. Decisions older than this are excluded entirely. Default is 30 days.

# Circuit Breaker Parameters
swe team trust proxy circuit breaker error rate threshold                = Error rate (0.0-1.0) that triggers the circuit breaker. When the ratio of rejected-to-total decisions exceeds this threshold, the proxy auto-demotes. Default is 0.15 (15%).
swe team trust proxy circuit breaker confidence collapse threshold       = Confidence drop threshold (0.0-1.0) that triggers circuit breaker. If average classification confidence drops below this, the proxy auto-demotes. Default is 0.3.
swe team trust proxy circuit breaker auto demotion levels                = Number of trust levels to demote when the circuit breaker trips. Default is 2 (e.g., L4 drops to L2).
swe team trust proxy circuit breaker recovery cooldown seconds           = Cooldown period in seconds before the circuit breaker resets and trust can begin re-climbing. Default is 3600 (1 hour).

# L4 Audit Sampling
swe team trust proxy l4 audit sample rate                                = Fraction (0.0-1.0) of L4 decisions randomly selected for human audit. Default is 0.10 (10%).

# Phase 0: Embedding / Vector Search
swe team trust proxy similarity threshold                                = Minimum cosine similarity (0.0-1.0) for a LanceDB vector search result to be considered a relevant match. Higher values require closer semantic matches. Default is 0.75.
swe team trust proxy lancedb table                                       = Name of the LanceDB table within the shared lupin.lancedb database used to store proxy decision embeddings. Default is proxy_decisions.

# Phase 1: Beta-Bernoulli Rate Thresholds
swe team trust proxy beta l2 rate threshold                              = Minimum success rate (lower 95% credible interval) required for Beta-Bernoulli L2 graduation. Must also meet min samples. Default is 0.70.
swe team trust proxy beta l3 rate threshold                              = Minimum success rate for L3 graduation under Beta-Bernoulli model. Default is 0.80.
swe team trust proxy beta l4 rate threshold                              = Minimum success rate for L4 graduation under Beta-Bernoulli model. Default is 0.90.
swe team trust proxy beta l5 rate threshold                              = Minimum success rate for L5 graduation under Beta-Bernoulli model. Default is 0.95.

# Phase 1: Minimum Samples per Level
swe team trust proxy beta l2 min samples                                 = Minimum number of decision observations required before Beta-Bernoulli can graduate to L2. Prevents premature trust from small samples. Default is 20.
swe team trust proxy beta l3 min samples                                 = Minimum observations for L3 graduation. Default is 50.
swe team trust proxy beta l4 min samples                                 = Minimum observations for L4 graduation. Default is 100.
swe team trust proxy beta l5 min samples                                 = Minimum observations for L5 graduation. Default is 200.

# Phase 1: Case-Based Reasoning (CBR)
swe team trust proxy cbr top k                                           = Number of most-similar past decisions to retrieve from LanceDB for CBR prediction. Higher values give more robust consensus but slower retrieval. Default is 5.
swe team trust proxy cbr confidence threshold                            = Minimum CBR confidence (0.0-1.0) required for a CBR prediction to be considered actionable. Below this threshold the prediction is logged but not used. Default is 0.60.

# Phase 2: Thompson Sampling
swe team trust proxy thompson enabled                                    = Enable Thompson Sampling for gate routing. When true, gate() draws from the Beta posterior to decide act/suggest/shadow instead of using fixed trust-level thresholds. Provides explore/exploit balance. Default is false (fixed thresholds).
swe team trust proxy thompson act threshold                              = Sampled rate threshold for autonomous action. If the Beta posterior sample >= this value, the gate returns "act". Higher values require more confidence to act autonomously. Default is 0.90.
swe team trust proxy thompson suggest threshold                          = Sampled rate threshold for provisional suggestion. If the Beta posterior sample >= this value (but < act threshold), the gate returns "suggest". Default is 0.70.

# Phase 2: GP/BALD (deferred — config keys reserved)
swe team trust proxy bald enabled                                        = Enable GP/BALD active query selection for targeted human feedback. Reserved for Phase 2.5 implementation. Default is false (not yet implemented).
swe team trust proxy bald defer threshold                                = BALD information-gain threshold below which the proxy defers to human judgment. Reserved for Phase 2.5. Default is 0.50.

# Phase 3: Conformal Prediction
swe team trust proxy conformal enabled                                   = Enable split conformal prediction for distribution-free coverage guarantees. When enabled, wraps BLR predictions with conformal sets and defers on ambiguity. Default is false.
swe team trust proxy conformal alpha                                     = Significance level for conformal prediction (1 - coverage). At alpha=0.10, the conformal set guarantees >=90% coverage. Lower values give wider (more conservative) prediction sets. Default is 0.10.

# Phase 3: ICRL (In-Context Reinforcement Learning)
swe team trust proxy icrl enabled                                        = Enable ICRL fallback for ambiguous CBR cases. When CBR returns mixed verdicts with low confidence, queries an LLM with similar case history to disambiguate. Default is false.
swe team trust proxy icrl top k                                          = Number of most-similar past decisions to include in the ICRL prompt context. More cases give the LLM better context but increase prompt size. Default is 5.

# SWE Engineering Proxy (domain-specific)
swe engineering proxy accepted senders                          = Comma-separated list of sender IDs that the SWE engineering proxy will accept decisions from. Only notifications from these senders are processed. Default includes the three active SWE team roles.
swe engineering proxy deployment cap level                      = Maximum trust level for deployment-related decisions. Prevents autonomous deployment actions above this level. Default is 3 (Act + Notify).
swe engineering proxy destructive cap level                     = Maximum trust level for destructive decisions (file deletion, branch removal, etc.). Default is 3 (Act + Notify).
swe engineering proxy architecture cap level                    = Maximum trust level for architecture decisions (dependency changes, API modifications, etc.). Default is 3 (Act + Notify).

# ============================================================================
# Bug Fix Expediter Configuration
# ============================================================================
bug fix expediter enabled                        = Feature flag to enable the Bug Fix Expediter agent. When false, the agent router will not route to this agent and the API endpoint returns 503. Default is false (disabled until orchestrator pipeline is complete in Phase 2+).
bug fix expediter lead model                     = Claude model ID for root cause diagnosis and fix planning. Uses Opus for extended thinking and forensic analysis. Default is claude-opus-4-6.
bug fix expediter worker model                   = Claude model ID for code generation and test validation. Uses Sonnet for cost-effective fix generation. Default is claude-sonnet-4-6.
bug fix expediter max diagnosis iterations       = Maximum LLM rounds for the diagnosis phase. Each round refines root cause analysis. Prevents runaway analysis loops. Default is 3.
bug fix expediter min diagnosis confidence       = Minimum confidence threshold (0.0-1.0) for accepting a diagnosis. If the Lead agent's confidence is below this, a refinement iteration is triggered. Default is 0.7.
bug fix expediter max fix attempts               = Maximum number of code-fix attempts before giving up. Each attempt generates and validates a fix via the coder-tester loop. Default is 2.
bug fix expediter max file changes per fix       = Maximum number of file modifications allowed per fix attempt. Enforced by SafetyGuard. Prevents runaway edits. Default is 20.
bug fix expediter wall clock timeout seconds     = Maximum wall-clock time in seconds for the entire BFE pipeline (diagnose + propose + fix). Jobs exceeding this are terminated gracefully. Default is 600 (10 minutes).
bug fix expediter budget usd                     = Maximum USD spend per Bug Fix Expediter session. Enforced via cost tracker. Covers all LLM calls across all phases. Default is 2.00.
bug fix expediter feedback timeout seconds       = Timeout in seconds for blocking human feedback requests such as fix approval confirmations. Default is 300 (5 minutes).
bug fix expediter narrate progress               = Whether to send voice progress notifications during each phase of the pipeline. Set to false for silent overnight execution. Default is true.
bug fix expediter auto retry on fix              = Whether to automatically retry the original failed job after a fix is applied. When false, user must manually re-submit. Default is false.
bug fix expediter require user confirm           = Whether to ask user confirmation before applying a proposed fix. When false, fixes are applied automatically based on trust proxy classification. Default is true.
bug fix expediter trust mode                     = Trust proxy operating mode for Phase 5 git strategy. Values: "shadow" (L1, commit on current branch only), "suggest" (L2, commit on current branch), "active" (L3+, create fix branch + push + PR via gh). Default is shadow — safe baseline with no auto-branching behavior.

# ============================================================================
# Test Fix Expediter Configuration (Session 1cfcdf73, 2026-04-10)
# ============================================================================
test fix expediter lead model                     = Claude model ID for clustering, diagnosis, and proposal phases. Uses Opus for extended thinking on test-failure root cause analysis. Default is claude-opus-4-6.
test fix expediter worker model                   = Claude model ID for the shared Coder/Tester agents in Phase 3. Uses Sonnet for cost-effective fix generation. Default is claude-sonnet-4-6.
test fix expediter auto fix enabled               = Master kill switch for the TestSuiteCompletionWatchdog. When true, TestSuiteJobs that complete with failures auto-dispatch TestFixExpediter. Per-run override available via the `auto_fix_on_failure` field on /api/test-suite/submit (UI checkbox in the test runner card) — explicit False on a single submission disables auto-fix for that run only without changing this default. Default is true (run unless told otherwise).
test fix expediter max clusters                   = Upper bound on K, the number of root-cause clusters Phase 0 will produce. LLM refinement consolidates down to this cap if the heuristic seed produces more. Realworld batches cluster at K=3-8. Default is 8.
test fix expediter max cluster seed failures      = Upper bound on N, the number of failures the watchdog accepts as input. If a TestSuiteJob reports more than this, the watchdog defers to human and does not dispatch TFE. Default is 50.
test fix expediter max diagnosis iterations       = Per-cluster Phase 1 diagnose iteration cap. The lead agent can refine its diagnosis up to this many times before accepting the best-effort result. Default is 4.
test fix expediter min diagnosis confidence       = Early-exit threshold (0.0-1.0) for Phase 1 diagnose iterations. If a diagnosis reaches this confidence, iteration stops. Default is 0.65 (middle ground between speed and trustworthiness).
test fix expediter max fix attempts               = Per-cluster Phase 3 fix attempt cap. If the Tester reports failure, the Coder can redelegate up to this many times before giving up on that cluster. Default is 2.
test fix expediter max proposals per cluster      = Phase 2 proposal cap (OOS-1B). Maximum number of fix proposals the Lead may emit per failure cluster, threaded into both PROPOSAL_SYSTEM_PROMPT and the per-cluster user prompt. Default 1 favours voice-gate convergence — with N clusters × M proposals each, selection latency grows as M*N. Setting to 3 restores the legacy "1 to 3 alternative fixes" behavior. Any positive integer is valid; values >5 are not recommended.
test fix expediter coder budget small turns       = ClaudeAgentOptions.max_turns for the Phase 3 Coder when the proposal is auto-tiered "small" (single-file test_patch or config_change). Default is 50 turns (bumped from 30 on 2026-04-19 after tfe-a1c6e15a post-game showed the Coder still exhausted 30-turn budgets). Small fixes are trivial test-value flips or config threshold bumps.
test fix expediter coder budget medium turns      = ClaudeAgentOptions.max_turns for the Phase 3 Coder when the proposal is auto-tiered "medium" (single-file code_patch, 2-3 file anythings, retries). Default is 80 turns (bumped from 50 on 2026-04-19). Covers the bulk of real fixes.
test fix expediter coder budget large turns       = ClaudeAgentOptions.max_turns for the Phase 3 Coder when the proposal is auto-tiered "large" (4+ files affected — visual baselines, broad refactors). Default is 150 turns (bumped from 80 on 2026-04-19).
test fix expediter cost cap usd                   = Per-TFE-run cost ceiling in USD. Mirrors to shared FixExecutor budget_usd via config alias. When exceeded, TFE completes with partial state. Default is 15.00.
test fix expediter wall clock timeout secs        = Per-TFE-run wall-clock ceiling in seconds. Covers all phases (cluster → diagnose → propose → fix → git → rerun). Default is 2400 (40 minutes).
test fix expediter trust mode                     = Trust proxy mode for Phase 5 git strategy. Values: "inherit" (read from global SWE trust proxy, default), "fixed_l1" (force commit_only), "fixed_l3" (force branch_and_pr), "shadow" (compute but do not execute — observability only). Default is inherit.
test fix expediter rerun scope                    = Phase 6 validation rerun scope. Values: "affected" (rerun only the original test_types that failed — fast, default) or "full" (rerun the full pyramid — exhaustive, 35-60 min penalty). Default is affected.
test fix expediter continue on cluster failure    = Phase 3 fix-loop failure handling. When true (default), a failed cluster does not abort remaining clusters — maximum useful progress. When false, first failure aborts remaining clusters (atomic all-or-nothing). Default is true.
test fix expediter voice gate mode                = Voice gate UX for Phases 1 and 2. Values: "aggregate" (2 total gates: one after diagnose, one multi-select after propose — default) or "per_cluster" (K+1 gates, high-touch mode). Default is aggregate.
test fix expediter voice gate timeout policy      = What to do when the proposal voice gate times out (no user response). Values: "stall" (current behavior, raise StalledException, lose proposals — default), "top_1" (auto-select highest-confidence proposal and proceed), "top_n" (auto-select top-N by confidence — N from 'auto ratify top n'), "none" (auto-select nothing, exit cleanly). For after-hours autonomous runs, set to "top_1". RESERVED for future use: "delegate" (call UPE online-learning predictor with operator-priors; falls through to a configurable fallback if the predictor abstains). See src/rnd/v0.1.7/2026.04.28-test-suite-anomaly-remediation/05-voice-gate-policy-evolution.md for the layered architecture this evolves into.
test fix expediter voice gate auto ratify top n   = N for the "top_n" timeout policy. Number of highest-confidence proposals to auto-select on voice-gate timeout. Default is 1. Ignored when policy is anything other than "top_n".
test fix expediter feedback timeout seconds       = Timeout in seconds for blocking human feedback requests at voice gates. Default is 300 (5 minutes).
test fix expediter narrate progress               = Whether to send voice progress notifications (breadcrumbs) during each phase. Set to false for silent overnight execution. Default is true.
voice gate operator email                         = Email of the operator who receives rerouted voice gates when the job's owner is a service account (listed in 'voice gate service accounts'). Blank = no rerouting (gate goes to whoever the job targets). Solves Bug 10 (2026-04-15): TFE jobs owned by test users can't reach a human via TTS because service accounts have no WebSocket sessions.
voice gate service accounts                       = Comma-separated list of email addresses treated as service accounts. When a blocking voice call targets any of these AND 'voice gate operator email' is set, the dispatcher swaps target_user to the operator so TTS reaches a human. Abstract gets a 'Operator routing:' prefix indicating original ownership.
cosa worktree enabled                             = Master toggle for TFE/BFE git worktree isolation (Bug 9, 2026-04-16). When true, Phase 3 (FixExecutor) and Phase 5 (GitStrategist) run inside a dedicated worktree at '<sandbox root>/<job_id>' so agent edits never touch the operator's current working tree. Prevents operator uncommitted changes from being pulled into fix PRs. Default is false (opt-in; existing behavior preserved until a caller flips this on).
cosa worktree sandbox root                        = Directory (relative to project root) where isolated worktrees are created. Each job gets its own subdirectory at '<sandbox root>/<job_id>'. Default is .claude/worktrees. Add to .gitignore.
cosa worktree base ref                            = Git ref (branch/tag/sha) the new worktree is checked out from. Normally origin/main to ensure fix PRs start from a clean known base. If the ref doesn't exist, WorktreeContext falls back to HEAD with a warning. Default is origin/main.
cosa worktree auto cleanup                        = When true, the worktree is removed via 'git worktree remove' when the orchestrator exits Phase 5 (success or failure). Set to false to preserve worktrees for post-mortem debugging; operator must then run 'git worktree prune' manually. Default is true.
cosa worktree cleanup timeout secs                = Maximum seconds to wait for 'git worktree remove' to succeed before falling back to 'git worktree prune'. Cleanup failures are logged as warnings but never mask the primary job exception. Default is 30.

# ============================================================================
# Prediction Engine Configuration (Universal Decision Proxy)
# ============================================================================
prediction engine enabled                                      = Master toggle for the prediction engine. When true, predictions are generated for all response-requested notifications. When false, notifications flow through without prediction hints. Default is true.
prediction engine debug                                        = Enable verbose debug logging for prediction engine operations (embedding generation, CBR retrieval, classification). Default is false.
prediction engine cbr top k                                    = Number of most-similar past notification responses to retrieve from LanceDB for CBR prediction. Higher values give more robust consensus but slower retrieval. Default is 5.
prediction engine cbr similarity threshold                     = Minimum embedding cosine similarity (0.0-1.0) for a past notification to be considered relevant in CBR retrieval. Below this threshold, past cases are excluded from the vote. Default is 0.75.
prediction engine confidence threshold                         = Minimum prediction confidence (0.0-1.0) required for a prediction to be shown as a UI hint. Below this threshold, the prediction is logged but not displayed to the user. Default is 0.60.
prediction engine lancedb table                                = Name of the LanceDB table used for storing prediction decision embeddings. Separate from the SWE proxy table (proxy_decisions) to maintain clean data isolation. Default is prediction_decisions. Overridden to prediction_decisions_test in [Lupin: Testing] for E2E test isolation.
prediction engine embedding fallback port                      = Port number for the FastAPI server's /api/embeddings/generate endpoint, used as HTTP fallback when local GPU embedding fails (e.g., CUDA OOM from external processes). Default is 7999.
prediction engine open ended cbr top k                         = Number of similar past open-ended responses to retrieve for CBR-based prediction. These cases are given to the LLM for synthesis if no exact question match is found. Range 3-10, default 5.
prediction engine open ended cbr threshold                     = Minimum cosine similarity threshold for open-ended CBR retrieval. Higher than the general CBR threshold (0.75) because free-text answers are more sensitive to context differences. Default 0.85.
prediction engine open ended llm spec key                      = LLM model spec for open-ended answer synthesis. Used when the prediction engine needs to generate a best-guess answer from similar past cases. Default is local Phi-4 14B.
prediction engine open ended prompt template                   = Path to prompt template file for open-ended prediction synthesis. Template receives current question and similar past cases as context.
prediction hint voting enabled                                 = Master switch for the prediction-hint thumbs up/down voting feature. When true, the UI shows vote controls on prediction hints and votes are written back to the CBR store as human-confirmed training signal. Default is true.
prediction hint vote min confidence threshold                  = Minimum prediction confidence (0.0-1.0) at/above which the thumbs up/down vote controls are offered on a hint. Below this, no vote buttons are shown so the user does not train on low-confidence noise. Default is 0.50.
prediction hint vote approved weight                           = Vote weight a thumbs-up (ratification_state=approved) case contributes to its decision_value in the CBR majority tally. >1.0 makes human-approved cases count more than ordinary cases (weight 1.0). Default is 2.0.
prediction hint vote rejected weight                           = Magnitude of the NEGATIVE vote a thumbs-down (ratification_state=rejected) case casts AGAINST its decision_value in the CBR majority tally. The engine actively steers away from down-voted answers (negative example), not merely ignores them. Default is 2.0.

# ============================================================================
# Test Suite Agent Configuration
# ============================================================================
test suite default types                                       = Comma-separated list of test suite types to run by default when no specific types are requested. Valid values: integration, e2e. Default is integration,e2e (run both).
test suite default pytest args                                 = Default extra pytest arguments to pass to test runner scripts. Space-separated (e.g., "-v -k test_auth"). Empty means no extra args. These are appended to the shell script invocation.
test suite smoke extra pytest args                             = Extra pytest args auto-appended by TestSuiteJob when running the smoke suite. Default '--auto-proxy --cost-cap-usd 5.00' satisfies the pre_run_hook of test_presentation_live_smoke.py and test_research_to_presentation_live_smoke.py which require --auto-proxy. Cost cap is per-test; tune as needed. Set to empty string to disable auto-proxy injection (live_smoke tests will then bail). Provenance: 2026-05-01 post-mortem of 2026-04-30 22:15-EDT all-suite run, Phase 6 / Cluster B.
test suite integration extra pytest args                       = Extra pytest args auto-appended for the integration suite. Empty by default.
test suite e2e extra pytest args                               = Extra pytest args auto-appended for the e2e suite. Empty by default.
test suite websocket extra pytest args                         = Extra pytest args auto-appended for the websocket suite. Empty by default.
test suite unit extra pytest args                              = Extra pytest args auto-appended for the unit suite. Empty by default.

# ============================================================================
# Auto Fix — Dead Queue Watchdog + BFE Resubmission Pipeline
# ============================================================================
auto fix enabled                                               = Master toggle for the automated repair loop (BFE / dead queue watchdog). When true, the watchdog evaluates failed agentic jobs and auto-dispatches the Bug Fix Expediter. When false, all crashed agentic jobs require manual intervention via the dead-queue card. INI-only — no per-run override surface. Default is true (run unless told otherwise).
auto fix eligible job types                                    = Comma-separated list of agentic job types eligible for automated repair. Only jobs matching these types will trigger the watchdog. Valid values: presentation, deep_research, podcast, test_suite. Default includes all four types. Bug Fix Expediter jobs are NEVER eligible (prevents recursive self-repair loops).
auto fix max attempts per job                                  = Maximum number of BFE repair attempts allowed per failed job before escalating to the user. Each attempt includes diagnosis, fix, git commit, and resubmission. After this limit, the user receives an urgent notification. Default is 3.
auto fix max cost usd                                          = Maximum cumulative API cost (USD) allowed across all repair attempts for a single failed job. Prevents runaway spending from repeated LLM calls. Tracked via BFE cost_summary artifacts. Default is 10.00.
auto fix max wall clock seconds                                = Maximum elapsed time (seconds) from first failure detection to final repair attempt. Prevents the repair loop from running indefinitely on a stuck job. Default is 1800 (30 minutes).
auto fix cooldown seconds                                      = Minimum delay (seconds) between consecutive repair attempts for the same job. Prevents rapid-fire BFE submissions that could overwhelm the queue or hit rate limits. Default is 60.