# CJ Flow: Persistence
cj flow persistence enabled      = Master enable/disable flag for CJ Flow job persistence to PostgreSQL. When true, agentic job state transitions (pending, running, completed, failed) are written to the job_history table. When false, all persistence writes are silently skipped. Default is true.
cj flow persistence history days = Number of days to retain completed/failed job history rows in PostgreSQL. Used by future cleanup jobs and query default filters. Default is 30.

# CJ Flow: Timed Execution + Monopolize
cj flow timed execution enabled  = Enable timed job execution in the consumer thread. When true, jobs with a scheduled_at datetime are held in the todo queue until their scheduled time arrives. When false, scheduled_at is ignored and all jobs run immediately. Default is true.
cj flow monopolize enabled       = Enable monopolize flag support. When true, jobs with monopolize=True run exclusively — no other jobs are processed until the monopolize job completes. Designed for integration/E2E test jobs that toggle databases, hot-swap configs, or saturate auth. Default is true.

# CJ Flow: Claude Code Job Defaults
claude code job max turns default         = Maximum number of agentic turns for Claude Code bounded jobs when not specified by the caller. Controls how many tool-use round-trips the Claude Agent SDK performs before stopping. Default is 50.
claude code job timeout seconds default   = Maximum execution time in seconds for Claude Code bounded jobs when not specified by the caller. Jobs exceeding this duration are terminated. Default is 3600 (1 hour).

# DataFrame CRUD Storage Layer (Phase 1)
crud for dataframes output path                            = Base directory (relative to project root) for per-user parquet DataFrame storage. Each user gets a subdirectory under this path containing one parquet file per schema type. Default is /io/dfs.
crud for dataframes confidence threshold                   = Minimum confidence score (0.0-1.0) required from the intent extraction LLM before executing a CRUD operation. Below this threshold, the system falls back to Claude Code headless mode. Default is 0.6.
llm spec key for agent router go to crud for dataframes    = LLM specification key for the local model used for CRUD intent extraction. Points to Phi-4 14B for fast on-device inference. Used by the agent router to select the correct model endpoint.
prompt template for agent router go to crud for dataframes = Path (relative to project root) to the prompt template used for extracting CRUDIntent XML from natural language queries. Template instructs the LLM to output structured XML with operation, fields, filters, etc.
crud for dataframes agents enabled                         = Feature flag to enable the new CRUD-based DataFrame agents (TodoCrudAgent, CalendarCrudAgent) as replacements for the legacy TodoListAgent and CalendaringAgent in the queue routing. Set to false for instant rollback to legacy agents. Default is true.

# SWE Team Agent Configuration (Phase 1)
swe team enabled                         = Feature flag to enable the SWE Team multi-agent engineering team. When false, the agent router will not route to this agent and the API endpoint returns 503. Default is false (disabled until Phase 5 CJ Flow integration).
swe team lead model                      = Claude model ID for the Lead and Architect agents. Uses Opus for task decomposition and extended thinking. Default is claude-opus-4-6.
swe team worker model                    = Claude model ID for Coder, Reviewer, Tester, and Debugger agents. Uses Sonnet for cost-effective execution. Default is claude-sonnet-4-6.
swe team max iterations per task         = Hard iteration limit per subagent task. Prevents runaway loops. Default is 10.
swe team max tokens per session          = Maximum total token budget per SWE Team session across all agents. Approximately $2.50 on Sonnet, $7.50 on Opus. Default is 500000.
swe team wall clock timeout seconds      = Maximum wall-clock time in seconds for a single task. Jobs exceeding this are terminated gracefully. Default is 1800 (30 minutes).
swe team max consecutive failures        = Number of consecutive failures before escalating to human. Triggers circuit breaker demotion. Default is 3.
swe team max file changes per task       = Maximum number of file modifications allowed per task. Prevents runaway edits from sweeping the codebase. Default is 20.
swe team budget usd                      = Maximum USD spend per SWE Team session. Enforced via cost tracker. Default is 5.00.
swe team feedback timeout seconds        = Timeout in seconds for blocking human feedback requests (confirmations, decisions). Default is 300 (5 minutes).
swe team narrate progress                = Whether to send voice progress notifications during task execution. Default is true.
swe team trust mode                      = Operating mode for the SWE engineering decision proxy. Controls how autonomously the proxy handles confirmation questions. Values: "disabled" (no proxy), "shadow" (observe and log only), "suggest" (add suggestions to user prompts), "active" (auto-approve at L3+ trust). Default is shadow for safe observability-first rollout.

# ============================================================================
# Decision Proxy Configuration
# ============================================================================
decision proxy enabled                                          = Feature flag to enable the Decision Proxy Agent. When false, the proxy will not run. Default is false (Phase 4 development).
decision proxy active hours start                               = Hour (0-23) when user active hours begin. During active hours, decisions are deferred to the user. Outside active hours, the proxy handles decisions autonomously at its earned trust level. Default is 09.
decision proxy active hours end                                 = Hour (0-23) when user active hours end. Default is 22.
decision proxy timezone                                         = IANA timezone for active hours calculation. Default is America/Chicago.

# Trust Level Thresholds (decisions needed to graduate)
swe team trust proxy l2 threshold                                        = Minimum number of successful decisions before graduating from L1 (Shadow) to L2 (Suggest). Default is 50.
swe team trust proxy l3 threshold                                        = Minimum decisions for L2 to L3 graduation (Act + Notify). Default is 200.
swe team trust proxy l4 threshold                                        = Minimum decisions for L3 to L4 graduation (Autonomous + Sample Audit). Default is 500.
swe team trust proxy l5 threshold                                        = Minimum decisions for L4 to L5 graduation (Full Autonomy). Default is 1000.

# Trust Decay and Rolling Window
swe team trust proxy decay half life days                                = Half-life in days for trust score time-weighted decay. Older decisions count less toward the current trust score. Default is 14 days.
swe team trust proxy rolling window days                                 = Number of days in the rolling window for trust calculations. Decisions older than this are excluded entirely. Default is 30 days.

# Circuit Breaker Parameters
swe team trust proxy circuit breaker error rate threshold                = Error rate (0.0-1.0) that triggers the circuit breaker. When the ratio of rejected-to-total decisions exceeds this threshold, the proxy auto-demotes. Default is 0.15 (15%).
swe team trust proxy circuit breaker confidence collapse threshold       = Confidence drop threshold (0.0-1.0) that triggers circuit breaker. If average classification confidence drops below this, the proxy auto-demotes. Default is 0.3.
swe team trust proxy circuit breaker auto demotion levels                = Number of trust levels to demote when the circuit breaker trips. Default is 2 (e.g., L4 drops to L2).
swe team trust proxy circuit breaker recovery cooldown seconds           = Cooldown period in seconds before the circuit breaker resets and trust can begin re-climbing. Default is 3600 (1 hour).

# L4 Audit Sampling
swe team trust proxy l4 audit sample rate                                = Fraction (0.0-1.0) of L4 decisions randomly selected for human audit. Default is 0.10 (10%).

# Phase 0: Embedding / Vector Search
swe team trust proxy similarity threshold                                = Minimum cosine similarity (0.0-1.0) for a LanceDB vector search result to be considered a relevant match. Higher values require closer semantic matches. Default is 0.75.
swe team trust proxy lancedb table                                       = Name of the LanceDB table within the shared lupin.lancedb database used to store proxy decision embeddings. Default is proxy_decisions.

# Phase 1: Beta-Bernoulli Rate Thresholds
swe team trust proxy beta l2 rate threshold                              = Minimum success rate (lower 95% credible interval) required for Beta-Bernoulli L2 graduation. Must also meet min samples. Default is 0.70.
swe team trust proxy beta l3 rate threshold                              = Minimum success rate for L3 graduation under Beta-Bernoulli model. Default is 0.80.
swe team trust proxy beta l4 rate threshold                              = Minimum success rate for L4 graduation under Beta-Bernoulli model. Default is 0.90.
swe team trust proxy beta l5 rate threshold                              = Minimum success rate for L5 graduation under Beta-Bernoulli model. Default is 0.95.

# Phase 1: Minimum Samples per Level
swe team trust proxy beta l2 min samples                                 = Minimum number of decision observations required before Beta-Bernoulli can graduate to L2. Prevents premature trust from small samples. Default is 20.
swe team trust proxy beta l3 min samples                                 = Minimum observations for L3 graduation. Default is 50.
swe team trust proxy beta l4 min samples                                 = Minimum observations for L4 graduation. Default is 100.
swe team trust proxy beta l5 min samples                                 = Minimum observations for L5 graduation. Default is 200.

# Phase 1: Case-Based Reasoning (CBR)
swe team trust proxy cbr top k                                           = Number of most-similar past decisions to retrieve from LanceDB for CBR prediction. Higher values give more robust consensus but slower retrieval. Default is 5.
swe team trust proxy cbr confidence threshold                            = Minimum CBR confidence (0.0-1.0) required for a CBR prediction to be considered actionable. Below this threshold the prediction is logged but not used. Default is 0.60.

# Phase 2: Thompson Sampling
swe team trust proxy thompson enabled                                    = Enable Thompson Sampling for gate routing. When true, gate() draws from the Beta posterior to decide act/suggest/shadow instead of using fixed trust-level thresholds. Provides explore/exploit balance. Default is false (fixed thresholds).
swe team trust proxy thompson act threshold                              = Sampled rate threshold for autonomous action. If the Beta posterior sample >= this value, the gate returns "act". Higher values require more confidence to act autonomously. Default is 0.90.
swe team trust proxy thompson suggest threshold                          = Sampled rate threshold for provisional suggestion. If the Beta posterior sample >= this value (but < act threshold), the gate returns "suggest". Default is 0.70.

# Phase 2: GP/BALD (deferred — config keys reserved)
swe team trust proxy bald enabled                                        = Enable GP/BALD active query selection for targeted human feedback. Reserved for Phase 2.5 implementation. Default is false (not yet implemented).
swe team trust proxy bald defer threshold                                = BALD information-gain threshold below which the proxy defers to human judgment. Reserved for Phase 2.5. Default is 0.50.

# Phase 3: Conformal Prediction
swe team trust proxy conformal enabled                                   = Enable split conformal prediction for distribution-free coverage guarantees. When enabled, wraps BLR predictions with conformal sets and defers on ambiguity. Default is false.
swe team trust proxy conformal alpha                                     = Significance level for conformal prediction (1 - coverage). At alpha=0.10, the conformal set guarantees >=90% coverage. Lower values give wider (more conservative) prediction sets. Default is 0.10.

# Phase 3: ICRL (In-Context Reinforcement Learning)
swe team trust proxy icrl enabled                                        = Enable ICRL fallback for ambiguous CBR cases. When CBR returns mixed verdicts with low confidence, queries an LLM with similar case history to disambiguate. Default is false.
swe team trust proxy icrl top k                                          = Number of most-similar past decisions to include in the ICRL prompt context. More cases give the LLM better context but increase prompt size. Default is 5.

# SWE Engineering Proxy (domain-specific)
swe engineering proxy accepted senders                          = Comma-separated list of sender IDs that the SWE engineering proxy will accept decisions from. Only notifications from these senders are processed. Default includes the three active SWE team roles.
swe engineering proxy deployment cap level                      = Maximum trust level for deployment-related decisions. Prevents autonomous deployment actions above this level. Default is 3 (Act + Notify).
swe engineering proxy destructive cap level                     = Maximum trust level for destructive decisions (file deletion, branch removal, etc.). Default is 3 (Act + Notify).
swe engineering proxy architecture cap level                    = Maximum trust level for architecture decisions (dependency changes, API modifications, etc.). Default is 3 (Act + Notify).

# ============================================================================
# Bug Fix Expediter Configuration
# ============================================================================
bug fix expediter enabled                        = Feature flag to enable the Bug Fix Expediter agent. When false, the agent router will not route to this agent and the API endpoint returns 503. Default is false (disabled until orchestrator pipeline is complete in Phase 2+).
bug fix expediter lead model                     = Claude model ID for root cause diagnosis and fix planning. Uses Opus for extended thinking and forensic analysis. Default is claude-opus-4-6.
bug fix expediter worker model                   = Claude model ID for code generation and test validation. Uses Sonnet for cost-effective fix generation. Default is claude-sonnet-4-6.
bug fix expediter max diagnosis iterations       = Maximum LLM rounds for the diagnosis phase. Each round refines root cause analysis. Prevents runaway analysis loops. Default is 3.
bug fix expediter min diagnosis confidence       = Minimum confidence threshold (0.0-1.0) for accepting a diagnosis. If the Lead agent's confidence is below this, a refinement iteration is triggered. Default is 0.7.
bug fix expediter max fix attempts               = Maximum number of code-fix attempts before giving up. Each attempt generates and validates a fix via the coder-tester loop. Default is 2.
bug fix expediter max file changes per fix       = Maximum number of file modifications allowed per fix attempt. Enforced by SafetyGuard. Prevents runaway edits. Default is 20.
bug fix expediter wall clock timeout seconds     = Maximum wall-clock time in seconds for the entire BFE pipeline (diagnose + propose + fix). Jobs exceeding this are terminated gracefully. Default is 600 (10 minutes).
bug fix expediter budget usd                     = Maximum USD spend per Bug Fix Expediter session. Enforced via cost tracker. Covers all LLM calls across all phases. Default is 2.00.
bug fix expediter feedback timeout seconds       = Timeout in seconds for blocking human feedback requests such as fix approval confirmations. Default is 300 (5 minutes).
bug fix expediter narrate progress               = Whether to send voice progress notifications during each phase of the pipeline. Set to false for silent overnight execution. Default is true.
bug fix expediter auto retry on fix              = Whether to automatically retry the original failed job after a fix is applied. When false, user must manually re-submit. Default is false.
bug fix expediter require user confirm           = Whether to ask user confirmation before applying a proposed fix. When false, fixes are applied automatically based on trust proxy classification. Default is true.

# ============================================================================
# Prediction Engine Configuration (Universal Decision Proxy)
# ============================================================================
prediction engine enabled                                      = Master toggle for the prediction engine. When true, predictions are generated for all response-requested notifications. When false, notifications flow through without prediction hints. Default is true.
prediction engine debug                                        = Enable verbose debug logging for prediction engine operations (embedding generation, CBR retrieval, classification). Default is false.
prediction engine cbr top k                                    = Number of most-similar past notification responses to retrieve from LanceDB for CBR prediction. Higher values give more robust consensus but slower retrieval. Default is 5.
prediction engine cbr similarity threshold                     = Minimum embedding cosine similarity (0.0-1.0) for a past notification to be considered relevant in CBR retrieval. Below this threshold, past cases are excluded from the vote. Default is 0.75.
prediction engine confidence threshold                         = Minimum prediction confidence (0.0-1.0) required for a prediction to be shown as a UI hint. Below this threshold, the prediction is logged but not displayed to the user. Default is 0.60.
prediction engine lancedb table                                = Name of the LanceDB table used for storing prediction decision embeddings. Separate from the SWE proxy table (proxy_decisions) to maintain clean data isolation. Default is prediction_decisions. Overridden to prediction_decisions_test in [Lupin: Testing] for E2E test isolation.
prediction engine embedding fallback port                      = Port number for the FastAPI server's /api/embeddings/generate endpoint, used as HTTP fallback when local GPU embedding fails (e.g., CUDA OOM from external processes). Default is 7999.
prediction engine open ended cbr top k                         = Number of similar past open-ended responses to retrieve for CBR-based prediction. These cases are given to the LLM for synthesis if no exact question match is found. Range 3-10, default 5.
prediction engine open ended cbr threshold                     = Minimum cosine similarity threshold for open-ended CBR retrieval. Higher than the general CBR threshold (0.75) because free-text answers are more sensitive to context differences. Default 0.85.
prediction engine open ended llm spec key                      = LLM model spec for open-ended answer synthesis. Used when the prediction engine needs to generate a best-guess answer from similar past cases. Default is local Phi-4 14B.
prediction engine open ended prompt template                   = Path to prompt template file for open-ended prediction synthesis. Template receives current question and similar past cases as context.

# ============================================================================
# Test Suite Agent Configuration
# ============================================================================
test suite default types                                       = Comma-separated list of test suite types to run by default when no specific types are requested. Valid values: integration, e2e. Default is integration,e2e (run both).
test suite default pytest args                                 = Default extra pytest arguments to pass to test runner scripts. Space-separated (e.g., "-v -k test_auth"). Empty means no extra args. These are appended to the shell script invocation.