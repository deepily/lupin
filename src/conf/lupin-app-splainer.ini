suppress lancedb warnings                = Controls whether to suppress cosmetic LanceDB warnings during operation. When true (default), suppresses "nprobes is not set" warnings from LanceDB Rust layer - these are non-functional warnings that appear during metadata-only queries (text filtering) and do not affect query results. When false, shows all LanceDB warnings, which is useful when debugging vector search operations or investigating LanceDB behavior. The warnings can be safely suppressed as they indicate internal LanceDB state management, not actual errors.

