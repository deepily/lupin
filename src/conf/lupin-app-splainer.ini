# XML Parsing Strategy Configuration
##################################

xml_parsing_global_strategy                                  = Global XML parsing strategy used across all agents. Options: 'baseline' (legacy util_xml.py parsing), 'hybrid_v1' (runtime comparison between baseline and Pydantic), 'structured_v2' (full Pydantic XML models only). ✅ PRODUCTION STATUS (2025.08.12): Migration 100% complete - all agents successfully using 'structured_v2' with individual overrides configured. Baseline preserved for emergency fallback only.

xml parsing strategy for agent router go to receptionist     = XML parsing strategy override for receptionist agent. ✅ PRODUCTION: Uses ReceptionistResponse model with structured_v2 parsing.
xml parsing strategy for agent router go to math             = XML parsing strategy override for math agent. ✅ PRODUCTION: Uses CodeResponse/MathBrainstormResponse models with structured_v2 parsing.
xml parsing strategy for agent router go to calendar         = XML parsing strategy override for calendaring agent. ✅ PRODUCTION: Uses CalendarResponse model with structured_v2 parsing.
xml parsing strategy for agent router go to weather          = XML parsing strategy override for weather agent. ✅ PRODUCTION: Uses WeatherResponse model with structured_v2 parsing.
xml parsing strategy for agent router go to todo list        = XML parsing strategy override for todo list agent. ✅ PRODUCTION: Uses CodeResponse model with structured_v2 parsing.
xml parsing strategy for agent router go to date and time    = XML parsing strategy override for date and time agent. ✅ PRODUCTION: Uses CodeResponse model with structured_v2 parsing.

xml parsing strategy for agent router go to bug injector     = XML parsing strategy override for bug injector agent. ✅ PRODUCTION: Uses BugInjectionResponse model with structured_v2 parsing for specialized line-number and bug validation. Phase 6 migration completed successfully.
xml parsing strategy for agent router go to debugger         = XML parsing strategy override for debugger agent. ✅ PRODUCTION: Uses IterativeDebuggingMinimalistResponse/IterativeDebuggingFullResponse models with structured_v2 dual-mode parsing. Phase 6 migration completed successfully.

xml parsing migration debug mode                             = Boolean flag to enable detailed debug output during XML parsing operations. When True, shows parsing strategy selection, timing comparisons, and field extraction details. Default is False. Useful for troubleshooting migration issues.

xml parsing migration comparison logging                     = Boolean flag to enable side-by-side comparison logging when using hybrid_v1 strategy. When True, logs results from both baseline and Pydantic parsing for verification. Default is False. CAUTION: May significantly increase log volume.

xml parsing migration force both strategies                  = Boolean flag to force execution of both parsing strategies regardless of selected strategy. When True, always runs baseline and Pydantic parsing for comparison, but uses configured strategy result. Default is False. Useful for comprehensive migration testing.

# Utility class Pydantic integration (Phase 5)
gister use pydantic xml parsing                               = Enable Pydantic SimpleResponse model for Gister XML parsing instead of baseline util_xml parsing.
confirmation dialogue use pydantic xml parsing               = Enable Pydantic YesNoResponse model for ConfirmationDialogue XML parsing instead of baseline util_xml parsing.

##################################
# Additional Configuration
##################################

prompt template for confirmation dialog  = Path to the yes/no confirmation dialog prompt template
prompt template for gist generation      = Path to the gist extraction prompt template. Used by Gister class to summarize short utterances. Cache-enabled for this prompt only.
prompt template for session title        = Path to the session title generation prompt template. Used by Gister class (with prompt_key parameter) to create 3-5 word session names. Cache bypassed for this prompt.
prompt template for deep research session id generation = Path to the prompt template for extracting 3-word hyphenated semantic topics from Deep Research queries. Used by Gister class to generate session identifiers like "python-javascript-comparison". Cache bypassed.
prompt template for deep research session name          = Path to the prompt template for extracting 3-5 word human-readable session names from Deep Research queries. Generates names with spaces (e.g., "cats vs dogs") for UI display. Semantic topic is derived by converting spaces to hyphens.
similarity_threshold_confirmation        = Similarity threshold for confirmation matching (0-100)
similarity_threshold_question            = Similarity threshold for question matching (0-100)
similarity_threshold_question_gist       = Similarity threshold for question gist matching (0-100)
similarity_threshold_admin_search        = Similarity threshold for admin snapshot search UI (0-100). Lower than queue threshold to enable discovery/exploration of similar snapshots.
normalization_version                     = Version identifier for normalization algorithm (v2.0 = no punctuation preservation)
fifo todo queue enable input gisting      = Runtime-configurable flag for FIFO todo queue text processing. When True, uses GistNormalizer (LLM extraction + normalization). When False, uses only Normalizer (normalization without LLM). Can be changed at runtime without restart.
vox_command_prompt_path_wo_root          = Path to the voice command prompt template file