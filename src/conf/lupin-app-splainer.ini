podcast voice male similarity boost              = Similarity boost for male host (0.0-1.0). Controls voice fidelity for expert/knowledgeable delivery. Default: 0.80.
podcast voice male style                         = Style/expressiveness for male host (0.0-1.0). Higher values for more engaging, expressive expert delivery. Default: 0.50.

