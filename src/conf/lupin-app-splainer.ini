cc session voice persona overflow name           = Name of the persona to use as the pool-exhaustion overflow slot. The named persona must have matching `cc session voice persona <name> {voice id, icon, color, profile}` keys defined and must NOT be listed in `cc session voice persona pool` above (else it would be allocatable both as a regular pool member AND as the overflow, which would defeat the spillover semantics). Default: "sam" (the historical hardcoded overflow). 2026-05-19 set to "arnold" when Sam was promoted into the regular pool and Arnold was demoted into the overflow slot. Backward compat: when set to "sam" AND no `cc session voice persona sam voice id` key is present, the loader falls back to sourcing voice_id from `elevenlabs tts default voice id` (preserves byte-clean behavior for legacy configs). Set to empty/whitespace to disable the overflow slot entirely — pool exhaustion then falls back to the legacy hash-borrow path in pick_unallocated_persona.

cc session voice persona extra colors            = Comma-separated CSS hex palette for "Extra N" overflow identities, cycled by (N-1) % len. Under the Option-A overflow model (2026-05-28), the FIRST pool-exhaustion overflow session gets the overflow persona verbatim (Arnold); once Arnold is itself occupied, the 2nd, 3rd... concurrent overflow sessions are allocated "Extra 1", "Extra 2"... — each carrying a distinct color from this palette but sharing Arnold's voice_id and icon (eye-distinct, ear-shared). The lowest free Extra index is computed statelessly from the live bridge scan, so a dead Extra session frees its number for re-use (gaps are reused, not skipped). Empty/whitespace → Extras inherit Arnold's color. Default: #4527A0 (indigo), #6A1B9A (purple), #9C27B0 (orchid), #AD1457 (magenta), #C2185B (rose), #7B1FA2 (violet). See: src/rnd/v0.1.7/2026.05.28-extra-n-overflow-personas.md.

cc session voice persona stale threshold seconds = Maximum age (in seconds) of a persona-bearing bridge file's mtime before the in-container occupancy scan (find_active_voice_persona_sessions) treats it as stale and frees the slot for re-allocation. Belt-and-suspenders for the residual case where the host-side prune at SessionStart didn't fire (e.g., container bounced mid-day with no new sessions). The cc-notification-listener heartbeat updates bridge mtime periodically, so an actively-used session keeps its mtime fresh within this window. Default 43200 (12 hours). Increase if you expect single-session work sessions longer than 12 hours.

cc session spawn max reviewers                   = Maximum number of headless reviewer sessions a single "manager" persona may spawn in one spawn_sessions call. Read by the cosa-voice MCP spawn_sessions tool (via session_spawner.resolve_spawn_config) and enforced in session_spawner.spawn_sessions: a request exceeding this cap raises ValueError (returned to the caller as {status:"error"}) rather than silently truncating. Default 8 (matches the named voice-persona pool size; with Extra-N overflow, identities never run out, but the cap bounds OAuth/rolling-window load). See src/rnd/v0.1.7/2026.05.28-manager-spawned-reviewers.md.

cc session spawn reviewer ack timeout seconds    = Seconds a manager session should wait for a freshly-spawned reviewer to post its "ready,[role]" ack to dm-{manager-persona} before escalating (Step 4 of the cascaded plan-review workflow). The operator runbook (plan-review-cascaded-on-demand-spawn.md §3.3) reads this INI value as the escalation deadline. (A future pass may surface it per-session in the spawn_sessions result as expected_ack_deadline; not wired yet.) Default 120 (2 minutes).

cc session spawn write memento default           = Default value for the dismiss_sessions(write_memento) parameter when the caller passes None. When true, a dismissed reviewer is given a chance to write a memento to io/mementos/<persona-slug>-<YYYY.MM.DD-at-HHMM>.md (per workflow/memento-management.md §3.2) before its tmux session is killed, so the persona's task specialization survives a future re-spawn (the manager passes that archived path back as seed_memento for narrative continuity). Default true.

cc session spawn model reviewer                  = Model id the cosa-voice MCP spawn_sessions tool pins for a headless spawn with role=reviewer, forwarded to the child as `claude --model <id>` via session_spawner (the build_spawn_argv claude_args pass-through seam). Resolution order for any spawn: the tool's explicit `model` param → this per-role key → the `cc session spawn model default` key (covers unknown/new roles) → None (no --model flag → the child inherits Rick's user default, fail-open zero-risk rollout). Full model id (not an alias like "opus") so a release never silently upgrades the model — and cost — under us. Cost-split posture (2026-07-02): workers on Opus 4.8; managers on Fable 5 via Rick's USER default (no `manager` key ships, per ruling #2 — managers are launched interactively, not via this tool). Default claude-opus-4-8. See planning-is-prompting/src/rnd/2026.07.02-spawn-model-directive-investigation-and-plan.md.
cc session spawn model author                    = Model id spawn_sessions pins for a headless spawn with role=author. Same resolution + rationale as `cc session spawn model reviewer` (explicit param → this key → `default` key → no flag). Default claude-opus-4-8.
cc session spawn model observer                  = Model id spawn_sessions pins for a headless spawn with role=observer. Same resolution + rationale as `cc session spawn model reviewer` (explicit param → this key → `default` key → no flag). Default claude-opus-4-8.
cc session spawn model default                   = Fallback model id spawn_sessions pins when a spawn's role has no matching `cc session spawn model <role>` key (unknown/new roles). Resolution: the tool's explicit `model` param → the role-specific key → THIS key → None (no --model flag → inherit the user default). Set to a real model id to make every un-keyed role default to it; leave absent to fail-open (no flag) for un-keyed roles. Default claude-opus-4-8.

# Presentation Generator Configuration
presentation generator content model             = Claude model for slide content generation. Higher reasoning for narrative decomposition and assertion-style titles. Default: claude-opus-4-6.
presentation generator automated content model   = Claude model for automated/CI test runs. Cost-effective model for regression testing where structural validity matters more than prose quality. Used by smoke tests and test-suite jobs. Haiku ($0.06/run) produced 0 slides; Sonnet ($0.49/run) is the quality/cost sweet spot. Default: claude-sonnet-4-6.
presentation generator content max turns          = Bounded-CC (in-process sdk_query) turn cap for each content-phase LLM call (analysis/outline/elaboration/mermaid/matplotlib/d2/json). Each call is single-shot, so the cap is small; the bounded path REQUIRES an explicit max_turns. Default: 5.
presentation generator target duration minutes   = Target presentation duration in minutes. Controls slide count via slides_per_minute heuristic. Default: 15.
presentation generator slides per minute         = Slides-per-minute pacing heuristic. 0.5-0.75 for dense/technical, 1.0 for moderate (recommended), 1.5-2.0 for fast/visual. Default: 1.0.
