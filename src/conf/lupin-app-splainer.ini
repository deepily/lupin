# Podcast Generator Target Audience
podcast generator audience                       = Target expertise level for podcast dialogue. Controls depth, terminology, and explanation style in generated scripts. Options: 'beginner' (more analogies, simpler language, define terms), 'general' (balanced depth and accessibility), 'expert' (assume domain knowledge, focus on nuance/trade-offs), 'academic' (include citations, methodology critique, technical depth). Default is 'academic'. CLI override: --audience
podcast generator audience context               = Optional custom description of the target audience beyond the level. Provides additional context for podcast script customization. Example: "AI researchers familiar with transformer architectures". When set, this context is injected into script generation prompts alongside the audience level. CLI override: --audience-context

# Podcast Generator Timeout Configuration
podcast script review timeout seconds            = Timeout in seconds for script review prompts. Allows user time to read full script before approval. Default is 240 seconds (4 minutes).

# Podcast Generator Source Search Paths
podcast generator source search paths            = Comma-separated directories (relative to LUPIN_ROOT) searched recursively for .md files during fuzzy matching. Supplements the user's deep research directory. Default: /src (covers all source code and documentation in the repo)

# Podcast Generator Model Selection
podcast script model                             = Claude model for script generation. Higher reasoning for natural dialogue. Default: claude-opus-4-6.

# Podcast Generator Script Generation
podcast target duration minutes                  = Target podcast duration in minutes. Controls exchange count heuristics. Default: 10.
podcast min exchanges                            = Minimum number of host-to-host exchanges in generated script. Default: 8.
podcast max exchanges                            = Maximum number of host-to-host exchanges in generated script. Default: 20.
podcast script max turns                          = Bounded-CC (in-process sdk_query) turn cap for each script-phase LLM call (analysis/script/revision/json). Script generation is effectively single-shot, so the cap is small; the bounded path REQUIRES an explicit max_turns. Default: 5.
podcast include intro                            = Whether to generate an intro segment for the podcast. Default: true.
podcast include outro                            = Whether to generate an outro segment for the podcast. Default: true.
podcast prosody annotation level                 = Level of prosody annotations in script. Options: 'minimal' (few/no annotations), 'moderate' (key emphasis and pauses), 'detailed' (comprehensive annotations). Default: moderate.

# Podcast Generator Content Processing
podcast max research doc tokens                  = Maximum tokens to extract from the research document for script generation. Longer documents are truncated. Default: 100000.
podcast key topics to extract                    = Number of key topics to extract from the research document. Default: 5.
podcast examples per topic                       = Number of examples to extract per topic for use in dialogue. Default: 2.

# Podcast Generator Execution Limits
podcast max script revisions                     = Maximum number of script revision rounds before finalizing. Default: 3.
podcast feedback timeout seconds                 = Timeout in seconds for user feedback during podcast generation. Default: 300 (5 minutes).

# Podcast Generator Output Configuration
podcast output dir template                      = Template for podcast output directory. {user} is replaced with user_id. Default: io/podcasts/{user}.
podcast script filename template                 = Template for script filenames. {timestamp} and {topic} are replaced. Default: {timestamp}-{topic}-script.md.
podcast audio filename template                  = Template for audio filenames. {timestamp} and {topic} are replaced. Default: {timestamp}-{topic}.mp3.

# Podcast Generator Audio Settings
podcast audio format                             = Audio output format. Options: 'mp3' or 'wav'. Default: mp3.
podcast audio bitrate                            = Audio bitrate for MP3 encoding. Default: 192k.
podcast silence between speakers ms              = Milliseconds of silence inserted between speaker segments. Default: 300.

