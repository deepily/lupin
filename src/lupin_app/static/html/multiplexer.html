<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Multiplexer</title>
    <link rel="stylesheet" href="/static/css/lupin-base.css">
    <link rel="stylesheet" href="/static/css/lupin-nav.css">
    <!-- SHARED layout-contract surfaces (page-frame + sender cards + date
         accordions + sender messages + expired/abstract/progress), single-sourced
         BYTE-FAITHFUL from notifications.css and linked by BOTH /app/notifications
         and /app/multiplexer (Pillar 1 / D1 Rider A). Supersedes the old
         page-frame.css + the copied contract rules in notifications-list.css.
         See src/rnd/v0.1.9/2026.06.19-multiplexer-layout-parity-methodology/. -->
    <link rel="stylesheet" href="/static/css/shared/notifications-surface.css">
    <!-- Mux-only + mux-mechanism overrides ([data-collapsed] collapse, persona
         badge button, renamed labels, pane structure). Linked AFTER the shared
         sheet so the mux overrides win where intended. -->
    <link rel="stylesheet" href="/static/css/multiplexer/notifications-list.css">
    <link rel="stylesheet" href="/static/css/multiplexer/notifications-header.css">

    <link rel="stylesheet" href="/static/css/multiplexer/action-required.css">
    <link rel="stylesheet" href="/static/css/multiplexer/tts-chrome.css">
    <link rel="stylesheet" href="/static/css/multiplexer/conversation-mode-pin.css">
    <link rel="stylesheet" href="/static/css/multiplexer/focus-tray.css">
    <link rel="stylesheet" href="/static/css/multiplexer/persona-modal.css">
    <link rel="stylesheet" href="/static/css/multiplexer/sender-card-recorder.css">
    <link rel="stylesheet" href="/static/css/multiplexer/session-strip.css">
    <link rel="stylesheet" href="/static/css/multiplexer/reading-pane.css">
    <link rel="stylesheet" href="/static/css/multiplexer/commons-activity.css">
    <!-- Lane C (v0.1.9): broadcast-to-all-CC compose card. -->
    <link rel="stylesheet" href="/static/css/multiplexer/broadcast.css">
    <!-- Lane E full-parity quartet (WP12/13/14/15) — WP13 tts-preview-slider
         CSS co-located into shared/notifications-surface.css (BE2 hygiene,
         task 80479273, 2026-07-01); its standalone sheet was retired. -->
    <link rel="stylesheet" href="/static/css/multiplexer/missed-badge.css">
    <link rel="stylesheet" href="/static/css/multiplexer/prediction-vote.css">
    <link rel="stylesheet" href="/static/css/multiplexer/fleet-status.css">
    <link rel="stylesheet" href="/static/css/multiplexer/task-list.css">
    <!-- Section-toolbar + accordion-collapse parity (2026-06-23) — the
         #section-toolbar container (horizontal top-bar; mirrors legacy
         horizontal-mode .section-toolbar) + .section-hidden. The shared button
         appearance (.toolbar-btn / .task-accordion-btn) lives in the shared
         notifications-surface.css sheet (parity contract). -->
    <link rel="stylesheet" href="/static/css/multiplexer/section-toolbar.css">
    <script src="/static/js/vendor/marked.min.js"></script>
    <script src="/static/js/vendor/purify.min.js"></script>
</head>
<body>
    <!-- Lane L4 (v0.1.9) — top nav / logout bar mount (PORT of lupin-nav.js).
         NavBarRenderer builds the <nav.lupin-nav> into this div (first child of
         <body>); styled by the already-linked lupin-nav.css (head, above).
         Body-padding for the fixed nav is DEFERRED to the E2E visual-snapshot
         check (F-K-D3) — a scoped mux override is added ONLY if the snapshot
         shows a fixed-nav / page-frame collision. -->
    <div id="lupin-nav-mount" data-testid="multiplexer-lupin-nav-mount"></div>
    <!-- WP4 master-detail two-pane shell (multiplexer parity, 2026-06-10 —
         ports notifications.js master-detail; ReadingPaneRenderer mounts on
         .content-shell). In vertical mode (default) .content-shell + .left-column
         are no-op block pass-throughs — the page looks single-column. In
         horizontal mode (body[data-layout-mode="horizontal"]) + .pane-open, the
         shell becomes a flex-row split: left column ~2/3, Reading Pane ~1/3.
         Toggled via #layout-mode-toggle. -->
    <div class="content-shell">
    <div class="left-column">
        <!-- Layout-mode toggle — floats over the top-center of the left column
             in horizontal mode (positioned via --toolbar-center-x). -->
        <div class="reading-pane-toolbar" id="reading-pane-toolbar">
            <button class="layout-mode-btn"
                    id="layout-mode-toggle"
                    data-testid="multiplexer-layout-mode-toggle"
                    type="button"
                    title="Switch to horizontal layout (Reading Pane on right). Best at viewports ≥ 1200px wide.">⇆</button>
        </div>
        <!-- Section-toolbar + accordion-collapse parity (2026-06-23, Rachel 🕊️).
             Carbon-copy of the legacy floating #section-toolbar (per-section
             visibility toggles + collapse-all/expand-all). SectionToolbarRenderer
             builds #section-toolbar into this mount; the layout-mode ⇆ stays in
             #reading-pane-toolbar above (mux-N/A for the toolbar — see
             src/rnd/v0.1.9/.../06-section-toolbar-and-accordion-toggle-design.md). -->
        <div id="section-toolbar-mount" data-testid="multiplexer-section-toolbar-mount"></div>
    <main class="container">
        <h1>Multiplexer</h1>

        <!-- B1 (01-A, 2026-06-29): legacy CC-section order — Broadcast card (TOP,
             with commons "Recent Activity" re-nested INSIDE its rendered subtree)
             → Focus bar → Sessions. BroadcastCardRenderer injects the compose card
             AND the nested commons chrome into this empty mount; CommonsActivity
             Renderer then mounts onto the rendered-in commons root. boot.ts wires
             broadcast-FIRST, then a post-mount querySelector for the commons root
             (the root is renderer-PRODUCED now, so a page-load getElementById would
             be null). Recipient auto-refresh rides store_session_strip_changed. -->
        <div id="broadcast-card-mount" data-testid="multiplexer-broadcast-card-mount"></div>

        <!-- WP2 (parity bridge) CC-session strip mount point. Inert until
             SessionStripRenderer is wired in boot.ts (deferred thin step
             against Lane A's mount-slot convention); the renderer lifts the
             data-phase6-pending markers, drives #cc-session-strip visibility,
             and keyed-merges icons into #cc-strip-icons. -->
        <div id="cc-session-strip" class="cc-session-strip"
             data-testid="multiplexer-cc-session-strip"
             data-phase6-pending="true" hidden>
            <div id="cc-strip-icons"
                 data-testid="multiplexer-cc-strip-icons"></div>
            <button id="cc-strip-toggle" type="button" class="cc-strip-toggle"
                    data-testid="multiplexer-cc-strip-focus-toggle"
                    data-phase6-pending="true" data-focus-active="false">👁 Focus</button>
            <button id="cc-hide-inactive-toggle" type="button" class="cc-strip-toggle"
                    data-testid="multiplexer-cc-hide-inactive-toggle"
                    data-phase6-pending="true" data-hide-inactive="false">👁 All</button>
        </div>

        <!-- Lane E WP15 mount point: "N missed while away" badge + Reset.
             MissedBadgeRenderer paints into this when undelivered_count > 0;
             empty (badge hidden) otherwise. -->
        <div id="missed-badge-mount" data-testid="multiplexer-missed-badge-mount"></div>

        <!-- ============================================================
             Lane 0c (2026-07-02, Rachel 🕊️) — accordion ORDER + default
             VISIBILITY reworked to legacy relative sequence (06 §3 Lane 0c):
                 Action Required → Playing/TTS → CC Notifications →
                 Fleet Status → Task List → Job Queues(hidden).
             boot.ts mounts every pane by getElementById, so DOM-div order =
             visual order ONLY — the F13 mount-order invariant is untouched by
             this reorder. Page chrome (broadcast card, cc-session-strip,
             missed-badge, persona-modal-portal) keeps its position; only the 6
             accordions are re-sequenced relative to one another.
             ============================================================ -->

        <!-- (1) ACTION REQUIRED — extracted from inside #notifications-pane into
             a standalone LEADING accordion (legacy: Action-Required is first).
             CSS for #action-required-section is id-scoped, so pulling it out of
             the notifications pane does not change its styling. ActionRequired
             Renderer mounts here by id (order-independent). -->
        <div id="action-required-section"
             data-testid="multiplexer-action-required-section"></div>

        <!-- (2) PLAYING / TTS — position 2, cold-VISIBLE (legacy shows Playing):
             the `hidden` attribute is removed. data-phase6-pending is retained
             (boot.ts lifts it on TtsChromeRenderer mount). -->
        <section id="tts-pane"
                 data-testid="multiplexer-tts-pane"
                 data-phase6-pending="true"></section>

        <!-- (3) CC NOTIFICATIONS — the section-header REGION (count · history ·
             clear-all + relocated TTS-preview slider) sits directly ABOVE its
             list pane (legacy header-above-list order); both move together as
             the notifications accordion.

             B2 (01-B) note: the slider is a SIBLING of (NOT a child of)
             #notifications-header-mount — NotificationsHeaderRenderer owns that
             mount wholesale via root.replaceChildren(header, historyPanel), so a
             nested slider would be wiped on every header render. Both ids stay
             byte-stable → boot.ts mounts each by getElementById. -->
        <div class="notifications-header-region" data-testid="multiplexer-notifications-header-region">
            <!-- B3 (01-C) section-header mount point: count · history-dropdown ·
                 clear-all. Filter-badge/toggle are DEFERRED per Rick's own-only
                 scope (67fc18f0/a767e1ae). -->
            <div id="notifications-header-mount" data-testid="multiplexer-notifications-header-mount"></div>

            <!-- Lane E WP13: TTS preview-fraction slider (TtsPreviewSliderRenderer
                 owns this subtree; sits AFTER the header-mount). -->
            <div id="tts-preview-slider-mount" data-testid="multiplexer-tts-preview-slider-mount"></div>
        </div>

        <!-- Phase 5 notifications-list pane. #action-required-section was
             extracted to the leading position above (Lane 0c), so this pane now
             holds only the sender-cards container. -->
        <section id="notifications-pane" class="notifications-pane"
                 data-testid="multiplexer-notifications-pane">
            <!-- WP2 retire (2026-06-10): the #focus-mode-toggle (FocusTrayRenderer)
                 was removed — the CC-session strip's focus toggle (#cc-strip-toggle,
                 above) supersedes it. -->
            <div id="sender-cards-container"
                 data-testid="multiplexer-sender-cards"></div>
        </section>

        <!-- (4) FLEET STATUS — read-only Fleet-Status table (Lane E WP12).
             FleetStatusRenderer builds its own chrome + auto-polls
             /api/arbiter/fleet-state every 60s. -->
        <section id="fleet-status-pane"
                 data-testid="multiplexer-fleet-status-pane"></section>

        <!-- (5) TASK LIST — read-only Task-List card (Step 4, store-canonical).
             TaskListRenderer builds its own chrome + auto-polls /api/tasks. -->
        <section id="task-list-pane"
                 data-testid="multiplexer-task-list-pane"></section>

        <!-- (6) JOB QUEUES — position 6, cold-HIDDEN by default (legacy hides
             Job Queues; Q3 RULED hidden). The `hidden` attribute is the
             cold-start default; a persisted user choice (.section-hidden via the
             section-toolbar) OVERRIDES it (F-Clay-A3). JobsPaneRenderer no longer
             strips `hidden` on mount (Lane 0c), so this default survives.
             Phase 6a jobs-pane (data-phase6-pending lifted on mount). -->
        <section id="jobs-pane" hidden
                 data-testid="multiplexer-jobs-pane">
            <!-- Lane 0a: the section-header bar (📝 Jobs) is now emitted by
                 JobsPaneRenderer (uniform .section-header contract), replacing the
                 former inert static .jobs-pane-header + unwired "Load history"
                 button. -->
            <div id="jobs-buckets-container"
                 data-testid="multiplexer-jobs-buckets"></div>
        </section>

        <!-- B1 (01-A): the standalone #broadcast-card-mount + #commons-activity-pane
             siblings that formerly lived here were relocated — broadcast-card-mount
             moved to the TOP (after <h1>), and the commons "Recent Activity" chrome
             was re-nested INSIDE the rendered broadcast card (broadcastCard.ts). -->

        <!-- WP2 retire (2026-06-10): #focus-tray (FocusTrayRenderer) removed —
             the CC-session strip supersedes the interim focus tray. The mount
             slot is intentionally NOT re-added here: the shipped bundle contains
             zero references to #focus-tray (FocusTrayRenderer is unwired). -->

        <!-- Phase 6c Node A mount point (Step A5): persona-modal portal.
             PersonaModalRenderer appends one <div popover> per sender with a
             voice persona; each popover's id matches the popovertarget on
             the corresponding .sender-persona-badge button in the sender
             card header. -->
        <div id="persona-modal-portal" data-testid="multiplexer-persona-modal-portal"></div>
    </main>
    </div><!-- /.left-column -->

    <!-- Draggable splitter between left column and Reading Pane. Hidden by CSS
         when the pane is closed; ReadingPaneRenderer wires mousedown + persists
         the ratio. -->
    <div class="content-pane-splitter"
         id="content-pane-splitter"
         data-testid="multiplexer-content-pane-splitter"
         role="separator"
         aria-orientation="vertical"
         title="Drag to resize"></div>

    <!-- Reading Pane (WP4). Hidden until populated. In horizontal mode + open,
         becomes a sticky-top scrollable surface holding rendered abstract
         markdown OR an iframe at /app/docs?path=... for doc-viewer links. -->
    <aside class="content-pane" id="content-pane" hidden>
        <div class="content-pane-header">
            <button class="content-pane-back"
                    id="content-pane-back"
                    data-testid="multiplexer-content-pane-back"
                    type="button"
                    title="Back to previous content"
                    disabled>←</button>
            <span class="content-pane-title" id="content-pane-title"></span>
            <button class="content-pane-bustout"
                    id="content-pane-bustout"
                    data-testid="multiplexer-content-pane-bustout"
                    type="button"
                    title="Open in new tab">⤢</button>
            <button class="content-pane-close"
                    id="content-pane-close"
                    data-testid="multiplexer-content-pane-close"
                    type="button"
                    title="Close pane">×</button>
        </div>
        <div class="content-pane-body" id="content-pane-body"
             data-testid="multiplexer-content-pane-body">
            <!-- Dynamic: rendered markdown for abstracts, or an iframe for doc-links -->
        </div>
    </aside>
    </div><!-- /.content-shell -->
    <!-- Runtime manifest-driven cache-bust (replaces the hand-bumped ?v= that
         drifted): read the build manifest to resolve the content-hashed bundle
         filename (boot.<hash>.js), then import it. The hash changes whenever the
         bundle content changes, so the browser fetches a fresh bundle with no
         manual cache-bust to maintain. manifest.json is fetched no-store so the
         resolver always sees the latest hash. On any manifest failure we fall
         back to the stable boot.js so a build/serve hiccup never blanks the page
         (the stable filename is always emitted alongside the hashed copy by
         src/scripts/build-multiplexer.sh). -->
    <script type="module">
        const DIST_BASE    = "/static/dist/multiplexer/";
        const MANIFEST_URL = DIST_BASE + "manifest.json";
        try {
            const resp = await fetch( MANIFEST_URL, { cache: "no-store" } );
            if ( !resp.ok ) throw new Error( `manifest HTTP ${ resp.status }` );
            const manifest = await resp.json();
            const bundle   = manifest[ "boot.js" ];
            if ( !bundle ) throw new Error( "manifest missing 'boot.js' key" );
            await import( DIST_BASE + bundle );
        } catch ( err ) {
            console.error( "[multiplexer] manifest-driven boot failed; falling back to stable boot.js:", err );
            await import( DIST_BASE + "boot.js" );
        }
    </script>
</body>
</html>
