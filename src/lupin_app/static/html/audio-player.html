<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Player — Lupin</title>

    <link rel="stylesheet" href="/static/css/lupin-base.css">
    <link rel="stylesheet" href="/static/css/lupin-nav.css">
    <style>
        .audio-player-container {
            max-width: 860px;
            margin: 32px auto;
            padding: 0 24px 48px;
        }

        /* embed=1 — strip nav + page chrome so the player fits a narrow container */
        body.embed #lupin-nav { display: none !important; }
        body.embed .audio-player-container { margin: 8px auto; padding: 0 12px 12px; }
        /* Mini face: the native audio element and nothing else, filling the small widget frame. */
        /* lupin-nav.js sets an inline 56px padding-top on the body even when the nav is hidden; !important beats it. */
        body.embed { margin: 0 !important; padding: 0 !important; }
        body.embed .audio-player-container { margin: 0; padding: 0; max-width: none; }
        body.embed .audio-player-element { margin: 0; display: block; }

        .audio-player-loading {
            text-align: center;
            padding: 64px 0;
            color: #6b7280;
            font-size: 15px;
        }

        .audio-player-error {
            text-align: center;
            padding: 64px 0;
            color: #dc2626;
            font-size: 15px;
        }

        .audio-player-content h1.audio-player-title {
            font-size: 28px;
            font-weight: 700;
            margin: 32px 0 16px;
            color: #111827;
            border-bottom: 1px solid #e5e7eb;
            padding-bottom: 8px;
        }

        .audio-player-element {
            width: 100%;
            margin: 24px 0;
            border-radius: 8px;
        }

        .audio-player-actions {
            margin: 16px 0 24px;
        }

        .audio-player-download {
            display: inline-block;
            padding: 10px 20px;
            background: #4f46e5;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.15s;
        }
        .audio-player-download:hover {
            background: #4338ca;
            text-decoration: none;
        }

        .audio-player-links { margin: 0 0 16px; display: flex; gap: 16px; flex-wrap: wrap; font-size: 14px; }
        .audio-player-links a { color: #4f46e5; text-decoration: none; cursor: pointer; }
        .audio-player-links a:hover { text-decoration: underline; }
        .audio-player-details {
            margin: 24px 0 0;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            overflow: hidden;
        }
        .audio-player-details summary {
            padding: 10px 16px;
            font-size: 13px;
            font-weight: 600;
            color: #6b7280;
            background: #f9fafb;
            cursor: pointer;
            user-select: none;
        }
        .audio-player-details summary:hover { background: #f3f4f6; }
        .audio-player-details dl {
            display: grid;
            grid-template-columns: max-content 1fr;
            gap: 4px 16px;
            padding: 12px 16px;
            margin: 0;
            font-size: 13px;
        }
        .audio-player-details dt { font-weight: 600; color: #374151; }
        .audio-player-details dd { margin: 0; color: #6b7280; word-break: break-word; }
    </style>
</head>
<body>
    <div class="audio-player-container">
        <div id="audio-player-target" class="audio-player-loading">Loading audio player...</div>
    </div>

    <script src="/static/js/lupin-nav.js" defer></script>
    <script src="/static/js/vendor/marked.min.js"></script>
    <script src="/static/js/vendor/purify.min.js"></script>
    <script>
        ( async function() {
            const target   = document.getElementById( 'audio-player-target' );
            const params   = new URLSearchParams( window.location.search );
            const path     = params.get( 'path' );
            const embed    = params.get( 'embed' ) === '1';
            const autoplay = params.get( 'autoplay' ) === '1';
            const probe    = params.get( 'probe' ) === '1';

            // embed=1 — hide nav + tighten chrome (set synchronously, before deferred nav renders)
            if ( embed ) document.body.classList.add( 'embed' );

            if ( !path ) {
                target.className = 'audio-player-error';
                target.textContent = 'No audio path specified. Use ?path=podcasts/...';
                return;
            }

            // The job passes the script, the original document and the clean title in the link.
            // Old cards carry none of them: the title then comes from the file name, minus date and serial.
            const filename   = path.split( '/' ).pop();
            const scriptPath = params.get( 'script' );
            const sourcePath = params.get( 'source' );

            // "2026.11.01-014849-grading-your-own-exam-construct-validit.mp3" -> "Grading Your Own Exam Construct Validit"
            function titleFromFilename( name ) {
                return name
                    .replace( /\.[^.]+$/, '' )
                    .replace( /^\d{4}\.\d{2}\.\d{2}-\d{6}-/, '' )
                    .replace( /-[0-9a-f]{8}$/i, '' )
                    .replace( /[-_]/g, ' ' )
                    .replace( /\b\w/g, c => c.toUpperCase() );
            }

            const displayTitle = ( params.get( 'title' ) || '' ).trim() || titleFromFilename( filename );
            document.title = displayTitle + ' — Lupin';

            function escapeHtml( text ) {
                return text.replace( /&/g, '&amp;' ).replace( /</g, '&lt;' ).replace( />/g, '&gt;' ).replace( /"/g, '&quot;' );
            }

            const audioApiUrl = '/api/io/file?path=' + encodeURIComponent( path );

            // /api/io/file requires an `Authorization: Bearer` header (HTTPBearer —
            // no cookie, no ?token param). A native <audio src> tag cannot attach a
            // header, so the mp3 401'd and the player has never produced sound
            // (bug 4cfabc0f). Fix: BLOB-FETCH — GET the file WITH the header, wrap
            // the bytes in an object URL, and hand THAT to <audio>. The player is
            // same-origin with the app (also inside the notifications overlay
            // iframe), so the JWT in localStorage is readable here.
            const token    = localStorage.getItem( 'lupin_access_token' );
            const authInit = token ? { headers: { Authorization: 'Bearer ' + token } } : {};

            // ── REFRESH-AND-RETRY (bug 38943485, defect 2) ───────────────────────
            // This page is STANDALONE — it is not the notifications app and has no
            // access to its authedFetch/ensureValidToken wrapper, so every fetch below
            // used to fire with whatever localStorage happened to hold and turn a 401
            // into "Could not load audio" with no retry and no way forward but a
            // manual reload.
            //
            // The window is small but real: the app's proactive refresh rides the
            // WebSocket heartbeat, so when that socket is down or the tab is
            // backgrounded (where browsers throttle timers) the token can age past
            // expiry before anything renews it — and clicking Play is exactly what a
            // user does in a backgrounded tab.
            //
            // `authedFetch` below refreshes ONCE on a 401 and retries. It deliberately
            // does NOT pre-check expiry: this page cannot know what the app already
            // refreshed a second ago, and a 401 is the only authority on whether the
            // token this page holds still works. Reacting to the real answer beats
            // predicting it from a clock this page does not own.
            let bearer = token;

            async function refreshAccessToken() {
                const refreshToken = localStorage.getItem( 'lupin_refresh_token' );
                if ( !refreshToken ) return false;
                try {
                    const resp = await fetch( '/auth/refresh', {
                        method  : 'POST',
                        headers : { 'Content-Type': 'application/json' },
                        body    : JSON.stringify( { refresh_token: refreshToken } )
                    } );
                    if ( !resp.ok ) return false;
                    const data = await resp.json();
                    // Same storage keys the app uses — the two must never diverge, or a
                    // refresh here would be invisible to the app and vice versa.
                    localStorage.setItem( 'lupin_access_token',  data.tokens.access_token  );
                    localStorage.setItem( 'lupin_refresh_token', data.tokens.refresh_token );
                    bearer = data.tokens.access_token;
                    return true;
                } catch ( e ) {
                    return false;
                }
            }

            async function authedFetch( url, init ) {
                const withAuth = ( t ) => {
                    const merged = Object.assign( {}, init || {} );
                    merged.headers = Object.assign( {}, ( init && init.headers ) || {} );
                    if ( t ) merged.headers.Authorization = 'Bearer ' + t;
                    return merged;
                };
                let resp = await fetch( url, withAuth( bearer ) );
                if ( resp.status !== 401 ) return resp;
                // ONE retry. A second 401 after a successful refresh is a real auth
                // failure, not a stale token, and looping would only delay saying so.
                if ( !( await refreshAccessToken() ) ) return resp;
                return await fetch( url, withAuth( bearer ) );
            }

            // File size via HEAD (auth'd; best-effort).
            let fileSizeStr = 'Unknown';
            if ( !embed ) try {
                const head = await authedFetch( audioApiUrl, { method: 'HEAD' } );
                if ( head.ok ) {
                    const bytes = parseInt( head.headers.get( 'content-length' ) || '0' );
                    if ( bytes > 0 ) fileSizeStr = ( bytes / ( 1024 * 1024 ) ).toFixed( 1 ) + ' MB';
                }
            } catch ( e ) { /* ignore */ }

            // A link is drawn only when its file answers; a missing file is left out, never shown broken.
            // The script and an io/ original are read with the user's token; any other original opens in the doc viewer.
            const ioUrl = ( rel ) => '/api/io/file?path=' + encodeURIComponent( rel );
            async function answers( url, method ) {
                try {
                    const resp = await authedFetch( url, { method: method } );
                    return resp.ok;
                } catch ( e ) {
                    return false;
                }
            }

            let linksHtml = '';
            if ( !embed ) {
                const sourceInIo  = sourcePath && sourcePath.startsWith( 'io/' );
                const scriptReady = scriptPath ? await answers( ioUrl( scriptPath ), 'HEAD' ) : false;
                let sourceReady   = false;
                if ( sourcePath ) {
                    sourceReady = sourceInIo
                        ? await answers( ioUrl( sourcePath.slice( 3 ) ), 'HEAD' )
                        : await answers( '/api/docs/file?path=' + encodeURIComponent( sourcePath ), 'GET' );
                }
                const pieces = [];
                if ( scriptReady ) pieces.push( '<a id="audio-player-script-link" data-testid="audio-player-script-link">&#128221; Script</a>' );
                if ( sourceReady && sourceInIo ) {
                    pieces.push( '<a id="audio-player-source-link" data-testid="audio-player-source-link">&#128196; Original document</a>' );
                } else if ( sourceReady ) {
                    pieces.push( '<a id="audio-player-source-link" data-testid="audio-player-source-link" target="_blank" rel="noopener" href="/app/docs?path='
                                 + encodeURIComponent( sourcePath ).replace( /%2F/g, '/' ) + '">&#128196; Original document</a>' );
                }
                if ( pieces.length ) linksHtml = '<div class="audio-player-links">' + pieces.join( '' ) + '</div>';
            }

            // Render WITHOUT an <audio src> / download href — those are set to the
            // blob object URL below, once the auth'd bytes are in hand.
            // Mini face (embed=1): the native player only. Full face: title, player, download, links, details.
            target.className = 'audio-player-content';
            target.innerHTML = embed ? `
                <audio class="audio-player-element" controls preload="metadata">
                    Your browser does not support the audio element.
                </audio>` : `
                <h1 class="audio-player-title" data-testid="audio-player-title">${escapeHtml( displayTitle )}</h1>
                <audio class="audio-player-element" controls preload="metadata">
                    Your browser does not support the audio element.
                </audio>
                <div class="audio-player-actions">
                    <a download="${escapeHtml( filename )}" class="audio-player-download">
                        &#128229; Download MP3
                    </a>
                </div>
                ${linksHtml}
                <details class="audio-player-details">
                    <summary>File Details</summary>
                    <dl>
                        <dt>Filename</dt><dd>${escapeHtml( filename )}</dd>
                        <dt>Path</dt><dd>${escapeHtml( path )}</dd>
                        <dt>Size</dt><dd>${fileSizeStr}</dd>
                        <dt id="buffer-timing-dt" hidden>Buffer</dt><dd id="buffer-timing-dd" hidden></dd>
                    </dl>
                </details>`;

            // Open a text file in a new tab, rendered as markdown. The window opens inside the click so
            // the popup blocker allows it; the text arrives afterwards.
            function openTextInNewTab( rel, label ) {
                const win = window.open( '', '_blank' );
                ( async () => {
                    let html;
                    try {
                        const resp = await authedFetch( ioUrl( rel ), {} );
                        if ( !resp.ok ) throw new Error( 'HTTP ' + resp.status );
                        const text = await resp.text();
                        html = DOMPurify.sanitize( marked.parse( text, { gfm: true, breaks: true } ) );
                    } catch ( err ) {
                        html = '<p>Could not load ' + escapeHtml( label ) + ': ' + escapeHtml( err.message ) + '</p>';
                    }
                    if ( !win ) return;
                    win.document.title = displayTitle + ' — ' + label;
                    win.document.body.innerHTML = '<div style="max-width:860px;margin:32px auto;padding:0 24px;font:16px/1.6 system-ui,sans-serif">' + html + '</div>';
                } )();
            }
            const scriptLinkEl = target.querySelector( '#audio-player-script-link' );
            if ( scriptLinkEl ) scriptLinkEl.addEventListener( 'click', () => openTextInNewTab( scriptPath, 'Script' ) );
            const sourceLinkEl = target.querySelector( '#audio-player-source-link' );
            if ( sourceLinkEl && !sourceLinkEl.getAttribute( 'href' ) ) {
                sourceLinkEl.addEventListener( 'click', () => openTextInNewTab( sourcePath.slice( 3 ), 'Original document' ) );
            }

            const audioEl    = target.querySelector( 'audio.audio-player-element' );
            const downloadEl = target.querySelector( 'a.audio-player-download' );   // absent in the mini face

            // Blob-fetch the mp3 WITH the header. This buffers the WHOLE file before
            // playback can start; the elapsed fetch→blob time is the delay Mr Radio
            // wants measured — logged as "[PLAYER-BLOB] ..." and shown in File Details.
            try {
                const t0   = performance.now();
                const resp = await authedFetch( audioApiUrl, {} );
                if ( !resp.ok ) {
                    throw new Error( 'HTTP ' + resp.status + ( resp.status === 401 ? ' (auth — missing/expired token)' : '' ) );
                }
                const blob      = await resp.blob();
                const bufferMs  = performance.now() - t0;
                const objectUrl = URL.createObjectURL( blob );
                audioEl.src     = objectUrl;
                if ( downloadEl ) downloadEl.href = objectUrl;
                // Release the blob when the page / overlay iframe is torn down.
                window.addEventListener( 'pagehide', () => URL.revokeObjectURL( objectUrl ), { once: true } );

                const secs = ( bufferMs / 1000 ).toFixed( 2 );
                const mb   = ( blob.size / ( 1024 * 1024 ) ).toFixed( 1 );
                console.log( `[PLAYER-BLOB] buffered ${blob.size} bytes (${mb} MB) in ${bufferMs.toFixed( 0 )} ms (${secs}s) before playback` );
                const dtEl = document.getElementById( 'buffer-timing-dt' );
                const ddEl = document.getElementById( 'buffer-timing-dd' );
                if ( dtEl && ddEl ) { dtEl.hidden = false; ddEl.hidden = false; ddEl.textContent = `${secs}s to buffer ${mb} MB`; }
            } catch ( err ) {
                target.className = 'audio-player-error';
                target.textContent = 'Could not load audio: ' + err.message;
                console.log( '[PLAYER-BLOB] ERROR ' + err.message );
                return;
            }

            // autoplay=1 — REAL auto-start on open: a user click (the "Play Here"
            //   link) opened this frame, so the browser permits play() — the safe
            //   half of the autoplay policy. No UI; controls stay for pause/dismiss.
            // probe=1 — same play() PLUS a visible fired/blocked diagnostic div +
            //   console line ("[AUTOPLAY-PROBE] ..."). DEBUG-ONLY, must NEVER ship:
            //   a red AUTOPLAY_BLOCKED box on stage is its own demo failure
            //   (Mr Radio ruling 2026-08-03). Gate the probe UI behind ?probe=1 so
            //   ?autoplay=1 is safe to wire onto the overlay src.
            if ( autoplay || probe ) {
                let mark = () => {};
                if ( probe ) {
                    const resultEl = document.createElement( 'div' );
                    resultEl.id = 'autoplay-result';
                    resultEl.style.cssText = 'margin:16px 0;padding:12px;border-radius:6px;font-size:14px;font-family:monospace;';
                    target.appendChild( resultEl );
                    mark = ( ok, detail ) => {
                        const tag = ok ? 'AUTOPLAY_FIRED' : 'AUTOPLAY_BLOCKED';
                        resultEl.textContent = tag + ': ' + detail;
                        resultEl.style.background = ok ? '#dcfce7' : '#fee2e2';
                        resultEl.style.color      = ok ? '#166534' : '#991b1b';
                        console.log( '[AUTOPLAY-PROBE] ' + tag + ' ' + detail );
                    };
                }
                try {
                    const p = audioEl.play();
                    if ( p !== undefined ) {
                        p.then( () => mark( true, 'play() resolved; paused=' + audioEl.paused ) )
                         .catch( ( err ) => mark( false, err.name + ': ' + err.message ) );
                    } else {
                        mark( true, 'play() returned undefined (legacy); paused=' + audioEl.paused );
                    }
                } catch ( err ) {
                    mark( false, 'sync throw: ' + err.name + ': ' + err.message );
                }
            }
        } )();
    </script>
</body>
</html>
