<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Background jobs</title>
    <link rel="stylesheet" href="/static/css/lupin-base.css">
    <link rel="stylesheet" href="/static/css/multiplexer/jobs-page.css">
</head>
<body class="jobs-page">
    <!-- Row efe188bf — every background job in ONE accordion (Rick, 2026-11-07). The page computes no
         health: it formats what GET /api/jobs/summary returns. Its one action is Run now. -->
    <main class="jobs-main">
        <header class="jobs-top">
            <h1>Background jobs</h1>
            <p id="jobs-header" class="jobs-header" data-testid="jobs-header" aria-live="polite">Loading…</p>
            <button type="button" id="jobs-refresh" data-testid="jobs-refresh">Refresh</button>
        </header>
        <p id="jobs-error" class="jobs-error" role="alert" data-testid="jobs-error" hidden></p>
        <div id="jobs-accordion" class="jobs-accordion" data-testid="jobs-accordion"></div>
    </main>
    <!-- Manifest-driven cache-bust, the console page's pattern: resolve the content-hashed bundle from
         the manifest (fetched no-store) and fall back to the stable jobs.js on any manifest failure.
         Both are emitted by src/scripts/build-jobs.sh. -->
    <script type="module">
        const DIST_BASE    = "/static/dist/jobs/";
        const MANIFEST_URL = DIST_BASE + "manifest.json";
        try {
            const resp = await fetch( MANIFEST_URL, { cache: "no-store" } );
            if ( !resp.ok ) throw new Error( `manifest HTTP ${ resp.status }` );
            const manifest = await resp.json();
            const bundle   = manifest[ "jobs.js" ];
            if ( !bundle ) throw new Error( "manifest missing 'jobs.js' key" );
            await import( DIST_BASE + bundle );
        } catch ( err ) {
            console.error( "[jobs] manifest-driven boot failed; falling back to stable jobs.js:", err );
            await import( DIST_BASE + "jobs.js" );
        }
    </script>
</body>
</html>
