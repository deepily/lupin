<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Approve a ticket</title>
    <link rel="stylesheet" href="/static/css/lupin-base.css">
</head>
<body>
    <!-- Row a3975cf4 — the safe landing for an approve link the card's click handler did not
         catch (middle-click, link preview, copied URL). OPENING THIS PAGE CHANGES NOTHING: it
         reads the row and shows one Approve button; only pressing the button sends the move. -->
    <main style="max-width: 40rem; margin: 2rem auto; padding: 0 1rem;">
        <h1 id="task-approve-heading">Approve a ticket</h1>
        <p id="task-approve-error" role="alert" data-testid="task-approve-error" hidden></p>
        <section id="task-approve-row" data-testid="task-approve-row" hidden>
            <h2 id="task-approve-title" data-testid="task-approve-title"></h2>
            <p>Status: <strong id="task-approve-status" data-testid="task-approve-status"></strong></p>
            <button type="button" id="task-approve-button" data-testid="task-approve-button">Approve</button>
            <p id="task-approve-result" role="status" data-testid="task-approve-result"></p>
        </section>
        <!-- A batch link (?rows=a,b&move=queued|dropped[&reason=...]): the rows are listed first, one button applies the move to all. -->
        <section id="task-approve-batch" data-testid="task-approve-batch" hidden>
            <ul id="task-approve-batch-list" data-testid="task-approve-batch-list"></ul>
            <button type="button" id="task-approve-batch-button" data-testid="task-approve-batch-button"></button>
            <p id="task-approve-batch-result" role="status" data-testid="task-approve-batch-result" style="white-space: pre-line;"></p>
        </section>
    </main>
    <script>
        ( function () {
            const ROW_ID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
            const rowId     = new URLSearchParams( window.location.search ).get( "row" );
            const errorEl   = document.getElementById( "task-approve-error" );
            const rowEl     = document.getElementById( "task-approve-row" );
            const button    = document.getElementById( "task-approve-button" );
            const resultEl  = document.getElementById( "task-approve-result" );

            function showError( message ) {
                errorEl.textContent = message;
                errorEl.hidden      = false;
            }

            async function refreshToken() {
                const refresh = localStorage.getItem( "lupin_refresh_token" );
                if ( !refresh ) return null;
                const resp = await fetch( "/auth/refresh", {
                    method  : "POST",
                    headers : { "Content-Type": "application/json" },
                    body    : JSON.stringify( { refresh_token: refresh } )
                } );
                if ( !resp.ok ) return null;
                const data = await resp.json();
                localStorage.setItem( "lupin_access_token",  data.tokens.access_token );
                localStorage.setItem( "lupin_refresh_token", data.tokens.refresh_token );
                return data.tokens.access_token;
            }

            async function authedFetch( url, init ) {
                const withAuth = ( token ) => ( {
                    ...init,
                    headers : { ...( init.headers || {} ), ...( token ? { Authorization: "Bearer " + token } : {} ) }
                } );
                let resp = await fetch( url, withAuth( localStorage.getItem( "lupin_access_token" ) ) );
                if ( resp.status === 401 ) {
                    const fresh = await refreshToken();
                    if ( fresh ) resp = await fetch( url, withAuth( fresh ) );
                }
                return resp;
            }

            async function failureText( resp ) {
                try {
                    const body = await resp.json();
                    if ( body && body.detail ) return typeof body.detail === "string" ? body.detail : JSON.stringify( body.detail );
                } catch ( e ) { /* non-JSON body: the status alone is the message */ }
                return String( resp.status );
            }

            function batchParse() {
                const params = new URLSearchParams( window.location.search );
                const list   = params.get( "rows" );
                const move   = params.get( "move" );
                const reason = ( params.get( "reason" ) || "" ).trim();
                const ids    = list ? list.split( "," ) : [];
                if ( ids.length === 0 || ids.some( ( id ) => !ROW_ID_RE.test( id ) ) || new Set( ids ).size !== ids.length ) return null;
                if ( move !== "queued" && move !== "dropped" ) return null;
                if ( move === "dropped" && reason === "" ) return null;
                return { ids: ids, move: move, reason: move === "dropped" ? reason : null };
            }

            async function loadBatch() {
                const batch = batchParse();
                if ( batch === null ) { showError( "This link does not name a clean list of full ticket ids with a move." ); return; }
                const verb = batch.move === "dropped" ? "Drop" : "Approve";
                document.getElementById( "task-approve-heading" ).textContent = verb + " " + batch.ids.length + " tickets";
                const listEl = document.getElementById( "task-approve-batch-list" );
                const rows   = await Promise.all( batch.ids.map( async ( id ) => {
                    try {
                        const resp = await authedFetch( "/api/tasks/" + encodeURIComponent( id ), { method: "GET" } );
                        return resp.ok ? await resp.json() : null;
                    } catch ( e ) { return null; }
                } ) );
                rows.forEach( ( row, i ) => {
                    const li = document.createElement( "li" );
                    li.textContent = batch.ids[ i ].slice( 0, 8 ) + " · " + ( row === null ? "could not be read" : row.status + " · " + row.title );
                    listEl.appendChild( li );
                } );
                const batchButton = document.getElementById( "task-approve-batch-button" );
                batchButton.textContent = verb + " all " + batch.ids.length;
                batchButton.addEventListener( "click", async function () {
                    batchButton.disabled = true;
                    const lines = await Promise.all( batch.ids.map( async ( id ) => {
                        const body = { to_status: batch.move, actor: "operator approve-landing-page", authority: "user_direct" };
                        if ( batch.reason !== null ) body.reason = batch.reason;
                        // A network failure on one row is that row's line alone: it must not reject the Promise.all and hide the rest.
                        try {
                            const resp = await authedFetch( "/api/tasks/" + encodeURIComponent( id ) + "/transition", {
                                method  : "POST",
                                headers : { "Content-Type": "application/json" },
                                body    : JSON.stringify( body )
                            } );
                            const ok = resp.ok && resp.status !== 202;
                            return id.slice( 0, 8 ) + " " + ( ok ? "applied ✅" : "refused: " + ( resp.status === 202 ? "waiting on Rick — he has not been asked yet" : await failureText( resp ) ) );
                        } catch ( e ) {
                            return id.slice( 0, 8 ) + " refused: unreachable: " + ( e && e.message ? e.message : e );
                        }
                    } ) );
                    const done = lines.filter( ( l ) => l.endsWith( "applied ✅" ) ).length;
                    document.getElementById( "task-approve-batch-result" ).textContent = [ done + " of " + lines.length + " applied" ].concat( lines ).join( "\n" );
                } );
                document.getElementById( "task-approve-batch" ).hidden = false;
            }

            async function load() {
                if ( new URLSearchParams( window.location.search ).has( "rows" ) ) { await loadBatch(); return; }
                if ( !rowId || !ROW_ID_RE.test( rowId ) ) { showError( "This link does not name a full ticket id." ); return; }
                const resp = await authedFetch( "/api/tasks/" + encodeURIComponent( rowId ), { method: "GET" } );
                if ( !resp.ok ) { showError( await failureText( resp ) ); return; }
                const row = await resp.json();
                document.getElementById( "task-approve-title" ).textContent  = row.title;
                document.getElementById( "task-approve-status" ).textContent = row.status;
                button.disabled = row.status !== "not_approved";
                if ( button.disabled ) resultEl.textContent = "Nothing to approve: this ticket is not waiting for approval.";
                rowEl.hidden = false;
            }

            button.addEventListener( "click", async function () {
                button.disabled = true;
                const resp = await authedFetch( "/api/tasks/" + encodeURIComponent( rowId ) + "/transition", {
                    method  : "POST",
                    headers : { "Content-Type": "application/json" },
                    body    : JSON.stringify( { to_status: "queued", actor: "operator approve-landing-page", authority: "user_direct" } )
                } );
                resultEl.textContent = resp.status === 202
                    ? "Waiting on Rick — he has not been asked yet."
                    : resp.ok ? "approved ✅" : await failureText( resp );
            } );

            load();
        } )();
    </script>
</body>
</html>
