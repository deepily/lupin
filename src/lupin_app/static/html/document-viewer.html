<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Viewer — Lupin</title>

    <link rel="stylesheet" href="/static/css/lupin-base.css">
    <link rel="stylesheet" href="/static/css/lupin-nav.css">
    <style>
        .doc-viewer-container {
            max-width: 860px;
            margin: 32px auto;
            padding: 0 24px 48px;
        }

        .doc-viewer-loading {
            text-align: center;
            padding: 64px 0;
            color: #6b7280;
            font-size: 15px;
        }

        .doc-viewer-error {
            text-align: center;
            padding: 64px 0;
            color: #dc2626;
            font-size: 15px;
        }

        /* Markdown typography */
        .doc-viewer-content h1 { font-size: 28px; font-weight: 700; margin: 32px 0 16px; color: #111827; border-bottom: 1px solid #e5e7eb; padding-bottom: 8px; }
        .doc-viewer-content h2 { font-size: 22px; font-weight: 600; margin: 28px 0 12px; color: #1f2937; border-bottom: 1px solid #f3f4f6; padding-bottom: 6px; }
        .doc-viewer-content h3 { font-size: 18px; font-weight: 600; margin: 24px 0 10px; color: #374151; }
        .doc-viewer-content h4 { font-size: 15px; font-weight: 600; margin: 20px 0 8px; color: #4b5563; }
        .doc-viewer-content p  { margin: 12px 0; line-height: 1.7; color: #374151; }
        .doc-viewer-content ul,
        .doc-viewer-content ol { margin: 12px 0; padding-left: 28px; line-height: 1.7; color: #374151; }
        .doc-viewer-content li { margin: 4px 0; }
        .doc-viewer-content a  { color: #4f46e5; text-decoration: none; }
        .doc-viewer-content a:hover { text-decoration: underline; }

        .doc-viewer-content blockquote {
            margin: 16px 0;
            padding: 12px 20px;
            border-left: 4px solid #6366f1;
            background: #f5f3ff;
            color: #4b5563;
        }
        .doc-viewer-content blockquote p { margin: 4px 0; }

        .doc-viewer-content code {
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 13px;
            background: #f3f4f6;
            padding: 2px 6px;
            border-radius: 4px;
            color: #1f2937;
        }

        .doc-viewer-content pre {
            margin: 16px 0;
            padding: 16px;
            background: #1e1e2e;
            color: #cdd6f4;
            border-radius: 8px;
            overflow-x: auto;
            line-height: 1.5;
        }
        .doc-viewer-content pre code {
            background: none;
            padding: 0;
            border-radius: 0;
            color: inherit;
            font-size: 13px;
        }

        .doc-viewer-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 16px 0;
            font-size: 14px;
        }
        .doc-viewer-content th {
            background: #f9fafb;
            font-weight: 600;
            text-align: left;
            padding: 10px 14px;
            border: 1px solid #e5e7eb;
            color: #374151;
        }
        .doc-viewer-content td {
            padding: 10px 14px;
            border: 1px solid #e5e7eb;
            color: #4b5563;
        }

        .doc-viewer-content hr {
            border: none;
            border-top: 1px solid #e5e7eb;
            margin: 24px 0;
        }

        .doc-viewer-content img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 12px 0;
        }

        .doc-frontmatter {
            margin: 0 0 24px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            overflow: hidden;
        }
        .doc-frontmatter summary {
            padding: 10px 16px;
            font-size: 13px;
            font-weight: 600;
            color: #6b7280;
            background: #f9fafb;
            cursor: pointer;
            user-select: none;
        }
        .doc-frontmatter summary:hover { background: #f3f4f6; }
        .doc-frontmatter dl {
            display: grid;
            grid-template-columns: max-content 1fr;
            gap: 4px 16px;
            padding: 12px 16px;
            margin: 0;
            font-size: 13px;
        }
        .doc-frontmatter dt { font-weight: 600; color: #374151; }
        .doc-frontmatter dd { margin: 0; color: #6b7280; word-break: break-word; }

        /* Directory listing — added 2026-05-12 per
           src/rnd/v0.1.7/2026.05.12-doc-viewer-directory-listing.md */
        .doc-dir-breadcrumb {
            margin: 16px 0 24px;
            font-size: 14px;
            color: #6b7280;
        }
        .doc-dir-breadcrumb a {
            color: #4f46e5;
            text-decoration: none;
        }
        .doc-dir-breadcrumb a:hover { text-decoration: underline; }
        .doc-dir-breadcrumb .sep {
            margin: 0 6px;
            color: #d1d5db;
        }
        .doc-dir-breadcrumb .current {
            color: #1f2937;
            font-weight: 600;
        }
        .doc-dir-listing {
            list-style: none;
            margin: 0;
            padding: 0;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            overflow: hidden;
        }
        .doc-dir-entry {
            display: flex;
            align-items: center;
            padding: 3.1640625px 16px;
            border-bottom: 1px solid #f3f4f6;
            transition: background 0.1s ease;
        }
        .doc-dir-entry:last-child { border-bottom: none; }
        .doc-dir-entry:hover { background: #f9fafb; }
        .doc-dir-entry a {
            display: flex;
            align-items: center;
            flex: 1;
            color: #1f2937;
            text-decoration: none;
        }
        .doc-dir-entry a:hover { color: #4f46e5; }
        .doc-dir-icon {
            margin-right: 12px;
            font-size: 16px;
            width: 20px;
            text-align: center;
        }
        .doc-dir-name {
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 13px;
        }
        .doc-dir-meta {
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 12px;
            color: #6b7280;
            margin-left: 16px;
        }
        .doc-dir-empty {
            padding: 32px 16px;
            text-align: center;
            color: #9ca3af;
            font-style: italic;
        }

        /* Plain-text/code rendering — added 2026-05-12 per
           src/rnd/v0.1.7/2026.05.12-multi-repo-doc-viewer.md §3g */
        .doc-code-content {
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 13px;
            background: #1e1e2e;
            color: #cdd6f4;
            border-radius: 8px;
            padding: 16px;
            overflow-x: auto;
            white-space: pre;
            line-height: 1.5;
            margin: 16px 0;
            tab-size: 4;
        }
    </style>
</head>
<body>
    <div class="doc-viewer-container">
        <div id="doc-viewer-target" class="doc-viewer-loading">Loading document...</div>
    </div>

    <script src="/static/js/lupin-nav.js" defer></script>
    <script src="/static/js/vendor/marked.min.js"></script>
    <script src="/static/js/vendor/purify.min.js"></script>
    <!--
        Path-prefix dispatch.

        ⚠️  DO NOT HAND-MAINTAIN A LIST OF PROJECTS HERE. There is no
        KNOWN_PROJECTS constant, and reintroducing one is a REGRESSION, not a
        fix. The registered-scope set is DERIVED AT RUNTIME from
        GET /api/docs/scopes (see below).

        This comment used to say "keep KNOWN_PROJECTS in sync with the
        `external repos` key in src/conf/lupin-app.ini and the unified scope
        registry" — i.e. it instructed the maintainer to hand-mirror a runtime
        registry in a frontend literal. That practice IS bug 3d41fcba: the
        mirror drifted in BOTH directions (it listed `cosa-voice`, which was not
        registered, and omitted `skills-distillation`, which was), so a
        newly-registered repo silently fell through to the legacy IO branch and
        404'd while the backend served it correctly. Rick could not read a doc
        for ~40 minutes because of a stale JavaScript Set.

        Enforcement: src/tests/e2e_ui/test_doc_viewer_scope_discovery.py drives a
        real browser and asserts the page calls /api/docs/scopes and routes to
        /api/docs/file. If you add a literal back, that suite goes RED. The test
        is not stale — the literal is wrong.

        Per the 2026-05-15 unification (Q-R2), the `?scope=` query param is
        RETIRED on the server side; the first segment of `path` is the routing
        key. Legacy bare io-relative URLs emitted by notifications.js
        renderReportLinkSection and persisted in old job metadata still resolve
        via the legacy-fallback branch below.
    -->
    <script>
        ( async function() {
            const target = document.getElementById( 'doc-viewer-target' );
            const params = new URLSearchParams( window.location.search );
            const rawPath = params.get( 'path' ) ?? '';

            // Missing-path early-fail (preserves the prior UX message for
            // bare /app/docs visits with no query string at all).
            if ( params.get( 'path' ) === null ) {
                target.className   = 'doc-viewer-error';
                target.textContent = 'No document path specified. Use ?path=<project>/<file>';
                return;
            }

            // JWT auth — every /api/docs/* + /api/io/file request requires an
            // Authorization: Bearer header per multi-repo-doc-viewer §3f.
            // Canonical localStorage key is `lupin_access_token` (auth.js, lupin-nav.js).
            const token   = localStorage.getItem( 'lupin_access_token' );
            const headers = token ? { 'Authorization': 'Bearer ' + token } : {};

            // ── REFRESH-AND-RETRY (bug 38943485, defect 2 — same shape as the audio
            // player, found here by the guard written for that fix on its first run).
            //
            // This page is STANDALONE: it is not the notifications app and has no access
            // to that app's authedFetch/ensureValidToken. It read the JWT from
            // localStorage and fired bare — so an expired token turned every doc link in
            // the fleet into a dead end with no retry.
            //
            // That matters more here than on the audio player: doc-viewer links are what
            // every session emits in abstracts, and they are clicked long after they are
            // sent, which is exactly when a token has had time to age out.
            //
            // Refreshes ONCE on a 401 and retries. No expiry pre-check — a 401 is the only
            // authority on whether the token this page holds still works.
            let bearer = token;

            async function refreshAccessToken() {
                const refreshToken = localStorage.getItem( 'lupin_refresh_token' );
                if ( !refreshToken ) return false;
                try {
                    const resp = await fetch( '/auth/refresh', {
                        method  : 'POST',
                        headers : { 'Content-Type': 'application/json' },
                        body    : JSON.stringify( { refresh_token: refreshToken } )
                    } );
                    if ( !resp.ok ) return false;
                    const data = await resp.json();
                    // Same storage keys the app uses — the two must never diverge.
                    localStorage.setItem( 'lupin_access_token',  data.tokens.access_token  );
                    localStorage.setItem( 'lupin_refresh_token', data.tokens.refresh_token );
                    bearer = data.tokens.access_token;
                    return true;
                } catch ( e ) {
                    return false;
                }
            }

            async function authedFetch( url, init ) {
                const withAuth = ( t ) => {
                    const merged = Object.assign( {}, init || {} );
                    merged.headers = Object.assign( {}, ( init && init.headers ) || {} );
                    if ( t ) merged.headers[ 'Authorization' ] = 'Bearer ' + t;
                    return merged;
                };
                let resp = await fetch( url, withAuth( bearer ) );
                if ( resp.status !== 401 ) return resp;
                if ( !( await refreshAccessToken() ) ) return resp;
                return await fetch( url, withAuth( bearer ) );
            }

            // First-segment routing per 2026-05-15 unification. See _scope_registry.py.
            //
            // Bug 3d41fcba (2026-07-13): this was a HARDCODED literal set. Every repo
            // registered after the literal was last hand-edited fell through to the
            // legacy IO branch and 404'd — the backend resolved the file correctly and
            // the browser never even asked it. `skills-distillation` was invisible for
            // exactly that reason, and the trap re-arms for repo #11, #12, #13...
            //
            // GET /api/docs/scopes exists for this — its own docstring calls it "runtime
            // scope discovery". Derive the set from the LIVE registry so registering a
            // repo is sufficient to make it viewable. No literal to forget.
            let knownProjects = new Set();
            try {
                const scopesResp = await authedFetch( '/api/docs/scopes', {} );
                if ( scopesResp.ok ) {
                    const scopesData = await scopesResp.json();
                    knownProjects = new Set( ( scopesData.scopes ?? [] ).map( s => s.name ) );
                }
            } catch ( e ) {
                // Registry unreachable → proceed with an empty set, which routes unknown
                // first-segments to the legacy IO endpoint exactly as before. Degraded to
                // the old behavior, never worse than it.
            }

            const firstSeg = rawPath.split( '/' )[ 0 ];

            let apiPath, fetchPath;
            if ( firstSeg === 'io' ) {
                // New form: ?path=io/<rel> → /api/io/file?path=<rel>
                apiPath   = '/api/io/file';
                fetchPath = rawPath.slice( 3 );
            } else if ( knownProjects.has( firstSeg ) ) {
                // New form: ?path=<project>/<rel> → /api/docs/file?path=<full>
                apiPath   = '/api/docs/file';
                fetchPath = rawPath;
            } else {
                // Legacy bare io-relative path (pre-unification notification
                // URLs, persisted job artifacts). Route to IO endpoint as-is.
                apiPath   = '/api/io/file';
                fetchPath = rawPath;
            }

            // Set page title from filename
            const filename = rawPath.split( '/' ).pop();
            if ( filename ) document.title = filename + ' — Lupin';

            const fetchUrl = apiPath + '?path=' + encodeURIComponent( fetchPath );

            try {
                const response = await authedFetch( fetchUrl, {} );

                // 401 → redirect to login, preserving the current URL as the
                // post-login return target. Skip the redirect when there's no
                // current_url to bounce back to (defensive).
                if ( response.status === 401 ) {
                    const here = window.location.pathname + window.location.search;
                    window.location.href = '/app/login?next=' + encodeURIComponent( here );
                    return;
                }

                if ( !response.ok ) {
                    throw new Error( 'Failed to load document (HTTP ' + response.status + ')' );
                }

                // Polymorphic dispatch by Content-Type:
                // - application/json → directory listing (renderDirectoryListing)
                // - image/* → <img> tag from blob URL (added 2026-05-21 for PNG/JPG/SVG/etc.)
                // - text/markdown* → markdown rendering (existing path below)
                // - text/* (everything else) → plain <pre> code rendering
                const contentType = response.headers.get( 'content-type' ) || '';
                if ( contentType.includes( 'application/json' ) ) {
                    const listing = await response.json();
                    renderDirectoryListing( listing, target );
                    return;
                }
                if ( contentType.startsWith( 'image/' ) ) {
                    // Build blob URL from already-authenticated response so the
                    // <img> tag's secondary fetch doesn't need the Bearer header.
                    const blob      = await response.blob();
                    const objectURL = URL.createObjectURL( blob );
                    target.className = 'doc-viewer-content doc-viewer-image';
                    target.innerHTML = '';
                    const img = document.createElement( 'img' );
                    img.src        = objectURL;
                    img.alt        = filename || rawPath || '';
                    img.style.maxWidth = '100%';
                    img.style.height   = 'auto';
                    target.appendChild( img );
                    return;
                }
                if ( contentType.startsWith( 'text/' ) && !contentType.startsWith( 'text/markdown' ) ) {
                    const code = await response.text();
                    renderPlainText( code, target );
                    return;
                }

                const rawMarkdown = await response.text();

                // Honor a self-refresh directive if the document carries one.
                // Deliberately BEFORE rendering: a live dashboard that fails to
                // render should still retry on its own schedule rather than sit
                // stale until somebody notices it stopped moving.
                scheduleAutoRefresh( rawMarkdown );

                // Strip the directive before rendering rather than relying on
                // the sanitizer to drop the comment node. The timer is already
                // scheduled from the raw text above, so removing it here cannot
                // affect behavior — it only guarantees the marker can never
                // surface as visible text, whatever DOMPurify does with
                // comments.
                const markdown = rawMarkdown.replace( AUTOREFRESH_DIRECTIVE, '' );

                // Configure marked (mirrors notifications.js renderMarkdown config)
                marked.setOptions( {
                    gfm       : true,
                    breaks    : true,
                    headerIds : false,
                    mangle    : false
                } );

                // Extract YAML frontmatter before parsing markdown
                function extractFrontmatter( text ) {
                    const match = text.match( /^---\n([\s\S]*?)\n---\n?/ );
                    if ( !match ) return { frontmatter: null, body: text };
                    return { frontmatter: match[ 1 ], body: text.slice( match[ 0 ].length ) };
                }

                const { frontmatter, body } = extractFrontmatter( markdown );

                let frontmatterHtml = '';
                if ( frontmatter ) {
                    const lines = frontmatter.split( '\n' )
                        .filter( l => l.includes( ':' ) )
                        .map( l => {
                            const idx = l.indexOf( ':' );
                            const key = l.slice( 0, idx ).trim();
                            const val = DOMPurify.sanitize( l.slice( idx + 1 ).trim().replace( /^['"]|['"]$/g, '' ) );
                            return `<dt>${DOMPurify.sanitize( key )}</dt><dd>${val}</dd>`;
                        } ).join( '' );

                    frontmatterHtml = `
                        <details class="doc-frontmatter">
                            <summary>Document Metadata</summary>
                            <dl>${lines}</dl>
                        </details>`;
                }

                const rawHtml      = marked.parse( body );
                const sanitizedHtml = DOMPurify.sanitize( rawHtml, {
                    ALLOWED_TAGS : [
                        'p', 'br', 'strong', 'b', 'em', 'i', 'u', 's', 'del',
                        'ul', 'ol', 'li',
                        'h1', 'h2', 'h3', 'h4', 'h5', 'h6',
                        'a', 'code', 'pre', 'blockquote',
                        'table', 'thead', 'tbody', 'tr', 'th', 'td',
                        'hr', 'img', 'div', 'span', 'sup', 'sub'
                    ],
                    ALLOWED_ATTR : [ 'href', 'target', 'rel', 'title', 'src', 'alt', 'class' ],
                    ADD_ATTR     : [ 'target', 'rel' ]
                } );

                target.className = 'doc-viewer-content';
                target.innerHTML = frontmatterHtml + sanitizedHtml;

                // Rewrite absolute localhost URLs to host-relative so the page
                // stays usable when accessed from a remote host (the user's
                // browser resolves "localhost" to their own machine, NOT the
                // Lupin server). 2026-05-21 — surfaced via the master-detail
                // Reading Pane iframe; affects any environment where the dev
                // server is on a non-localhost host. See
                // src/rnd/v0.1.7/2026.05.21-master-detail-two-pane-layout-experiment.md.
                target.querySelectorAll( 'a[href]' ).forEach( ( a ) => {
                    const href = a.getAttribute( 'href' );
                    if ( href && /^https?:\/\/(localhost|127\.0\.0\.1|0\.0\.0\.0)(:\d+)?\//.test( href ) ) {
                        const rewritten = href.replace( /^https?:\/\/(localhost|127\.0\.0\.1|0\.0\.0\.0)(:\d+)?/, '' );
                        a.setAttribute( 'href', rewritten );
                    }
                } );

            } catch ( err ) {
                target.className = 'doc-viewer-error';
                target.textContent = err.message;
            }
        } )();

        // Directory-listing renderer — added 2026-05-12 per
        // src/rnd/v0.1.7/2026.05.12-doc-viewer-directory-listing.md
        // Updated 2026-05-16 for path-prefix routing per 2026-05-15 unification.
        function renderDirectoryListing( listing, target ) {
            const scope = listing.scope || 'lupin';
            const segments = listing.path ? listing.path.split( '/' ) : [];

            // Page title
            const last = segments.length > 0 ? segments[ segments.length - 1 ] : ( scope === 'io' ? 'Lupin IO' : 'Lupin Docs' );
            document.title = last + ' — Lupin';

            // Helper: build a /app/docs URL for a scope-relative path. Under
            // unified path-prefix routing the project name is the first
            // segment of `path`; legacy `?scope=` is retired (Q-R2).
            function viewerUrl( rel ) {
                const composed = rel ? scope + '/' + rel : scope + '/';
                return '/app/docs?path=' + encodeURIComponent( composed );
            }

            // Breadcrumb
            let breadcrumbHtml = '<div class="doc-dir-breadcrumb">';
            const rootLabel = scope === 'io' ? 'IO' : ( scope.charAt( 0 ).toUpperCase() + scope.slice( 1 ) );
            if ( segments.length > 0 ) {
                let accumulated = '';
                const parts = [ '<a href="' + viewerUrl( '' ) + '">' + rootLabel + '</a>' ];
                for ( let i = 0; i < segments.length; i++ ) {
                    accumulated = accumulated ? accumulated + '/' + segments[ i ] : segments[ i ];
                    if ( i < segments.length - 1 ) {
                        parts.push( '<a href="' + viewerUrl( accumulated ) + '">' + segments[ i ] + '</a>' );
                    } else {
                        parts.push( '<span class="current">' + segments[ i ] + '</span>' );
                    }
                }
                breadcrumbHtml += parts.join( ' <span class="sep">›</span> ' );
            } else {
                breadcrumbHtml += '<span class="current">' + rootLabel + '</span>';
            }
            breadcrumbHtml += '</div>';

            // Entry icon — purely cosmetic, derived from kind + extension
            function iconFor( entry ) {
                if ( entry.kind === 'directory' ) return '📁';
                const dotIdx = entry.name.lastIndexOf( '.' );
                const ext = dotIdx >= 0 ? entry.name.slice( dotIdx ).toLowerCase() : '';
                if ( ext === '.mp3' || ext === '.wav' ) return '🔊';
                if ( ext === '.pdf' ) return '📑';
                if ( ext === '.pptx' ) return '📊';
                // Source-code hints — added 2026-05-12 per multi-repo doc viewer
                if ( ext === '.py' ) return '🐍';
                if ( ext === '.js' || ext === '.jsx' || ext === '.ts' || ext === '.tsx' ) return '📜';
                if ( ext === '.css' || ext === '.html' ) return '🎨';
                if ( ext === '.sh' ) return '💻';
                if ( ext === '.sql' ) return '🗄️';
                if ( ext === '.json' || ext === '.yaml' || ext === '.yml' || ext === '.toml' ) return '⚙️';
                if ( ext === '.ini' || ext === '.cfg' || ext === '.xml' ) return '⚙️';
                return '📄';
            }

            function formatSize( bytes ) {
                if ( bytes === null || bytes === undefined ) return '';
                if ( bytes < 1024 ) return bytes + ' B';
                if ( bytes < 1024 * 1024 ) return ( bytes / 1024 ).toFixed( 1 ) + ' KB';
                if ( bytes < 1024 * 1024 * 1024 ) return ( bytes / ( 1024 * 1024 ) ).toFixed( 1 ) + ' MB';
                return ( bytes / ( 1024 * 1024 * 1024 ) ).toFixed( 1 ) + ' GB';
            }

            let entriesHtml = '<ul class="doc-dir-listing">';
            if ( !listing.entries || listing.entries.length === 0 ) {
                entriesHtml += '<li class="doc-dir-empty">(empty directory)</li>';
            } else {
                for ( const entry of listing.entries ) {
                    entriesHtml += '<li class="doc-dir-entry">';
                    entriesHtml += '<a href="' + entry.view_url + '">';
                    entriesHtml += '<span class="doc-dir-icon">' + iconFor( entry ) + '</span>';
                    entriesHtml += '<span class="doc-dir-name">' + entry.name + '</span>';
                    entriesHtml += '</a>';
                    if ( entry.size !== null && entry.size !== undefined ) {
                        entriesHtml += '<span class="doc-dir-meta">' + formatSize( entry.size ) + '</span>';
                    }
                    entriesHtml += '</li>';
                }
            }
            entriesHtml += '</ul>';

            const sanitized = DOMPurify.sanitize( breadcrumbHtml + entriesHtml, {
                ALLOWED_TAGS : [ 'div', 'span', 'a', 'ul', 'li' ],
                ALLOWED_ATTR : [ 'href', 'class' ]
            } );

            target.className = 'doc-viewer-content';
            target.innerHTML = sanitized;
        }

        // Plain-text/source-code renderer — added 2026-05-12 per
        // src/rnd/v0.1.7/2026.05.12-multi-repo-doc-viewer.md §3g.
        // Uses textContent to defang HTML/script content entirely; no innerHTML.
        function renderPlainText( code, target ) {
            target.className = '';
            target.innerHTML = '';
            const pre = document.createElement( 'pre' );
            pre.className   = 'doc-code-content';
            pre.textContent = code;
            target.appendChild( pre );
        }

        // Minimum lead time before a scheduled reload. Guards the case where
        // the page loads a few milliseconds BEFORE its own boundary: without
        // it, the computed delay is ~0 (or negative) and the page reloads
        // immediately, then again, in a tight loop.
        const AUTOREFRESH_MIN_LEAD_MS = 5000;

        // The opt-in marker. Defined once and used twice — to read the cadence,
        // and to strip the marker before render — so the two can never drift
        // into disagreeing about what a directive looks like.
        const AUTOREFRESH_DIRECTIVE = /<!--\s*doc-viewer:autorefresh\s+period=(\d+)\s+offset=(\d+)\s*-->/;

        // Self-refreshing documents — added 2026-08-19 for the Epic Board,
        // which cron regenerates every 10 minutes and which is meant to be left
        // open on a second screen.
        //
        // A document opts in by carrying an HTML comment naming its cadence:
        //     <!-- doc-viewer:autorefresh period=10 offset=1 -->
        // The comment is invisible in the rendered page and inert in any reader
        // that does not look for it, so an opted-in document is still just a
        // document.
        //
        // The reload is pinned to WALL-CLOCK boundaries, not to "now + period".
        // Anchoring to load time would drift a little further behind the
        // generator on every cycle and would eventually land mid-write; pinning
        // to the boundary keeps every viewer, however long it has been open, in
        // the same one-minute-behind-the-generator slot. With period=10 and
        // offset=1 that is :01, :11, :21, ...
        //
        // Requires:
        //     - markdown is a string (the raw document text, pre-render)
        // Ensures:
        //     - returns the scheduled delay in ms, or null when the document
        //       carries no directive or the directive is unusable
        //     - schedules at most one reload per call
        //     - never schedules sooner than AUTOREFRESH_MIN_LEAD_MS from now
        function scheduleAutoRefresh( markdown ) {

            const directive = markdown.match( AUTOREFRESH_DIRECTIVE );
            if ( !directive ) return null;

            const periodMin = parseInt( directive[ 1 ], 10 );
            const offsetMin = parseInt( directive[ 2 ], 10 );

            // A zero/absent period would mean "reload continuously". Refuse it
            // rather than honoring a directive that would pin the CPU.
            if ( !Number.isFinite( periodMin ) || periodMin <= 0 ) return null;
            if ( !Number.isFinite( offsetMin ) || offsetMin <  0 ) return null;

            const now  = new Date();
            const next = new Date( now );
            next.setSeconds( 0, 0 );

            // Minutes forward to the next instant where ( minute - offset ) is
            // an exact multiple of period. The doubled modulo is what keeps the
            // result non-negative — JavaScript's % returns the sign of the
            // dividend, so a bare ( offset - minute ) % period goes negative for
            // most of every hour.
            const minutes = next.getMinutes();
            const forward = ( ( ( offsetMin - minutes ) % periodMin ) + periodMin ) % periodMin;
            next.setMinutes( minutes + forward );

            let delayMs = next.getTime() - now.getTime();
            if ( delayMs < AUTOREFRESH_MIN_LEAD_MS ) delayMs += periodMin * 60 * 1000;

            setTimeout( () => window.location.reload(), delayMs );
            return delayMs;
        }
    </script>
</body>
</html>
