<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lupin - Change Password</title>
    <link rel="stylesheet" href="/static/css/lupin-base.css">
    <link rel="stylesheet" href="/static/html/auth/css/auth.css">
    <link rel="stylesheet" href="/static/css/lupin-nav.css">
    <style>
        .password-strength {
            margin-top: 8px;
            height: 4px;
            background-color: #e0e0e0;
            border-radius: 2px;
            overflow: hidden;
        }

        .password-strength-bar {
            height: 100%;
            width: 0%;
            transition: all 0.3s ease;
        }

        .strength-weak {
            width: 33%;
            background-color: #ef4444;
        }

        .strength-medium {
            width: 66%;
            background-color: #f59e0b;
        }

        .strength-strong {
            width: 100%;
            background-color: #10b981;
        }

        .password-requirements {
            font-size: 13px;
            color: #666;
            margin-top: 12px;
        }

        .password-requirements ul {
            list-style: none;
            padding-left: 0;
        }

        .password-requirements li {
            padding: 4px 0;
        }

        .requirement-met {
            color: #10b981;
        }

        .requirement-met::before {
            content: '✓ ';
        }

        .requirement-unmet {
            color: #666;
        }

        .requirement-unmet::before {
            content: '○ ';
        }
    </style>
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-header">
            <div class="lupin-logo">🔑</div>
            <h1>Change Password</h1>
            <p>Update your account password</p>
        </div>

        <div class="error-message" id="error-message"></div>
        <div class="success-message" id="success-message"></div>

        <form class="auth-form" id="password-form">
            <div class="form-group">
                <label for="current-password">Current Password</label>
                <input
                    type="password"
                    id="current-password"
                    name="current-password"
                    placeholder="Enter your current password"
                    required
                    autocomplete="current-password"
                />
            </div>

            <div class="form-group">
                <label for="new-password">New Password</label>
                <input
                    type="password"
                    id="new-password"
                    name="new-password"
                    placeholder="Enter your new password"
                    required
                    autocomplete="new-password"
                />
                <div class="password-strength">
                    <div class="password-strength-bar" id="strength-bar"></div>
                </div>
                <div class="password-requirements">
                    <ul id="requirements-list">
                        <li id="req-length" class="requirement-unmet">At least 8 characters</li>
                        <li id="req-uppercase" class="requirement-unmet">One uppercase letter</li>
                        <li id="req-lowercase" class="requirement-unmet">One lowercase letter</li>
                        <li id="req-number" class="requirement-unmet">One number</li>
                    </ul>
                </div>
            </div>

            <div class="form-group">
                <label for="confirm-password">Confirm New Password</label>
                <input
                    type="password"
                    id="confirm-password"
                    name="confirm-password"
                    placeholder="Re-enter your new password"
                    required
                    autocomplete="new-password"
                />
            </div>

            <button type="submit" class="btn btn-primary" id="submit-button">
                Update Password
            </button>

            <button type="button" class="btn btn-secondary" onclick="window.location.href='/app/auth/profile'">
                Cancel
            </button>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p class="mt-2">Updating password...</p>
        </div>
    </div>

    <script src="/static/js/lupin-nav.js" defer></script>
    <script src="/static/html/auth/js/auth.js"></script>
    <script>
        // Require authentication
        requireAuth();

        // Password strength checker
        function checkPasswordStrength( password ) {
            let score = 0;

            // Check requirements
            const hasLength = password.length >= 8;
            const hasUppercase = /[A-Z]/.test( password );
            const hasLowercase = /[a-z]/.test( password );
            const hasNumber = /[0-9]/.test( password );

            // Update requirement indicators
            document.getElementById( 'req-length' ).className = hasLength ? 'requirement-met' : 'requirement-unmet';
            document.getElementById( 'req-uppercase' ).className = hasUppercase ? 'requirement-met' : 'requirement-unmet';
            document.getElementById( 'req-lowercase' ).className = hasLowercase ? 'requirement-met' : 'requirement-unmet';
            document.getElementById( 'req-number' ).className = hasNumber ? 'requirement-met' : 'requirement-unmet';

            // Calculate score
            if ( hasLength ) score++;
            if ( hasUppercase ) score++;
            if ( hasLowercase ) score++;
            if ( hasNumber ) score++;

            // Update strength bar
            const strengthBar = document.getElementById( 'strength-bar' );
            strengthBar.className = 'password-strength-bar';

            if ( score < 2 ) {
                strengthBar.className += ' strength-weak';
            } else if ( score < 4 ) {
                strengthBar.className += ' strength-medium';
            } else {
                strengthBar.className += ' strength-strong';
            }

            return {
                score: score,
                isValid: score === 4
            };
        }

        // Real-time password strength checking
        document.getElementById( 'new-password' ).addEventListener( 'input', function( e ) {
            checkPasswordStrength( e.target.value );
        } );

        // Handle password change form submission
        document.getElementById( 'password-form' ).addEventListener( 'submit', async function( e ) {
            e.preventDefault();

            const currentPassword = document.getElementById( 'current-password' ).value;
            const newPassword = document.getElementById( 'new-password' ).value;
            const confirmPassword = document.getElementById( 'confirm-password' ).value;

            // Clear previous messages
            hideError( 'error-message' );
            hideSuccess( 'success-message' );

            // Validate inputs
            if ( !currentPassword || !newPassword || !confirmPassword ) {
                showError( 'error-message', 'Please fill in all fields' );
                return;
            }

            // Check if new passwords match
            if ( newPassword !== confirmPassword ) {
                showError( 'error-message', 'New passwords do not match' );
                document.getElementById( 'confirm-password' ).focus();
                return;
            }

            // Check if new password is same as current
            if ( newPassword === currentPassword ) {
                showError( 'error-message', 'New password must be different from current password' );
                return;
            }

            // Validate password strength
            const strength = checkPasswordStrength( newPassword );
            if ( !strength.isValid ) {
                showError( 'error-message', 'Password does not meet requirements. Please check the list below.' );
                return;
            }

            // Show loading
            document.getElementById( 'password-form' ).style.display = 'none';
            showLoading( 'loading' );

            try {
                // Attempt password change
                await changePassword( currentPassword, newPassword );

                // Show success message
                hideLoading( 'loading' );
                showSuccess( 'success-message', '✅ Password updated successfully! You will be logged out for security.' );

                // Log out after 2 seconds (security best practice)
                setTimeout( async () => {
                    await logout();
                }, 2000 );

            } catch ( error ) {
                // Show error
                hideLoading( 'loading' );
                document.getElementById( 'password-form' ).style.display = 'flex';

                let errorMessage = error.message || 'Password change failed. Please try again.';

                // Provide helpful error messages
                if ( errorMessage.includes( 'Current password is incorrect' ) || errorMessage.includes( 'Invalid' ) ) {
                    errorMessage = 'Current password is incorrect. Please try again.';
                    document.getElementById( 'current-password' ).focus();
                } else if ( errorMessage.includes( 'weak' ) ) {
                    errorMessage = 'New password is too weak. Please choose a stronger password.';
                }

                showError( 'error-message', errorMessage );
            }
        } );

        // Auto-focus current password field
        document.getElementById( 'current-password' ).focus();

        console.log( '🔑 Lupin Change Password Page Ready' );
        console.log( 'First time? Enter your generated password, then choose YOUR own password!' );
    </script>
</body>
</html>
