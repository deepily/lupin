<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Viewer — Lupin</title>

    <link rel="stylesheet" href="/static/css/lupin-base.css">
    <link rel="stylesheet" href="/static/css/lupin-nav.css">
    <style>
        .doc-viewer-container {
            max-width: 860px;
            margin: 32px auto;
            padding: 0 24px 48px;
        }

        .doc-viewer-loading {
            text-align: center;
            padding: 64px 0;
            color: #6b7280;
            font-size: 15px;
        }

        .doc-viewer-error {
            text-align: center;
            padding: 64px 0;
            color: #dc2626;
            font-size: 15px;
        }

        /* Markdown typography */
        .doc-viewer-content h1 { font-size: 28px; font-weight: 700; margin: 32px 0 16px; color: #111827; border-bottom: 1px solid #e5e7eb; padding-bottom: 8px; }
        .doc-viewer-content h2 { font-size: 22px; font-weight: 600; margin: 28px 0 12px; color: #1f2937; border-bottom: 1px solid #f3f4f6; padding-bottom: 6px; }
        .doc-viewer-content h3 { font-size: 18px; font-weight: 600; margin: 24px 0 10px; color: #374151; }
        .doc-viewer-content h4 { font-size: 15px; font-weight: 600; margin: 20px 0 8px; color: #4b5563; }
        .doc-viewer-content p  { margin: 12px 0; line-height: 1.7; color: #374151; }
        .doc-viewer-content ul,
        .doc-viewer-content ol { margin: 12px 0; padding-left: 28px; line-height: 1.7; color: #374151; }
        .doc-viewer-content li { margin: 4px 0; }
        .doc-viewer-content a  { color: #4f46e5; text-decoration: none; }
        .doc-viewer-content a:hover { text-decoration: underline; }

        .doc-viewer-content blockquote {
            margin: 16px 0;
            padding: 12px 20px;
            border-left: 4px solid #6366f1;
            background: #f5f3ff;
            color: #4b5563;
        }
        .doc-viewer-content blockquote p { margin: 4px 0; }

        .doc-viewer-content code {
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 13px;
            background: #f3f4f6;
            padding: 2px 6px;
            border-radius: 4px;
            color: #1f2937;
        }

        .doc-viewer-content pre {
            margin: 16px 0;
            padding: 16px;
            background: #1e1e2e;
            color: #cdd6f4;
            border-radius: 8px;
            overflow-x: auto;
            line-height: 1.5;
        }
        .doc-viewer-content pre code {
            background: none;
            padding: 0;
            border-radius: 0;
            color: inherit;
            font-size: 13px;
        }

        .doc-viewer-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 16px 0;
            font-size: 14px;
        }
        .doc-viewer-content th {
            background: #f9fafb;
            font-weight: 600;
            text-align: left;
            padding: 10px 14px;
            border: 1px solid #e5e7eb;
            color: #374151;
        }
        .doc-viewer-content td {
            padding: 10px 14px;
            border: 1px solid #e5e7eb;
            color: #4b5563;
        }

        .doc-viewer-content hr {
            border: none;
            border-top: 1px solid #e5e7eb;
            margin: 24px 0;
        }

        .doc-viewer-content img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 12px 0;
        }

        .doc-frontmatter {
            margin: 0 0 24px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            overflow: hidden;
        }
        .doc-frontmatter summary {
            padding: 10px 16px;
            font-size: 13px;
            font-weight: 600;
            color: #6b7280;
            background: #f9fafb;
            cursor: pointer;
            user-select: none;
        }
        .doc-frontmatter summary:hover { background: #f3f4f6; }
        .doc-frontmatter dl {
            display: grid;
            grid-template-columns: max-content 1fr;
            gap: 4px 16px;
            padding: 12px 16px;
            margin: 0;
            font-size: 13px;
        }
        .doc-frontmatter dt { font-weight: 600; color: #374151; }
        .doc-frontmatter dd { margin: 0; color: #6b7280; word-break: break-word; }

        /* Directory listing — added 2026-05-12 per
           src/rnd/v0.1.7/2026.05.12-doc-viewer-directory-listing.md */
        .doc-dir-breadcrumb {
            margin: 16px 0 24px;
            font-size: 14px;
            color: #6b7280;
        }
        .doc-dir-breadcrumb a {
            color: #4f46e5;
            text-decoration: none;
        }
        .doc-dir-breadcrumb a:hover { text-decoration: underline; }
        .doc-dir-breadcrumb .sep {
            margin: 0 6px;
            color: #d1d5db;
        }
        .doc-dir-breadcrumb .current {
            color: #1f2937;
            font-weight: 600;
        }
        .doc-dir-listing {
            list-style: none;
            margin: 0;
            padding: 0;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            overflow: hidden;
        }
        .doc-dir-entry {
            display: flex;
            align-items: center;
            padding: 3.1640625px 16px;
            border-bottom: 1px solid #f3f4f6;
            transition: background 0.1s ease;
        }
        .doc-dir-entry:last-child { border-bottom: none; }
        .doc-dir-entry:hover { background: #f9fafb; }
        .doc-dir-entry a {
            display: flex;
            align-items: center;
            flex: 1;
            color: #1f2937;
            text-decoration: none;
        }
        .doc-dir-entry a:hover { color: #4f46e5; }
        .doc-dir-icon {
            margin-right: 12px;
            font-size: 16px;
            width: 20px;
            text-align: center;
        }
        .doc-dir-name {
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 13px;
        }
        .doc-dir-meta {
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 12px;
            color: #6b7280;
            margin-left: 16px;
        }
        .doc-dir-empty {
            padding: 32px 16px;
            text-align: center;
            color: #9ca3af;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="doc-viewer-container">
        <div id="doc-viewer-target" class="doc-viewer-loading">Loading document...</div>
    </div>

    <script src="/static/js/lupin-nav.js" defer></script>
    <script src="/static/js/vendor/marked.min.js"></script>
    <script src="/static/js/vendor/purify.min.js"></script>
    <script>
        ( async function() {
            const target = document.getElementById( 'doc-viewer-target' );
            const params = new URLSearchParams( window.location.search );
            // Use ?? not || — empty string is a VALID path for scope=io (root listing)
            const path   = params.get( 'path' ) ?? '';
            const scope  = params.get( 'scope' ) || 'io';

            // Missing path is only an error for scope=docs (scope=io tolerates empty → io root listing)
            if ( params.get( 'path' ) === null && scope === 'docs' ) {
                target.className = 'doc-viewer-error';
                target.textContent = 'No document path specified. Use ?path=<file>&scope=io|docs';
                return;
            }

            // Set page title from filename
            const filename = path.split( '/' ).pop();
            if ( filename ) document.title = filename + ' — Lupin';

            // Dispatch by scope: io = io/-rooted artifacts, docs = whitelisted project docs
            const apiPath = scope === 'docs' ? '/api/docs/file' : '/api/io/file';

            try {
                const response = await fetch( apiPath + '?path=' + encodeURIComponent( path ) );
                if ( !response.ok ) {
                    throw new Error( 'Failed to load document (HTTP ' + response.status + ')' );
                }

                // Polymorphic dispatch by Content-Type:
                // - application/json → directory listing (renderDirectoryListing)
                // - text/* → markdown / text rendering (existing path below)
                const contentType = response.headers.get( 'content-type' ) || '';
                if ( contentType.includes( 'application/json' ) ) {
                    const listing = await response.json();
                    renderDirectoryListing( listing, target );
                    return;
                }

                const markdown = await response.text();

                // Configure marked (mirrors notifications.js renderMarkdown config)
                marked.setOptions( {
                    gfm       : true,
                    breaks    : true,
                    headerIds : false,
                    mangle    : false
                } );

                // Extract YAML frontmatter before parsing markdown
                function extractFrontmatter( text ) {
                    const match = text.match( /^---\n([\s\S]*?)\n---\n?/ );
                    if ( !match ) return { frontmatter: null, body: text };
                    return { frontmatter: match[ 1 ], body: text.slice( match[ 0 ].length ) };
                }

                const { frontmatter, body } = extractFrontmatter( markdown );

                let frontmatterHtml = '';
                if ( frontmatter ) {
                    const lines = frontmatter.split( '\n' )
                        .filter( l => l.includes( ':' ) )
                        .map( l => {
                            const idx = l.indexOf( ':' );
                            const key = l.slice( 0, idx ).trim();
                            const val = DOMPurify.sanitize( l.slice( idx + 1 ).trim().replace( /^['"]|['"]$/g, '' ) );
                            return `<dt>${DOMPurify.sanitize( key )}</dt><dd>${val}</dd>`;
                        } ).join( '' );

                    frontmatterHtml = `
                        <details class="doc-frontmatter">
                            <summary>Document Metadata</summary>
                            <dl>${lines}</dl>
                        </details>`;
                }

                const rawHtml      = marked.parse( body );
                const sanitizedHtml = DOMPurify.sanitize( rawHtml, {
                    ALLOWED_TAGS : [
                        'p', 'br', 'strong', 'b', 'em', 'i', 'u', 's', 'del',
                        'ul', 'ol', 'li',
                        'h1', 'h2', 'h3', 'h4', 'h5', 'h6',
                        'a', 'code', 'pre', 'blockquote',
                        'table', 'thead', 'tbody', 'tr', 'th', 'td',
                        'hr', 'img', 'div', 'span', 'sup', 'sub'
                    ],
                    ALLOWED_ATTR : [ 'href', 'target', 'rel', 'title', 'src', 'alt', 'class' ],
                    ADD_ATTR     : [ 'target', 'rel' ]
                } );

                target.className = 'doc-viewer-content';
                target.innerHTML = frontmatterHtml + sanitizedHtml;

            } catch ( err ) {
                target.className = 'doc-viewer-error';
                target.textContent = err.message;
            }
        } )();

        // Directory-listing renderer — added 2026-05-12 per
        // src/rnd/v0.1.7/2026.05.12-doc-viewer-directory-listing.md
        function renderDirectoryListing( listing, target ) {
            const scope = listing.scope || 'docs';
            const segments = listing.path ? listing.path.split( '/' ) : [];

            // Page title
            const last = segments.length > 0 ? segments[ segments.length - 1 ] : ( scope === 'io' ? 'Lupin IO' : 'Lupin Docs' );
            document.title = last + ' — Lupin';

            // Breadcrumb
            let breadcrumbHtml = '<div class="doc-dir-breadcrumb">';
            const rootLabel = scope === 'io' ? 'IO' : 'Docs';
            if ( segments.length > 0 ) {
                let accumulated = '';
                const parts = [ '<a href="/app/docs?scope=' + scope + '">' + rootLabel + '</a>' ];
                for ( let i = 0; i < segments.length; i++ ) {
                    accumulated = accumulated ? accumulated + '/' + segments[ i ] : segments[ i ];
                    if ( i < segments.length - 1 ) {
                        parts.push( '<a href="/app/docs?path=' + encodeURIComponent( accumulated ) + '&scope=' + scope + '">' + segments[ i ] + '</a>' );
                    } else {
                        parts.push( '<span class="current">' + segments[ i ] + '</span>' );
                    }
                }
                breadcrumbHtml += parts.join( ' <span class="sep">›</span> ' );
            } else {
                breadcrumbHtml += '<span class="current">' + rootLabel + '</span>';
            }
            breadcrumbHtml += '</div>';

            // Entry icon — purely cosmetic, derived from kind + extension
            function iconFor( entry ) {
                if ( entry.kind === 'directory' ) return '📁';
                const dotIdx = entry.name.lastIndexOf( '.' );
                const ext = dotIdx >= 0 ? entry.name.slice( dotIdx ).toLowerCase() : '';
                if ( ext === '.mp3' || ext === '.wav' ) return '🔊';
                if ( ext === '.pdf' ) return '📑';
                if ( ext === '.pptx' ) return '📊';
                return '📄';
            }

            function formatSize( bytes ) {
                if ( bytes === null || bytes === undefined ) return '';
                if ( bytes < 1024 ) return bytes + ' B';
                if ( bytes < 1024 * 1024 ) return ( bytes / 1024 ).toFixed( 1 ) + ' KB';
                if ( bytes < 1024 * 1024 * 1024 ) return ( bytes / ( 1024 * 1024 ) ).toFixed( 1 ) + ' MB';
                return ( bytes / ( 1024 * 1024 * 1024 ) ).toFixed( 1 ) + ' GB';
            }

            let entriesHtml = '<ul class="doc-dir-listing">';
            if ( !listing.entries || listing.entries.length === 0 ) {
                entriesHtml += '<li class="doc-dir-empty">(empty directory)</li>';
            } else {
                for ( const entry of listing.entries ) {
                    entriesHtml += '<li class="doc-dir-entry">';
                    entriesHtml += '<a href="' + entry.view_url + '">';
                    entriesHtml += '<span class="doc-dir-icon">' + iconFor( entry ) + '</span>';
                    entriesHtml += '<span class="doc-dir-name">' + entry.name + '</span>';
                    entriesHtml += '</a>';
                    if ( entry.size !== null && entry.size !== undefined ) {
                        entriesHtml += '<span class="doc-dir-meta">' + formatSize( entry.size ) + '</span>';
                    }
                    entriesHtml += '</li>';
                }
            }
            entriesHtml += '</ul>';

            const sanitized = DOMPurify.sanitize( breadcrumbHtml + entriesHtml, {
                ALLOWED_TAGS : [ 'div', 'span', 'a', 'ul', 'li' ],
                ALLOWED_ATTR : [ 'href', 'class' ]
            } );

            target.className = 'doc-viewer-content';
            target.innerHTML = sanitized;
        }
    </script>
</body>
</html>
