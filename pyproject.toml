# ============================================================================
# Lupin — Python project metadata and dependency declaration
#
# Generated as part of the Tier 0+1 Dockerfile hygiene pass (2026-04-26).
# See: src/rnd/v0.1.7/2026.04.26-dockerfile-cpython-3.11.9-upgrade-to-3.13.13.md
#
# Pinning policy (per the expert plan):
#   - Pin EXACTLY: torch, flash-attn, autoawq (ABI-locked native code)
#   - Range-pin everything else with an upper bound on the next major
#   - Existing exact pins from the prior Dockerfile are preserved here so
#     this PR does not mix Python-version migration with version-bump risk
#
# Lockfile is generated via:
#   docker run --rm -v "$PWD:/work" -w /work ghcr.io/astral-sh/uv:0.8 uv lock
# ============================================================================

[project]
name            = "lupin"
version         = "0.0.0"
description     = "Lupin: AI agent platform"
requires-python = ">=3.13,<3.14"

dependencies = [
  # --- Core ML / inference (ABI-locked exact pins) ---
  "torch==2.6.0",                         # exact pin — avoids PEP 440 local-segment ambiguity (`+cu124` vs `+cpu`)
  "autoawq>=0.2.6",                       # range: 0.2.6 has no cp313 wheels; let resolver pick
  # flash-attn declared in main deps; built non-isolated via [tool.uv] below

  # --- ML libraries ---
  "transformers>=4.46,<5",
  "accelerate>=1,<2",
  "huggingface_hub>=0.26,<1",
  "sentence-transformers==5.2.2",

  # --- LLM clients / orchestration ---
  "openai>=1.50,<2",
  "google-generativeai>=0.8,<1",
  "groq>=0.11,<1",
  "claude-agent-sdk==0.2.88",
  "fastmcp==2.14.2",

  # --- Data / search / memory ---
  "lancedb>=0.13,<1",
  "pylance==0.36.0",
  "kagiapi",
  "tantivy",
  "llama-index==0.14.14",
  "llama-index-embeddings-nomic==0.7.1",

  # --- Web framework ---
  "fastapi>=0.115,<1",
  "pydantic[email]>=2.9,<3",
  "pydantic-ai==0.6.2",                   # 2026-04-28: dropped [slim] — pydantic-ai==0.6.2 has
                                          # NO `slim` extra at the meta-package level (per PyPI
                                          # metadata); the 14 sub-extras are already pulled in
                                          # transitively via pydantic-ai-slim. Old uv lock writer
                                          # was permissive about unknown extras; uv 0.8.x's
                                          # --locked check now enforces consistency. See
                                          # src/rnd/v0.1.7/2026.04.28-uv-lock-pydantic-ai-slim-extra-mismatch.md

  # --- Database ---
  "sqlalchemy==2.0.40",
  "psycopg2-binary==2.9.11",
  "alembic==1.18.1",
  "pgvector==0.4.2",                      # SQLAlchemy Vector type for postgres/pgvector vector-store
                                          # models (v0.2.0 Lane A). Imported at BOOT via
                                          # postgres_models -> vector_store_models. Mirrors the pin in
                                          # src/cosa/requirements.txt:162 — uv sync builds the image
                                          # from pyproject.toml + uv.lock, so it MUST be declared here.

  # --- Push (S6 FCM silent-relay wake channel) ---
  "firebase-admin>=6.5,<7",               # REAL FCM admin SDK (named app "lupin-fcm-wake");
                                          # import stays lazy/optional — FcmWakeService degrades
                                          # to DISABLED when module or credentials are absent (OSQ-7)

  # --- Auth (some pins are pre-3.13-wheel-era; bump if uv lock fails) ---
  "PyJWT==2.10.1",
  "passlib==1.7.4",
  "bcrypt==4.3.0",                        # pinned at 4.3.0 (last 4.x, cp313 wheels) — 5.x breaks passlib 1.7.4 (__about__ removed); see io/plans/2026.04.29-bcrypt-passlib-version-mismatch-plan.md
  "cffi==2.0.0",
  "pycparser==2.23",

  # --- NLP / parsing ---
  "spacy[lookups]>=3.7,<4",
  "scikit-learn>=1.5,<2",
  "tiktoken>=0.7,<1",
  "xmlschema>=3.4,<4",
  "xmltodict==0.14.2",
  "lxml>=5,<6",                           # xmlschema's optional fast parser; required by CalendaringAgent
                                          # (was in src/cosa/requirements.txt but uv sync builds from
                                          # pyproject.toml + uv.lock, so the dep was never reaching the image)

  # --- Audio / media ---
  "pyaudio>=0.2,<1",
  "pydub==0.25.1",
  "audioop-lts; python_version >= '3.13'", # Python 3.13 removed stdlib audioop;
                                           # pydub 0.25.1 imports it. This is the
                                           # community-maintained drop-in shim.

  # --- Visualization ---
  "seaborn==0.13.2",
  "pillow==11.1.0",
  "pixelmatch==0.4.0",

  # --- Utilities ---
  "pandas>=2.2,<3",
  "pyperclip>=1.9,<2",
  "tabulate>=0.9,<1",
  "openapi-to-md==0.1.0b2",               # provides `openapi-to-markdown` + `api2md` console
                                          # scripts used by src/scripts/generate-api-docs.sh.
                                          # Was only ever in the old miniconda venv; exact-pinned
                                          # (beta — no stable release) so uv resolves it without a
                                          # global --prerelease flag.

  # --- Build helpers (kept in main env; flash-attn build needs ninja+packaging) ---
  "wheel",
  "packaging",
  "ninja",

  # --- Native ML build (ABI-locked; built non-isolated, see [tool.uv] below) ---
  "flash-attn>=2.8.3",
]

[dependency-groups]
dev = [
  "pytest==8.4.2",
  "pytest-asyncio==1.2.0",
  "pytest-cov>=7.0.0",
  "pytest-playwright==0.7.2",
  "pytest-playwright-visual-snapshot==0.5.1",
  # Arms @pytest.mark.timeout (row 61ef0e0d). Without it the marker is silently
  # ignored: 6 files carried caps that had NEVER been enforced. Four are
  # subprocess / two-session shapes — precisely the shape that hangs, which is
  # what a cap defends against.
  "pytest-timeout==2.4.0",
]

# flash-attn ABI-locked declaration so uv resolver doesn't try to fetch
# its full requires-dist tree from PyPI metadata (which would re-pull
# `torch` from default PyPI = cu130 wheels and break our cu124 lock).
[[tool.uv.dependency-metadata]]
name         = "flash-attn"
version      = "2.8.3"
requires-dist = ["torch", "einops"]

# ============================================================================
# uv-specific configuration
# ============================================================================
# Torch from PyTorch's cu124 index — matches our `cuda-toolkit-12-4` apt
# install. Default PyPI ships cu130 wheels which mismatch the toolkit's
# nvcc (12.4) and break flash-attn's compile-time CUDA-version check.
# Driver 535+ supports CUDA 12.4 via Minor Version Compatibility.
[[tool.uv.index]]
name     = "pytorch-cu124"
url      = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch       = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
torchaudio  = { index = "pytorch-cu124" }

[tool.uv]
# flash-attn must be built with --no-build-isolation against the resolved
# torch in /opt/venv. uv ensures torch (and the other build deps) install
# before flash-attn so the unisolated build sees them.
no-build-isolation-package = ["flash-attn"]

# ============================================================================
# Coverage — Tier-0 denominator for the CoSA 100%-coverage campaign
#
# Ratified by Rick via interactive walk-through (D2, 2026-05-30). Establishes
# the blessed denominator that reproduces the 45.3% line / 34.8% branch unit
# baseline (raw `--cov=cosa` reads 26.9% only because it counts test files +
# inline scaffolding + GPU-only training code as production source).
#
# Authority: src/rnd/v0.1.8/2026.05.30-cosa-coverage-campaign/00-campaign-plan.md (D2)
#            src/rnd/v0.1.8/2026.05.30-cosa-100pct-coverage-baseline.md §7
#
# Scaffolding NOTE: the `exclude_also` blocks below are a temporary measure.
# `quick_smoke_test()` / `__main__` blocks carry real assertions; the campaign
# harvests them into real pytest, then deletes the block. Retire each regex
# once all such blocks are migrated (D2 harvest -> migrate -> delete pipeline).
# ============================================================================
[tool.coverage.run]
branch = true
# Widened 2026-08-13 (row e2099400, Rick ruled Option C — widen with a ramp). Was
# [ "cosa" ], which left ~40,581 lines across 85 files (the heartbeat/Stop-hook,
# the MCP server, and the arbiter — the three surfaces the fleet's liveness runs
# on) OUTSIDE every denominator, so --cov-fail-under passed while unable to see
# them. The six packages below enter the frame at once; the first run is a
# BASELINE, not a failure. fail_under (below) is set to that honest floor, NOT
# 100 — the ramp back up to 100 has a named owner (Tiffany) and is tracked on
# this row, per Rick's condition that a ramp without an owner is worse than none.
# DIRECTORY PATHS, not package names, on purpose: coverage source-by-name only
# counts a module once it is IMPORTED during the run, so an un-exercised file
# stays OUT of the denominator (the same blindness this row is closing, one
# mechanism over). Directory paths make coverage walk the tree and enter every
# .py at 0%, which is what makes the baseline honest.
source = [
    "src/cosa",
    "src/lupin_cli",
    "src/lupin_mcp",
    "src/lupin_arbiter_app",
    "src/lupin_app",
    "src/lib",
    "src/lupin_model_server",
]
omit   = [
    "*/cosa/tests/*",               # CoSA's own test suites — test code, not a coverage denominator
    "*/cosa/agents/*/tests/*",      # per-agent test suites (podcast_generator, io_models)
    "*/lupin_cli/notifications/test_notifications.py",  # the one inline test file under the widened packages — test code, not a denominator
    # NOTE: a broad "*/test_*.py" was REMOVED 2026-05-31 — it was redundant (real test
    # files already omitted by the two tests-dir globs above) and was HIDING three real
    # prod modules from the 100% mandate: swe_team/test_runner.py, rest/routers/test_suite.py,
    # rest/test_suite_completion_watchdog.py. Those are production code that runs/manages
    # test suites — they must be measured, not omitted by an over-broad filename glob.
    "*/cosa/agents/*/__main__.py",  # CLI entrypoints — glue, run only via `python -m`
    "*/cosa/training/*",            # GPU + user-run-only; untestable in CI per never-grab-GPU mandate
]

[tool.coverage.report]
# BASELINE FLOOR, NOT the 100% target (row e2099400, Rick ruled Option C). When the
# frame widened from cosa-only to the seven packages above, the honest measured
# baseline was 96.26% (unit + cosa tiers: 59,432 stmts, 2,229 missing, measured
# 2026-08-13, ~14 min). fail_under is set to the integer floor BELOW that so the
# gate passes green at the truth instead of red. It is deliberately NOT 100 and
# NOT per-package — a single global floor lets cosa's prior 100% regress silently;
# the ramp back to 100 (per-package thresholds + dates) is owned by Tiffany on this
# row. SCOPE CAVEAT: 96.26% reflects the unit+cosa tiers only; lupin_app (server
# runtime) reads 27.2% here because its paths run under the :8000 integration/e2e
# tiers, not measured in this baseline. Raise this floor as the ramp advances.
fail_under = 96
# exclude_also APPENDS to defaults (keeps `# pragma: no cover` working)
exclude_also = [
    # ⚠️ EXCLUDED BY POLICY, NOT BECAUSE IT IS UNREACHABLE (row 3c0d3d1c, 2026-07-25).
    # This comment used to read "never runs under pytest". That was FALSE and it was
    # load-bearing: the house style WRAPS these blocks in a pytest case, e.g.
    # test_arbiter_routing.py::test_arbiter_routing_quick_smoke, which is green today.
    # An auditor of the 100% mandate who believed "unreachable" would not go looking for
    # the wrapper. On arbiter_routing.py this exclusion removes 47 lines (189-237) from the
    # denominator while the file reports 100% — and a tracked mini-plan-04 edit landed
    # INSIDE that excluded block. The exclusion may well be right; the stated reason was not,
    # and a load-bearing exclusion justified by a false claim is a stale comment on a gate.
    "def quick_smoke_test",         # manual/CLI entrypoint convention — out of the denominator BY POLICY, even where a pytest wrapper exercises it
    "if __name__ == .__main__.:",   # inline main guards inside regular modules
]
