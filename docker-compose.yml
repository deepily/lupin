version: '3.8'

services:
  # PostgreSQL database server (hosts both lupin_db_dev and lupin_db_test)
  # v0.2.0: image swapped stock postgres:16.3-alpine → pgvector/pgvector:pg16 so
  # `CREATE EXTENSION vector` succeeds (LanceDB → pgvector migration). Same PG
  # major 16 → the existing postgresql-dev-data volume is compatible (design §11).
  # Applying this needs `docker compose up -d --force-recreate` (NOT restart) —
  # SHARED-INFRA, coordinated with the operator, not applied from a build session.
  # Cloud-SQL supports pgvector natively → cloud-test/prod compose need no change.
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lupin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lupin_db_dev
      POSTGRES_USER: lupin_dev
      POSTGRES_PASSWORD: dev_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=en_US.UTF-8 --lc-ctype=en_US.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      # Postgres data lives outside the build context so BuildKit's context loader
      # never has to stat a 0700-owned dir. Same physical disk, same UID 70 / 0700.
      # Relocated 2026-04-30 (Session b195a160).
      - /mnt/DATA01/include/www.deepily.ai/projects/lupin-data/postgresql-dev-data:/var/lib/postgresql/data
      - ./src/scripts/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./src/scripts/sql/seed_dev_data.sql:/docker-entrypoint-initdb.d/02-seed.sql
      - ./src/scripts/sql/init-test-db.sql:/docker-entrypoint-initdb.d/03-init-test-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lupin_dev -d lupin_db_dev"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - lupin-dev-network

  # Lupin Model Server — frozen GPU model host (port 7998)
  # Hosts Whisper + 2 text encoders. Compute containers (lupin-rest-dev,
  # lupin-rest-test) call out over HTTP for inference. Code in this container
  # does NOT evolve (freeze property) — that's what makes uvicorn --reload
  # safe in the compute containers (they no longer touch CUDA).
  #
  # GPU pinning: CUDA_VISIBLE_DEVICES=0 — Lupin models ALWAYS load on GPU 0
  # per the hard rule (see memory: feedback_lupin_models_always_gpu_0). The
  # `count: all` reservation gives docker access to both devices; the env var
  # constrains torch to GPU 0 specifically.
  #
  # Phase 4 of the carve-out will:
  #   - Strip `deploy.resources.reservations.devices` from lupin-rest-{dev,test}
  #   - Add `depends_on: lupin-model-server: condition: service_healthy` to both
  #   - Drop the 3 model pre-downloads from docker/lupin/Dockerfile:208-210
  # Until Phase 4 lands, compute containers keep loading their own models
  # in-process (Phase 1-3 are safe checkpoints — see blast-radius analysis).
  #
  # Design doc: src/rnd/v0.1.7/2026.05.16-model-server-carveout/01-design.md
  lupin-model-server:
    image: lupin-model-server:0.1.0   # candidate tag; per feedback_no_auto_promote_tags, never auto-promote to :latest or :1.0.0 without user confirmation
    container_name: lupin-model-server
    restart: unless-stopped
    user: "1001:1001"
    ports:
      - "7998:7998"
    volumes:
      # NOTE 2026-05-16: HF cache bind-mount intentionally OMITTED. The image
      # bakes all 3 models at build time into /home/rruiz/.cache/huggingface
      # so the container is self-sufficient. An earlier bind-mount of a host
      # path overwrote the baked cache with an empty (and wrong-permissions)
      # directory → all 3 loads failed with PermissionError. Removed in favor
      # of the baked-cache freeze property; rebuild the image to refresh the
      # baked models if HuggingFace publishes a new version.
      #
      # Optional warmup audio so Whisper's first inference latency is paid
      # at boot, not at first request.
      - ./src/conf/warmup:/var/lupin/src/conf/warmup:ro
      # API key file — model-server reads plaintext from this dir at lifespan
      # boot and bcrypt-hashes once. Read-only mount; key file is the same
      # `notification-api-claude-code-dev` the compute containers send as
      # X-API-Key (per María's 2026-05-16 brief — single namespace).
      - ./src/conf/keys:/var/lupin/src/conf/keys:ro
    environment:
      LUPIN_MODEL_SERVER_DEVICE: cuda:0
      LUPIN_MODEL_SERVER_PORT: "7998"
      LUPIN_MODEL_SERVER_WHISPER_ID: distil-whisper/distil-large-v3
      LUPIN_MODEL_SERVER_CODE_EMBED: nomic-ai/CodeRankEmbed
      LUPIN_MODEL_SERVER_PROSE_EMBED: nomic-ai/nomic-embed-text-v1.5
      LUPIN_MODEL_SERVER_WARMUP_MP3: /var/lupin/src/conf/warmup/whisper-warmup-85s.mp3
      # API key contract — REVISED 2026-07-28 (rows 574fd1dc / 6cc52525).
      #
      # ⚠️ THIS BLOCK USED TO SAY: "Model-server REUSES the existing
      # `notification-api-claude-code-dev` ck_live_* key ... No env-var ceremony,
      # no parallel namespace, no DB coupling." That reuse read as thrift and was
      # the defect. The two keys answer to DIFFERENT AUTHORITIES:
      #
      #   notification-api-claude-code-dev -> bcrypt-checked against THAT
      #        DEPLOYMENT'S `api_keys` table. Correct value DIFFERS per host,
      #        and it must be minted ON the target (env-contract.tsv:48,
      #        "never ship it from dev" — reverted footgun 90b56fd4).
      #   model-server-api                 -> mounted from ONE Secret Manager
      #        version and bcrypt-hashed at BOOT. Correct value is IDENTICAL
      #        everywhere, and it IS shipped to every caller host.
      #
      # One file cannot satisfy both. On this dev box they coincided by accident
      # (dev's key had been seeded into Secret Manager), which is why the flaw
      # was invisible here; on the VM they cannot, and /embeddings/generate
      # returned 100% 401 for ~38h with the VM's key matching NEITHER secret
      # version. /transcribe was failing the same way, unreported.
      #
      # The CLIENT reads this same var name (embedding_provider._http_api_key,
      # speech_to_text_provider._model_server_api_key) so the two ends cannot
      # drift by editing one of them.
      # src/rnd/v0.1.9/2026.07.28-model-server-api-key-decoupling.md
      LUPIN_MODEL_SERVER_API_KEY_NAME: model-server-api
      # GPU 0 pin (per memory rule feedback_lupin_models_always_gpu_0) — torch
      # sees only the device at index 0; the underlying device may be physical
      # GPU 0 or 1 depending on docker's enumeration, but we always present
      # a single device to the container as `cuda:0`.
      CUDA_VISIBLE_DEVICES: "0"
      PYTHONUNBUFFERED: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
        limits:
          memory: 8G
    healthcheck:
      # Python urllib (matches compute container convention; curl is not in
      # the lean model-server image). start_period: 60s accounts for the
      # 25-30s model-load window before /health switches from 503 → 200.
      test: ["CMD-SHELL", "python3 -c \"import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:7998/health', timeout=3).getcode() == 200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - lupin-dev-network

  # Lupin REST API — Development (port 7999)
  # Always runs [Lupin: Development] config with lupin_db_dev.
  # uvicorn --reload enabled for live code changes during development.
  lupin-rest-dev:
    image: lupin:1.1.2-agy-candidate    # 2026-07-11: agy (Antigravity CLI) baked in (Rio, Rick user_direct). Rollback: lupin:1.1.1-pgvector-candidate. Prior: 1.1.1-pgvector-candidate (v0.2.0 pgvector swap, gate d93a1edb).
    container_name: lupin-rest-dev
    restart: unless-stopped
    user: "1001:1001"
    ports:
      - "7999:7999"
    # host.docker.internal → host gateway so the in-container :7999 reverse-proxy
    # reaches the host-side standalone arbiter on :8001 (Option 2, 2026-06-08).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./src:/var/lupin/src
      - ./io:/var/lupin/io
      # DM traffic corpus — lives OUTSIDE the repo (Rick 2026-08-13) so an
      # accumulating data file is not sitting in the checkout where `git clean
      # -xdf` would take it and `git status` keeps offering it. Same host dir
      # for both servers; rows carry server_port + boot_id to stay separable.
      - /mnt/DATA01/include/www.deepily.ai/projects-data/lupin/dm-corpus:/var/lupin/dm-corpus
      - ./pytest.ini:/var/lupin/pytest.ini:ro
      # Repo-root deploy artifacts the unit suite ASSERTS ABOUT (bug b5b6d252).
      # Without these, 19 unit tests fail in-container with FileNotFoundError
      # while passing on the host — the merge gate publishing environment noise
      # as test failures, which trains readers to discount its red. Read-only:
      # the tests only ever read them, and a writable mount would let a test
      # rewrite the deploy config it is asserting about.
      - ./docker-compose.yml:/var/lupin/docker-compose.yml:ro
      - ./docker-compose.cloud-gpu.yml:/var/lupin/docker-compose.cloud-gpu.yml:ro
      - ./docker-compose.cloud-test.yml:/var/lupin/docker-compose.cloud-test.yml:ro
      - ./docker:/var/lupin/docker:ro
      - ./.dockerignore:/var/lupin/.dockerignore:ro
      - ./.docview.yml:/var/lupin/.docview.yml:ro
      - ./.gitleaks.toml:/var/lupin/.gitleaks.toml:ro
      - ./.stylelintrc.json:/var/lupin/.stylelintrc.json:ro
      - ./alembic.ini:/var/lupin/alembic.ini:ro
      - ./cloud-test.env.example:/var/lupin/cloud-test.env.example:ro
      - ./package.json:/var/lupin/package.json:ro
      - ./package-lock.json:/var/lupin/package-lock.json:ro
      - ./pyproject.toml:/var/lupin/pyproject.toml:ro
      - ./tsconfig.json:/var/lupin/tsconfig.json:ro
      - ./tsconfig.diagnostic.json:/var/lupin/tsconfig.diagnostic.json:ro
      - ./tsconfig.nav.json:/var/lupin/tsconfig.nav.json:ro
      - ./.git:/var/lupin/.git
      # TFE/BFE worktrees preserved under host project root so operator can
      # inspect agent commits after Phase 5 even across container rm.
      # Added 2026-04-18 Session be57a252 alongside auto_cleanup=false flip.
      - ./.claude/worktrees:/var/lupin/.claude/worktrees
      - ~/.lora_env:/home/rruiz/.lora_env:ro
      - ~/.lupin:/home/rruiz/.lupin:ro
      # CC OAuth login store — this container's OWN grant, not a share of the
      # host's (row c7c60896, ruled 2026-08-02; same shape the cloud files have
      # always used). Seed once with `docker exec -it lupin-rest-dev claude /login`.
      #
      # WHY NOT the host's ~/.claude/.credentials.json as a single-file bind — the
      # shape this replaces: docker resolves a single-file bind ONCE, at container
      # start. Claude Code renews its token by REPLACING the file (write temp, then
      # rename), which mints a new inode. The container keeps holding the old one and
      # 401s until somebody restarts it. The access token lives exactly 8h, so that
      # fired ~3x/day. Dropping `:ro` does not help — rename-over-a-bind-mounted-FILE
      # fails "Resource busy" regardless. A host symlink does not help either: rename
      # replaces the SYMLINK, not its target (both measured, 2026-08-01/02).
      - claude-creds-dev:/home/rruiz/.claude
      # CC session bridges — the HOST hook writes these; the container reads/rewrites
      # them via set_voice_persona(). Read-write so the cosa-voice conversation-mode
      # endpoint can flip conversation_mode_active. Container runs as rruiz (uid 1001,
      # matches host) so ownership is preserved on writes.
      #
      # ⚠️ MUST STAY BELOW claude-creds-dev. That volume mounts over the WHOLE
      # /home/rruiz/.claude and SHADOWS this path; nested-deeper wins only because
      # compose applies it after. Getting this wrong 404s request_persona() — the
      # exact defect the VM hit on 2026-07-24. Verify BOTH mounts with `docker inspect`
      # after any recreate.
      #
      # Long form + create_host_path:false on purpose: a short `~/...` bind silently
      # CREATES an empty dir when the path is absent, which looks identical to
      # "mounted but empty". Fail loud instead.
      - type: bind
        source: ${LUPIN_HOST_SESSIONS_DIR:-/home/rruiz/.claude/sessions}
        target: /home/rruiz/.claude/sessions
        bind:
          create_host_path: false
      # Multi-repo doc viewer (2026-05-12) — exposes Rick's other repos as
      # named `scope`s in /api/docs/file. Read-only by design (viewer never writes).
      # See src/rnd/v0.1.7/2026.05.12-multi-repo-doc-viewer.md §3h.
      - /mnt/DATA01/include/www.deepily.ai/projects:/var/external-projects:ro
      - ~/.claude/plans:/var/external-claude/plans:ro
    environment:
      LUPIN_ROOT: /var/lupin
      LUPIN_ENV: development
      LUPIN_CONFIG_MGR_CLI_ARGS: "config_path=/src/conf/lupin-app.ini splainer_path=/src/conf/lupin-app-splainer.ini config_block_id=Lupin:+Development"
      # DM traffic corpus — OUTSIDE the repo (Rick 2026-08-13). Points at the
      # bind-mount below, which is the host's <projects-data>/lupin/dm-corpus.
      # ⚠️ Env + mounts resolve at container CREATE: picking this up needs
      # `docker compose up -d --force-recreate`, never a plain restart.
      LUPIN_DM_CORPUS_DIR: /var/lupin/dm-corpus
      LUPIN_SERVER_PORT: "7999"
      DB_HOST: lupin-postgres
      LUPIN_API_URL: http://localhost:7999
      LUPIN_API_KEY_FILE: /var/lupin/src/conf/keys/notification-api-claude-code-dev
      # The model-server client's own credential — NOT the notifications key
      # above. That one is per-database and must never be shipped from dev;
      # this one is a single mounted secret, identical on every host and
      # shipped to all of them. Sharing them caused a 38h 100% 401 on
      # /embeddings/generate plus an unreported one on /transcribe.
      # src/rnd/v0.1.9/2026.07.28-model-server-api-key-decoupling.md
      LUPIN_MODEL_SERVER_API_KEY_NAME: model-server-api
      # Model-server carve-out env vars (2026-05-16). Until Phase 3.6 lifespan
      # switch lands and `speech to text provider = model-server` in INI, these
      # are dormant — code reads them but doesn't act. See:
      #   src/rnd/v0.1.7/2026.05.16-model-server-carveout/01-design.md
      LUPIN_MODEL_SERVER_URL: ${LUPIN_MODEL_SERVER_URL:-http://lupin-model-server:7998}
      LUPIN_MODEL_SERVER_API_KEY_FILE: /var/lupin/src/conf/keys/lupin-model-server-auth
      LUPIN_TEST_INTERACTIVE_MOCK_JOBS_EMAIL: ${LUPIN_TEST_INTERACTIVE_MOCK_JOBS_EMAIL:?must be set in shell env}
      LUPIN_TEST_INTERACTIVE_MOCK_JOBS_PASSWORD: ${LUPIN_TEST_INTERACTIVE_MOCK_JOBS_PASSWORD:?must be set in shell env}
      # Mirrors the test container — enables proxy-integration tests when
      # they're invoked manually against :7999 during development.
      LUPIN_INTERACTIVE_TESTS: "true"
      # GitHub CLI token pass-through for TFE/BFE Phase 5 (`gh pr create`).
      # Optional — empty default means no hard requirement if the operator
      # doesn't have GH_TOKEN set. Phase 5 will fail loudly if auth missing.
      # Added 2026-04-18 Session be57a252 to pair with preflight probe 6.
      GH_TOKEN: ${GH_TOKEN:-}
      CHROME_PATH: /home/rruiz/.cache/ms-playwright/chromium-1208/chrome-linux64/chrome
      PYTHONUNBUFFERED: 1
      # bug b39c350d — `./src` is bind-mounted, so `src/**/__pycache__` is SHARED between
      # two interpreters whose repo roots differ (host /mnt/DATA01/…, container /var/lupin/…).
      # A .pyc bakes co_filename as an absolute path, and both venues see identical source
      # mtime+size, so neither recompiles: the venue that did NOT write the cache runs code
      # naming a path that does not exist for it. Census of the shared tree, 4008 first-party
      # entries: 2202 host-written, 708 container-written, 565 relative, 129 pointing at the
      # project's pre-rename path. Measured consequence on the host at repo root — 708/708
      # container-written and 129/129 pre-rename entries render NO SOURCE in a traceback
      # (linecache.getlines returns []), and coverage keys on the same co_filename.
      #
      # Sending the container's bytecode to a container-LOCAL dir un-shares the directory.
      # Confirmed rather than assumed (the two things this remedy depends on):
      #   1. with pycache_prefix set, __cached__ resolves under the prefix and the in-tree
      #      __pycache__ is IGNORED even when present — so the 4008 pre-existing shared
      #      entries go inert for the container without having to be purged.
      #   2. pytest's assertion rewriter honors it: the *-pytest-*.pyc lands under the
      #      prefix, and the in-tree __pycache__ gains nothing.
      # /tmp because it is container-local (only ./src and ./io are bind-mounted) and always
      # writable by uid 1001; a bytecode cache needs no durability across restarts.
      PYTHONPYCACHEPREFIX: /tmp/pycache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:7999/health', timeout=3)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - lupin-dev-network
    depends_on:
      postgres:
        condition: service_healthy

  # Lupin REST API — Testing (port 8000 on host, 7999 internally)
  # Always runs [Lupin: Testing] config with lupin_db_test.
  # uvicorn --reload DISABLED for stable test execution (no deadlock risk).
  # Companion credentials (admin user + API key) auto-seeded from dev DB
  # on every startup via seed_test_companions.py.
  lupin-rest-test:
    # 2026-07-27 (Krishna, rows 719962ed/b5b6d252): test DIVERGES from dev by exactly
    # three binaries — tmux, node v22.15.0, terraform v1.12.2 — so the scheduled tier
    # stops silencing 6 tmux-gated assertions and can run the typescript tier at all.
    # Measured a true delta, not an upstream jump: dpkg 523 -> 527 (tmux + libevent-core
    # + libutempter0 + unzip), ZERO removed, ZERO version changes; chromium-1208, the
    # pip freeze hash and the bundled CC 2.1.161 all byte-identical to 1.1.2 — so the
    # e2e visual tier sees no drift. Dev stays on 1.1.2 ONLY because recreating
    # lupin-rest-dev bounces Rick's live :7999; the image is correct for dev too.
    # Rollback: lupin:1.1.2-agy-candidate.
    image: lupin:1.1.3-testtoolchain-candidate
    container_name: lupin-rest-test
    restart: unless-stopped
    user: "1001:1001"
    command: ["/bin/bash", "/var/lupin/src/scripts/run-fastapi-lupin-test.sh"]
    ports:
      - "8000:7999"
    # host.docker.internal → host gateway so the in-container :8000 reverse-proxy
    # reaches the host-side standalone arbiter on :8001 (Option 2, 2026-06-08).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./src:/var/lupin/src
      - ./io:/var/lupin/io
      # DM traffic corpus — lives OUTSIDE the repo (Rick 2026-08-13) so an
      # accumulating data file is not sitting in the checkout where `git clean
      # -xdf` would take it and `git status` keeps offering it. Same host dir
      # for both servers; rows carry server_port + boot_id to stay separable.
      - /mnt/DATA01/include/www.deepily.ai/projects-data/lupin/dm-corpus:/var/lupin/dm-corpus
      - ./pytest.ini:/var/lupin/pytest.ini:ro
      # Repo-root deploy artifacts the unit suite ASSERTS ABOUT (bug b5b6d252).
      # Without these, 19 unit tests fail in-container with FileNotFoundError
      # while passing on the host — the merge gate publishing environment noise
      # as test failures, which trains readers to discount its red. Read-only:
      # the tests only ever read them, and a writable mount would let a test
      # rewrite the deploy config it is asserting about.
      - ./docker-compose.yml:/var/lupin/docker-compose.yml:ro
      - ./docker-compose.cloud-gpu.yml:/var/lupin/docker-compose.cloud-gpu.yml:ro
      - ./docker-compose.cloud-test.yml:/var/lupin/docker-compose.cloud-test.yml:ro
      - ./docker:/var/lupin/docker:ro
      - ./.dockerignore:/var/lupin/.dockerignore:ro
      - ./.docview.yml:/var/lupin/.docview.yml:ro
      - ./.gitleaks.toml:/var/lupin/.gitleaks.toml:ro
      - ./.stylelintrc.json:/var/lupin/.stylelintrc.json:ro
      - ./alembic.ini:/var/lupin/alembic.ini:ro
      - ./cloud-test.env.example:/var/lupin/cloud-test.env.example:ro
      - ./package.json:/var/lupin/package.json:ro
      - ./package-lock.json:/var/lupin/package-lock.json:ro
      # node_modules — the `typescript` tier's ONLY source of c8/tsx/esbuild.
      # node is baked into the image (Dockerfile TEST-TIER TOOLCHAIN block) but
      # node_modules is in .dockerignore and deliberately NOT baked, so `npx c8`
      # would resolve to nothing without this bind. Binary present != tier runnable
      # — that is the whole of row 719962ed. Read-only: the tier never installs.
      # TEST-ONLY divergence, declared in test_compose_service_parity.py.
      - ./node_modules:/var/lupin/node_modules:ro
      - ./pyproject.toml:/var/lupin/pyproject.toml:ro
      - ./tsconfig.json:/var/lupin/tsconfig.json:ro
      - ./tsconfig.diagnostic.json:/var/lupin/tsconfig.diagnostic.json:ro
      - ./tsconfig.nav.json:/var/lupin/tsconfig.nav.json:ro
      - ./.git:/var/lupin/.git
      # TFE/BFE worktrees preserved under host project root so operator can
      # inspect agent commits after Phase 5 even across container rm.
      # Added 2026-04-18 Session be57a252 alongside auto_cleanup=false flip.
      - ./.claude/worktrees:/var/lupin/.claude/worktrees
      - ~/.lora_env:/home/rruiz/.lora_env:ro
      # CC OAuth login store — this container's OWN grant. See the long note on
      # lupin-rest-dev's claude-creds-dev mount for why the single-file bind this
      # replaces went 401 ~3x/day (row c7c60896, ruled 2026-08-02).
      #
      # DELIBERATELY a SEPARATE volume from dev's, not a shared one: two containers
      # renewing one credential would re-create the same two-writers race this change
      # exists to remove, just between dev and test instead of host and container.
      # The price is one `docker exec -it lupin-rest-test claude /login` of its own.
      - claude-creds-test:/home/rruiz/.claude
      # 2026-04-28: dev-test parity fix. cosa-voice MCP validates lupin-project
      # credentials at startup by reading ~/.lupin/config; tests that hit the
      # notification dispatch path need this. Same mount as lupin-rest-dev.
      - ~/.lupin:/home/rruiz/.lupin:ro
      # 2026-04-28: dev-test parity fix (also flagged in TODO Session aabece5e
      # follow-ups). Conversation-mode endpoint reads the per-session bridge
      # files written by SessionStart hook; without this mount the endpoint
      # can't see them and tests that exercise conversation_mode_active fail.
      #
      # ⚠️ MUST STAY BELOW claude-creds-test — that volume shadows the whole
      # /home/rruiz/.claude. Same trap as dev; see the note there.
      - type: bind
        source: ${LUPIN_HOST_SESSIONS_DIR:-/home/rruiz/.claude/sessions}
        target: /home/rruiz/.claude/sessions
        bind:
          create_host_path: false
      # Multi-repo doc viewer (2026-05-12) — exposes Rick's other repos as
      # named `scope`s in /api/docs/file. Read-only by design (viewer never writes).
      # See src/rnd/v0.1.7/2026.05.12-multi-repo-doc-viewer.md §3h.
      - /mnt/DATA01/include/www.deepily.ai/projects:/var/external-projects:ro
      - ~/.claude/plans:/var/external-claude/plans:ro
    environment:
      LUPIN_ROOT: /var/lupin
      LUPIN_ENV: testing
      LUPIN_CONFIG_MGR_CLI_ARGS: "config_path=/src/conf/lupin-app.ini splainer_path=/src/conf/lupin-app-splainer.ini config_block_id=Lupin:+Testing"
      # DM traffic corpus — same host directory as :7999 (see the dev service).
      # The two servers share ONE corpus; `server_port` + `boot_id` on every row
      # are what keep their traffic tellable apart.
      LUPIN_DM_CORPUS_DIR: /var/lupin/dm-corpus
      LUPIN_SERVER_PORT: "8000"
      DB_HOST: lupin-postgres
      LUPIN_API_URL: http://localhost:7999
      LUPIN_API_KEY_FILE: /var/lupin/src/conf/keys/notification-api-claude-code-dev
      # The model-server client's own credential — NOT the notifications key
      # above. That one is per-database and must never be shipped from dev;
      # this one is a single mounted secret, identical on every host and
      # shipped to all of them. Sharing them caused a 38h 100% 401 on
      # /embeddings/generate plus an unreported one on /transcribe.
      # src/rnd/v0.1.9/2026.07.28-model-server-api-key-decoupling.md
      LUPIN_MODEL_SERVER_API_KEY_NAME: model-server-api
      # Model-server carve-out env vars (2026-05-16). Dormant until Phase 3.6
      # lifespan switch + INI flip to `speech to text provider = model-server`.
      LUPIN_MODEL_SERVER_URL: ${LUPIN_MODEL_SERVER_URL:-http://lupin-model-server:7998}
      LUPIN_MODEL_SERVER_API_KEY_FILE: /var/lupin/src/conf/keys/lupin-model-server-auth
      LUPIN_DEV_EMAIL: ricardo.felipe.ruiz@gmail.com
      LUPIN_TEST_INTERACTIVE_MOCK_JOBS_EMAIL: ${LUPIN_TEST_INTERACTIVE_MOCK_JOBS_EMAIL:?must be set in shell env}
      LUPIN_TEST_INTERACTIVE_MOCK_JOBS_PASSWORD: ${LUPIN_TEST_INTERACTIVE_MOCK_JOBS_PASSWORD:?must be set in shell env}
      # Enables proxy-integration tests (test_swe_team_proxy etc.). Tests
      # self-abort when this is unset. The test container is dedicated to
      # automated test runs, so it should always have this on.
      LUPIN_INTERACTIVE_TESTS: "true"
      # GitHub CLI token pass-through for TFE/BFE Phase 5 (`gh pr create`).
      # Optional — empty default means no hard requirement if the operator
      # doesn't have GH_TOKEN set. Phase 5 will fail loudly if auth missing.
      # Added 2026-04-18 Session be57a252 to pair with preflight probe 6.
      GH_TOKEN: ${GH_TOKEN:-}
      CHROME_PATH: /home/rruiz/.cache/ms-playwright/chromium-1208/chrome-linux64/chrome
      PYTHONUNBUFFERED: 1
      # bug b39c350d — `./src` is bind-mounted, so `src/**/__pycache__` is SHARED between
      # two interpreters whose repo roots differ (host /mnt/DATA01/…, container /var/lupin/…).
      # A .pyc bakes co_filename as an absolute path, and both venues see identical source
      # mtime+size, so neither recompiles: the venue that did NOT write the cache runs code
      # naming a path that does not exist for it. Census of the shared tree, 4008 first-party
      # entries: 2202 host-written, 708 container-written, 565 relative, 129 pointing at the
      # project's pre-rename path. Measured consequence on the host at repo root — 708/708
      # container-written and 129/129 pre-rename entries render NO SOURCE in a traceback
      # (linecache.getlines returns []), and coverage keys on the same co_filename.
      #
      # Sending the container's bytecode to a container-LOCAL dir un-shares the directory.
      # Confirmed rather than assumed (the two things this remedy depends on):
      #   1. with pycache_prefix set, __cached__ resolves under the prefix and the in-tree
      #      __pycache__ is IGNORED even when present — so the 4008 pre-existing shared
      #      entries go inert for the container without having to be purged.
      #   2. pytest's assertion rewriter honors it: the *-pytest-*.pyc lands under the
      #      prefix, and the in-tree __pycache__ gains nothing.
      # /tmp because it is container-local (only ./src and ./io are bind-mounted) and always
      # writable by uid 1001; a bytecode cache needs no durability across restarts.
      PYTHONPYCACHEPREFIX: /tmp/pycache
      # v2 paired-eval live run (row d8d019f6): the v1 arm reads the pinned
      # v1 baseline server standing on the HOST at :7997 (git_sha b0735467).
      # Must live on the CONTAINER env — the submit `env` field is prefix-
      # filtered to TFE_/BFE_/LUPIN_TEST_ (attestation.py:27) and would drop
      # this var silently. host.docker.internal resolves via extra_hosts host-gateway.
      LUPIN_V1_ARM_BASE_URL: http://host.docker.internal:7997
      # v2 paired-eval sample size (row d8d019f6). Design default is 60, but the full
      # n=60 run (v1+v2, 2 passes each ≈ 1200 real calls, ~2h) far exceeds the test-suite
      # integration timeout (2000s, job.py:84) and gets SIGTERM'd mid-flight. n=10 fits the
      # budget (~200 calls, ~20min) and still yields a genuine median-Δ verdict (50 samples/pass).
      # TEMPORARY run param for the overnight paired run — revert to design default afterward.
      LUPIN_PAIRED_N: "60"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:7999/health', timeout=3)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - lupin-dev-network
    depends_on:
      postgres:
        condition: service_healthy

  # Optional: pgAdmin for database management
  # DISABLED 2026-04-14 (Session 6ae2513c): crash-looping because
  # PGADMIN_DEFAULT_EMAIL=dev@lupin.local is rejected as non-deliverable.
  # Not actively used. Re-enable by uncommenting + switching to a real-looking
  # email (e.g., dev@lupin.dev) if the web GUI is needed.
  # pgadmin:
  #   image: dpage/pgadmin4:latest
  #   container_name: lupin-pgadmin
  #   restart: unless-stopped
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: dev@lupin.local
  #     PGADMIN_DEFAULT_PASSWORD: admin
  #     PGADMIN_CONFIG_SERVER_MODE: 'False'
  #   ports:
  #     - "5050:80"
  #   volumes:
  #     - pgadmin_data:/var/lib/pgadmin
  #   networks:
  #     - lupin-dev-network
  #   depends_on:
  #     - postgres

volumes:
  pgadmin_data:
    driver: local
  # CC OAuth login stores — one per container, each holding its OWN grant
  # (row c7c60896, ruled 2026-08-02). Seed each once with `claude /login` inside
  # the container; the login then renews itself and survives a recreate, which is
  # the whole point — a single-file bind of the host credential could not follow
  # the host's ~3x/day token replacement and 401'd until someone restarted it.
  # Same shape docker-compose.cloud-{gpu,test}.yml have always used.
  claude-creds-dev:
    driver: local
  claude-creds-test:
    driver: local

networks:
  lupin-dev-network:
    external: true
