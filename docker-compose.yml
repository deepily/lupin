version: '3.8'

services:
  # PostgreSQL database server (hosts both lupin_db_dev and lupin_db_test)
  postgres:
    image: postgres:16.3-alpine
    container_name: lupin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lupin_db_dev
      POSTGRES_USER: lupin_dev
      POSTGRES_PASSWORD: dev_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=en_US.UTF-8 --lc-ctype=en_US.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      # Postgres data lives outside the build context so BuildKit's context loader
      # never has to stat a 0700-owned dir. Same physical disk, same UID 70 / 0700.
      # Relocated 2026-04-30 (Session b195a160).
      - /mnt/DATA01/include/www.deepily.ai/projects/lupin-data/postgresql-dev-data:/var/lib/postgresql/data
      - ./src/scripts/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./src/scripts/sql/seed_dev_data.sql:/docker-entrypoint-initdb.d/02-seed.sql
      - ./src/scripts/sql/init-test-db.sql:/docker-entrypoint-initdb.d/03-init-test-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lupin_dev -d lupin_db_dev"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - lupin-dev-network

  # Lupin Model Server — frozen GPU model host (port 7998)
  # Hosts Whisper + 2 text encoders. Compute containers (lupin-rest-dev,
  # lupin-rest-test) call out over HTTP for inference. Code in this container
  # does NOT evolve (freeze property) — that's what makes uvicorn --reload
  # safe in the compute containers (they no longer touch CUDA).
  #
  # GPU pinning: CUDA_VISIBLE_DEVICES=0 — Lupin models ALWAYS load on GPU 0
  # per the hard rule (see memory: feedback_lupin_models_always_gpu_0). The
  # `count: all` reservation gives docker access to both devices; the env var
  # constrains torch to GPU 0 specifically.
  #
  # Phase 4 of the carve-out will:
  #   - Strip `deploy.resources.reservations.devices` from lupin-rest-{dev,test}
  #   - Add `depends_on: lupin-model-server: condition: service_healthy` to both
  #   - Drop the 3 model pre-downloads from docker/lupin/Dockerfile:208-210
  # Until Phase 4 lands, compute containers keep loading their own models
  # in-process (Phase 1-3 are safe checkpoints — see blast-radius analysis).
  #
  # Design doc: src/rnd/v0.1.7/2026.05.16-model-server-carveout/01-design.md
  lupin-model-server:
    image: lupin-model-server:0.1.0   # candidate tag; per feedback_no_auto_promote_tags, never auto-promote to :latest or :1.0.0 without user confirmation
    container_name: lupin-model-server
    restart: unless-stopped
    user: "1001:1001"
    ports:
      - "7998:7998"
    volumes:
      # NOTE 2026-05-16: HF cache bind-mount intentionally OMITTED. The image
      # bakes all 3 models at build time into /home/rruiz/.cache/huggingface
      # so the container is self-sufficient. An earlier bind-mount of a host
      # path overwrote the baked cache with an empty (and wrong-permissions)
      # directory → all 3 loads failed with PermissionError. Removed in favor
      # of the baked-cache freeze property; rebuild the image to refresh the
      # baked models if HuggingFace publishes a new version.
      #
      # Optional warmup audio so Whisper's first inference latency is paid
      # at boot, not at first request.
      - ./src/conf/warmup:/var/lupin/src/conf/warmup:ro
      # API key file — model-server reads plaintext from this dir at lifespan
      # boot and bcrypt-hashes once. Read-only mount; key file is the same
      # `notification-api-claude-code-dev` the compute containers send as
      # X-API-Key (per María's 2026-05-16 brief — single namespace).
      - ./src/conf/keys:/var/lupin/src/conf/keys:ro
    environment:
      LUPIN_MODEL_SERVER_DEVICE: cuda:0
      LUPIN_MODEL_SERVER_PORT: "7998"
      LUPIN_MODEL_SERVER_WHISPER_ID: distil-whisper/distil-large-v3
      LUPIN_MODEL_SERVER_CODE_EMBED: nomic-ai/CodeRankEmbed
      LUPIN_MODEL_SERVER_PROSE_EMBED: nomic-ai/nomic-embed-text-v1.5
      LUPIN_MODEL_SERVER_WARMUP_MP3: /var/lupin/src/conf/warmup/whisper-warmup-85s.mp3
      # API key contract (post-2026-05-16 María-brief simplification):
      # Model-server reuses the existing `notification-api-claude-code-dev`
      # ck_live_* key via the volume-mounted src/conf/keys/ dir. At boot it
      # reads the plaintext via du.get_api_key() and computes a bcrypt hash
      # once; each incoming request is validated via bcrypt.checkpw() against
      # that in-memory hash. No env-var ceremony, no parallel ck_internal_*
      # namespace, no DB coupling.
      LUPIN_MODEL_SERVER_API_KEY_NAME: notification-api-claude-code-dev
      # GPU 0 pin (per memory rule feedback_lupin_models_always_gpu_0) — torch
      # sees only the device at index 0; the underlying device may be physical
      # GPU 0 or 1 depending on docker's enumeration, but we always present
      # a single device to the container as `cuda:0`.
      CUDA_VISIBLE_DEVICES: "0"
      PYTHONUNBUFFERED: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
        limits:
          memory: 8G
    healthcheck:
      # Python urllib (matches compute container convention; curl is not in
      # the lean model-server image). start_period: 60s accounts for the
      # 25-30s model-load window before /health switches from 503 → 200.
      test: ["CMD-SHELL", "python3 -c \"import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:7998/health', timeout=3).getcode() == 200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - lupin-dev-network

  # Lupin REST API — Development (port 7999)
  # Always runs [Lupin: Development] config with lupin_db_dev.
  # uvicorn --reload enabled for live code changes during development.
  lupin-rest-dev:
    image: lupin:1.0.0                       # 2026-04-28: retagged from 1.0.0-fonts → 1.0.0 after WG-1 verification
    container_name: lupin-rest-dev
    restart: unless-stopped
    user: "1001:1001"
    ports:
      - "7999:7999"
    # host.docker.internal → host gateway so the in-container :7999 reverse-proxy
    # reaches the host-side standalone arbiter on :8001 (Option 2, 2026-06-08).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./src:/var/lupin/src
      - ./io:/var/lupin/io
      - ./pytest.ini:/var/lupin/pytest.ini:ro
      - ./.git:/var/lupin/.git
      # TFE/BFE worktrees preserved under host project root so operator can
      # inspect agent commits after Phase 5 even across container rm.
      # Added 2026-04-18 Session be57a252 alongside auto_cleanup=false flip.
      - ./.claude/worktrees:/var/lupin/.claude/worktrees
      - ~/.lora_env:/home/rruiz/.lora_env:ro
      - ~/.lupin:/home/rruiz/.lupin:ro
      - ~/.claude/.credentials.json:/home/rruiz/.claude/.credentials.json:ro
      # Read-write so the cosa-voice conversation-mode endpoint can flip
      # conversation_mode_active in the per-session bridge files written by
      # SessionStart hook. Container runs as rruiz (UID matches host) so file
      # ownership is preserved on writes.
      - ~/.claude/sessions:/home/rruiz/.claude/sessions
      # Multi-repo doc viewer (2026-05-12) — exposes Rick's other repos as
      # named `scope`s in /api/docs/file. Read-only by design (viewer never writes).
      # See src/rnd/v0.1.7/2026.05.12-multi-repo-doc-viewer.md §3h.
      - /mnt/DATA01/include/www.deepily.ai/projects:/var/external-projects:ro
      - ~/.claude/plans:/var/external-claude/plans:ro
    environment:
      LUPIN_ROOT: /var/lupin
      LUPIN_ENV: development
      LUPIN_CONFIG_MGR_CLI_ARGS: "config_path=/src/conf/lupin-app.ini splainer_path=/src/conf/lupin-app-splainer.ini config_block_id=Lupin:+Development"
      DB_HOST: lupin-postgres
      LUPIN_API_URL: http://localhost:7999
      LUPIN_API_KEY_FILE: /var/lupin/src/conf/keys/notification-api-claude-code-dev
      # Model-server carve-out env vars (2026-05-16). Until Phase 3.6 lifespan
      # switch lands and `speech to text provider = model-server` in INI, these
      # are dormant — code reads them but doesn't act. See:
      #   src/rnd/v0.1.7/2026.05.16-model-server-carveout/01-design.md
      LUPIN_MODEL_SERVER_URL: ${LUPIN_MODEL_SERVER_URL:-http://lupin-model-server:7998}
      LUPIN_MODEL_SERVER_API_KEY_FILE: /var/lupin/src/conf/keys/lupin-model-server-auth
      LUPIN_TEST_INTERACTIVE_MOCK_JOBS_EMAIL: ${LUPIN_TEST_INTERACTIVE_MOCK_JOBS_EMAIL:?must be set in shell env}
      LUPIN_TEST_INTERACTIVE_MOCK_JOBS_PASSWORD: ${LUPIN_TEST_INTERACTIVE_MOCK_JOBS_PASSWORD:?must be set in shell env}
      # Mirrors the test container — enables proxy-integration tests when
      # they're invoked manually against :7999 during development.
      LUPIN_INTERACTIVE_TESTS: "true"
      # GitHub CLI token pass-through for TFE/BFE Phase 5 (`gh pr create`).
      # Optional — empty default means no hard requirement if the operator
      # doesn't have GH_TOKEN set. Phase 5 will fail loudly if auth missing.
      # Added 2026-04-18 Session be57a252 to pair with preflight probe 6.
      GH_TOKEN: ${GH_TOKEN:-}
      CHROME_PATH: /home/rruiz/.cache/ms-playwright/chromium-1208/chrome-linux64/chrome
      PYTHONUNBUFFERED: 1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:7999/health', timeout=3)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - lupin-dev-network
    depends_on:
      postgres:
        condition: service_healthy

  # Lupin REST API — Testing (port 8000 on host, 7999 internally)
  # Always runs [Lupin: Testing] config with lupin_db_test.
  # uvicorn --reload DISABLED for stable test execution (no deadlock risk).
  # Companion credentials (admin user + API key) auto-seeded from dev DB
  # on every startup via seed_test_companions.py.
  lupin-rest-test:
    image: lupin:1.0.0
    container_name: lupin-rest-test
    restart: unless-stopped
    user: "1001:1001"
    command: ["/bin/bash", "/var/lupin/src/scripts/run-fastapi-lupin-test.sh"]
    ports:
      - "8000:7999"
    # host.docker.internal → host gateway so the in-container :8000 reverse-proxy
    # reaches the host-side standalone arbiter on :8001 (Option 2, 2026-06-08).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./src:/var/lupin/src
      - ./io:/var/lupin/io
      - ./pytest.ini:/var/lupin/pytest.ini:ro
      - ./.git:/var/lupin/.git
      # TFE/BFE worktrees preserved under host project root so operator can
      # inspect agent commits after Phase 5 even across container rm.
      # Added 2026-04-18 Session be57a252 alongside auto_cleanup=false flip.
      - ./.claude/worktrees:/var/lupin/.claude/worktrees
      - ~/.lora_env:/home/rruiz/.lora_env:ro
      - ~/.claude/.credentials.json:/home/rruiz/.claude/.credentials.json:ro
      # 2026-04-28: dev-test parity fix. cosa-voice MCP validates lupin-project
      # credentials at startup by reading ~/.lupin/config; tests that hit the
      # notification dispatch path need this. Same mount as lupin-rest-dev.
      - ~/.lupin:/home/rruiz/.lupin:ro
      # 2026-04-28: dev-test parity fix (also flagged in TODO Session aabece5e
      # follow-ups). Conversation-mode endpoint reads the per-session bridge
      # files written by SessionStart hook; without this mount the endpoint
      # can't see them and tests that exercise conversation_mode_active fail.
      - ~/.claude/sessions:/home/rruiz/.claude/sessions
      # Multi-repo doc viewer (2026-05-12) — exposes Rick's other repos as
      # named `scope`s in /api/docs/file. Read-only by design (viewer never writes).
      # See src/rnd/v0.1.7/2026.05.12-multi-repo-doc-viewer.md §3h.
      - /mnt/DATA01/include/www.deepily.ai/projects:/var/external-projects:ro
      - ~/.claude/plans:/var/external-claude/plans:ro
    environment:
      LUPIN_ROOT: /var/lupin
      LUPIN_ENV: testing
      LUPIN_CONFIG_MGR_CLI_ARGS: "config_path=/src/conf/lupin-app.ini splainer_path=/src/conf/lupin-app-splainer.ini config_block_id=Lupin:+Testing"
      DB_HOST: lupin-postgres
      LUPIN_API_URL: http://localhost:7999
      LUPIN_API_KEY_FILE: /var/lupin/src/conf/keys/notification-api-claude-code-dev
      # Model-server carve-out env vars (2026-05-16). Dormant until Phase 3.6
      # lifespan switch + INI flip to `speech to text provider = model-server`.
      LUPIN_MODEL_SERVER_URL: ${LUPIN_MODEL_SERVER_URL:-http://lupin-model-server:7998}
      LUPIN_MODEL_SERVER_API_KEY_FILE: /var/lupin/src/conf/keys/lupin-model-server-auth
      LUPIN_DEV_EMAIL: ricardo.felipe.ruiz@gmail.com
      LUPIN_TEST_INTERACTIVE_MOCK_JOBS_EMAIL: ${LUPIN_TEST_INTERACTIVE_MOCK_JOBS_EMAIL:?must be set in shell env}
      LUPIN_TEST_INTERACTIVE_MOCK_JOBS_PASSWORD: ${LUPIN_TEST_INTERACTIVE_MOCK_JOBS_PASSWORD:?must be set in shell env}
      # Enables proxy-integration tests (test_swe_team_proxy etc.). Tests
      # self-abort when this is unset. The test container is dedicated to
      # automated test runs, so it should always have this on.
      LUPIN_INTERACTIVE_TESTS: "true"
      # GitHub CLI token pass-through for TFE/BFE Phase 5 (`gh pr create`).
      # Optional — empty default means no hard requirement if the operator
      # doesn't have GH_TOKEN set. Phase 5 will fail loudly if auth missing.
      # Added 2026-04-18 Session be57a252 to pair with preflight probe 6.
      GH_TOKEN: ${GH_TOKEN:-}
      CHROME_PATH: /home/rruiz/.cache/ms-playwright/chromium-1208/chrome-linux64/chrome
      PYTHONUNBUFFERED: 1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:7999/health', timeout=3)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - lupin-dev-network
    depends_on:
      postgres:
        condition: service_healthy

  # Optional: pgAdmin for database management
  # DISABLED 2026-04-14 (Session 6ae2513c): crash-looping because
  # PGADMIN_DEFAULT_EMAIL=dev@lupin.local is rejected as non-deliverable.
  # Not actively used. Re-enable by uncommenting + switching to a real-looking
  # email (e.g., dev@lupin.dev) if the web GUI is needed.
  # pgadmin:
  #   image: dpage/pgadmin4:latest
  #   container_name: lupin-pgadmin
  #   restart: unless-stopped
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: dev@lupin.local
  #     PGADMIN_DEFAULT_PASSWORD: admin
  #     PGADMIN_CONFIG_SERVER_MODE: 'False'
  #   ports:
  #     - "5050:80"
  #   volumes:
  #     - pgadmin_data:/var/lib/pgadmin
  #   networks:
  #     - lupin-dev-network
  #   depends_on:
  #     - postgres

volumes:
  pgadmin_data:
    driver: local

networks:
  lupin-dev-network:
    external: true
