[pytest]
# Pytest configuration for Lupin project

# Register custom markers
# --strict-markers (below) turns an UNREGISTERED marker into a hard error. It is
# the mechanism that makes the venue split checkable: a guard asserting
# "deselect-set == marker-set" passes trivially when a marker is typo'd, because a
# typo'd test is in NEITHER set. Only strict registration catches that. Adding it
# required registering e2e/visual/slow, which were live-but-unregistered and
# therefore silently typo-vulnerable too. (Row dba10ba5.)
markers =
    manual: Tests requiring manual user interaction (deselected by default)
    integration: Integration tests requiring live server
    e2e: End-to-end UI tests (Playwright); :8000 scheduled venue
    visual: Visual-regression snapshot tests; :8000 scheduled venue
    slow: Long-running tests
    timeout: Per-test wall-clock cap. ARMED 2026-07-27 (row 61ef0e0d) — pytest-timeout
        2.4.0 is installed and pinned in pyproject [dependency-groups] dev. Before that
        the marker was REGISTERED BUT NOT PROVIDED: silently ignored, so the 6 files
        using it had caps that had never once been enforced. There is no global
        --timeout in addopts, so this applies to marked tests ONLY.
        ⚠️ If pytest-timeout is ever uninstalled, the marker goes back to being silently
        ignored and every cap in the tree becomes decoration again WITHOUT any error —
        which is why the dep is pinned rather than optional, and why
        src/tests/unit/test_timeout_marker_is_armed.py asserts the plugin is loaded.
    host_only: The test's SUBJECT is the operator host (installed toolchain, host paths).
        It cannot produce a verdict inside a container and is deselected there BY NAME
        rather than silenced — satisfying it by installing the tool in the container
        would turn the assertion green while its proposition went unverified.

# Skip manual tests by default (run them explicitly with: pytest -m manual)
#
# -p no:structlog_config disables the structlog-config 0.12.4 pytest plugin.
# That plugin's pytest_runtest_makereport appends (call.when, call.excinfo)
# TUPLES to item._excinfo — the SAME attribute pytest's own TestCaseFunction
# uses to store ExceptionInfo objects. For any failing unittest.TestCase,
# pytest's _pytest/unittest.py does `call.excinfo = item._excinfo.pop(0)` then
# reads `call.excinfo.value`, popping the plugin's tuple → AttributeError:
# 'tuple' object has no attribute 'value' → session-aborting INTERNALERROR.
# structlog capture is already disabled (no output dir configured), so the
# plugin contributes nothing but this collision. Disabling it lets failing
# unittest.TestCase tests report cleanly. Revisit if a fixed structlog-config
# (namespaced attr) is adopted or structured-log capture is enabled.
addopts = -m "not manual" --showlocals -p no:structlog_config --strict-markers

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Verbose output for test names
console_output_style = progress

# ---------------------------------------------------------------------------
# Visual Regression Snapshots (Phase 8)
#
# Baselines and failure diffs live under io/test-suite/ (outside src/) so the
# source tree stays free of runtime artifacts. io/ is gitignored; the user
# backs up io/ contents externally so baselines always survive clean checkouts.
# ---------------------------------------------------------------------------
playwright_visual_snapshot_threshold = 0.1
playwright_visual_snapshots_path = io/test-suite/visual-baselines
playwright_visual_snapshot_failures_path = io/test-suite/visual-failures
