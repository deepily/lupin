[pytest]
# Pytest configuration for Lupin project

# Register custom markers
markers =
    manual: Tests requiring manual user interaction (deselected by default)
    integration: Integration tests requiring live server

# Skip manual tests by default (run them explicitly with: pytest -m manual)
addopts = -m "not manual" --showlocals

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Verbose output for test names
console_output_style = progress

# ---------------------------------------------------------------------------
# Visual Regression Snapshots (Phase 8)
#
# Baselines and failure diffs live under io/test-suite/ (outside src/) so the
# source tree stays free of runtime artifacts. io/ is gitignored; the user
# backs up io/ contents externally so baselines always survive clean checkouts.
# ---------------------------------------------------------------------------
playwright_visual_snapshot_threshold = 0.1
playwright_visual_snapshots_path = io/test-suite/visual-baselines
playwright_visual_snapshot_failures_path = io/test-suite/visual-failures
